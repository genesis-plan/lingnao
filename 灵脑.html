    if(!idr.identifiable) return { identifiable: false, hedge: idr.hedge, note: idr.note, method: 'do-calc-unidentifiable', grounding: GROUNDING.KERNEL };
    if(idr.method === 'front-door' && idr.mediator) opts.mediator = idr.mediator;          // 前门：两段式估计
    else if(idr.method === 'back-door') opts.adjustSet = idr.adjustSet;                     // 后门：调整后门集
    else return { identifiable: true, method: 'id-general', formula: idr.formula, mediator: idr.mediator,
      note: idr.note + '（数值 ACE 需通用 ΣΠ/Wald 估计器，见 doQuery 公式；本引擎仅证可识别）', deterministic: true, grounding: GROUNDING.KERNEL };
  }
  if (!model || model.error) return { error: '无模型' };
  if (!samples || !samples.length) return { error: '识别失败', reason: '样本为空' };
  // —— 前门准则分支（吸收 Pearl 前门 + Wienöbst/Jeong 识别算法思想）——
  if (opts.mediator) {
    const M = opts.mediator;
    const xs = samples.map(s => _sampVar(s, cause)); if (xs.some(v => v == null)) return { error: '前门不适用', reason: 'cause ' + cause + ' 在样本缺失' };
    const ms = samples.map(s => _sampVar(s, M)); if (ms.some(v => v == null)) return { error: '前门不适用', reason: '中介 ' + M + ' 在样本缺失' };
    const ys = samples.map(s => _sampVar(s, effect)); if (ys.some(v => v == null)) return { error: '前门不适用', reason: 'effect ' + effect + ' 在样本缺失' };
    const Xb1 = samples.map(s => [1, _sampVar(s, cause)]);

    const b = _ols(Xb2, ys); const beta = +b[1].toFixed(6);            // 阶段2：Y ~ 1 + M + X

      identifiability: '前门三条件由调用方声明（M 截断所有 X→Y 路径 / 无 X→M 后门 / X 阻断 M→Y 后门）',
      handlesUnobservedConfounder: true, auditable: true, imaRef: ['ima_304', 'ima_301'], grounding: GROUNDING.KERNEL, deterministic: true,
      note: 'ACE(前门)=α·β=' + alpha + '×' + beta + '=' + ace + '；即使存在未观测混杂 U→X,Y，只要 M 完全观测且屏蔽 U，仍可识别 do 效应' };

  const eq = model.eqs[effect];
  const feats = eq.features.slice();
  if (feats.indexOf(cause) < 0) return { ace: 0, method: 'back-door-adjustment-linear-SEM', adjustSet: [], auditable: true, imaRef: ['ima_304'],

  const y = samples.map(s => { const v = _sampVar(s, effect); return v == null ? 0 : v; });

// 验证：PrSTL 概率信号时序逻辑运行时监控（安全停车，文档 验证架构）
// 验证：运行时监视器——消费 PrSTL 概率时序逻辑时态语义（ima_238/394）
//   把安全约束编译为时态公式并真值评估，而非仅比较标量：
//   • G(每步代价 within maxCost)         ≡ □(run ⇒ within(bound))  —— 全局(always)算子
//   • G(每步状态 ∉ hardNodes)            —— 硬约束节点全程不可达
//   G(φ) 的真值 = 轨迹 trace 每一步都满足 φ（时态算子语义，非 threshold 贴标）
function runtimeMonitor(path, safety){
  safety = safety || {}; const violations = [];
  const trace = (path.path||[]).map((st, i) => ({ state: st,
    cv: (path.steps && path.steps[i]) ? (path.steps[i].confidence) : null }));
  // PrSTL 求值辅助：G(φ) = 轨迹全步满足 φ
  const G = (phi) => trace.every(phi);
  // 公式1：G(每步代价 within maxCost) —— 逐边累加代价不得超 bound（比"末态 cost"更细，对应 temporal 全程约束）
  if(safety.maxCost != null){
    let acc = 0;
    for(const s of (path.steps||[])){ const e = WORLD.edges.find(e=>e.from===s.state && e.to===s.result); acc += e ? e.w : 0;
      if(acc > safety.maxCost) violations.push('cost>' + safety.maxCost + ' @' + s.state); }
    const termWithin = (path.cost != null) ? (path.cost <= safety.maxCost) : true;
    if(!termWithin) violations.push('terminal cost>' + safety.maxCost);
  }
  // 公式2：G(state ∉ hardNodes) —— 硬约束节点全程不得出现
  const hardOk = G(t => !(safety.hardNodes || []).includes(t.state));
  if(!hardOk) for(const n of (safety.hardNodes || [])) if(path.path.includes(n)) violations.push('违反硬约束节点 ' + n);
  const safe = violations.length === 0;
  // —— STL **定量**语义（robustness degree ρ）：不只回答"是否违反"，还给出"离出事还有多远" ——
  // 构造 φ = □(accCost ≤ maxCost) ∧ □(state ∉ hardNodes)，用 stlRobustness 结构归纳递推。
  let acc2 = 0;
  const rTrace = (path.path || []).map((st, i) => {
    if (i > 0 && path.steps) {
      const s = path.steps[i - 1];
      const e = s ? WORLD.edges.find(e2 => e2.from === s.state && e2.to === s.result) : null;
      acc2 += e ? e.w : 0;
    }
    return { state: st, acc: acc2 };
  });
  const conj = [];
  if (safety.maxCost != null) {
    // ρ = maxCost − 累计代价：正值即"还剩多少预算"，负值即"超支多少"
    conj.push({ op: 'always', a: { op: 'pred', label: 'acc≤maxCost', f: t => safety.maxCost - t.acc } });
  }
  const hardSet = safety.hardNodes || [];
  if (hardSet.length) {
    // ρ = ±1（离散谓词无自然度量）：+1 安全、−1 命中硬约束节点
    conj.push({ op: 'always', a: { op: 'pred', label: 'state∉hard', f: t => hardSet.includes(t.state) ? -1 : 1 } });
  }
  let stl = null;
  if (conj.length && rTrace.length) {
    const phi = conj.length === 1 ? conj[0] : { op: 'and', args: conj };
    stl = stlMonitor(phi, rTrace, { eps: safety.eps == null ? 1e-9 : safety.eps });
  }
  return { safe, violations, action: safe ? 'continue' : 'SAFETY_STOP（安全停车）',
    prstl: { formula: 'G(run ⇒ within(' + (safety.maxCost || '∞') + ')) ∧ G(state ∉ hardNodes)',
      op: 'always(G)', evaluated: true, traceLen: trace.length,
      note: 'PrSTL 时态语义：G(φ) 真值 = 轨迹全步满足 φ（已真值评估，非标量贴标）' },
    // 定量语义结果：ρ>0 满足且为安全余量；ρ<0 违反且为严重度；verdict=null 表示 𝕌 不可判定
    stl: stl,
    rho: stl ? stl.rho : null,
    verdict: stl ? stl.verdict : null,
    robustness: stl
      ? { rho: stl.rho, margin: stl.margin, severity: stl.severity, horizon: stl.horizon,
          enough: stl.enough, note: stl.note }
      : { note: '未提供 maxCost / hardNodes 安全约束 ⇒ 无 STL 公式可评估（不臆造判定）' } };
}

// ⑤ 元认知与协调层（Layer 5，文档 5.1）——此前完全缺失；本实现确定性、可审计、不幻觉
// 职责：全局监控 / 不确定性管理（熵 H(K)）/ 知识缺口识别 / 冲突仲裁 / 探索-利用决策 / 资源调度
// 数学：H(K)=-Σ p(e)log p(e)（信息熵，单位 bit）；C(K)=1-冲突率-α·H(K)（一致性度量，文档七/八）
// 元认知与协调层：不确定性管理基于世界图（边概率信息熵），不依赖内置经验库
function metaCognition(opts={}){
  const edges = WORLD.edges||[];
  const nodes = WORLD.nodes||[];
  const ps = edges.map(e=>edgeP(e)).filter(p=>p>0&&p<1);
  const meanBit = ps.length ? -ps.reduce((a,p)=>a-(p*Math.log2(p)+(1-p)*Math.log2(1-p)),0)/ps.length : 0;
  const H = +meanBit.toFixed(4);
  const hard = (opts.hard||[]);
  const conflictEdges = edges.filter(e=>hard.includes(e.from)&&hard.includes(e.to));
  const conflict = conflictEdges.length > 0;
  const C = +(conflict?0.5:1).toFixed(4);
  const gaps = edges.filter(e=>edgeP(e)<(opts.threshold||0.6))
    .map(e=>({transition:e.from+'→'+e.to, confidence:+edgeP(e).toFixed(2), priority:+(1-edgeP(e)).toFixed(2), reason:'世界图边置信度低'}));
  const globalUncertainty = +(1-C).toFixed(4);
  const Hmax = (ps.length>1)? Math.log2(ps.length):1;
  const uncertaintyFraction = Hmax>0? +(H/Hmax).toFixed(4):0;
  const mode = (gaps.length>0 || uncertaintyFraction>0.5)?'explore':'exploit';
  const pathUnc = opts.path? quantifyUncertainty(opts.path):null;
  return {
    layer:5, name:'元认知与协调层',
    monitoring:{worldNodes:nodes.length, worldEdges:edges.length, lowConfEdges:gaps.length},
    uncertainty:{global:globalUncertainty, entropyH:H, consistencyC:C, path:pathUnc, maxEntropyHmax:+Hmax.toFixed(4), uncertaintyFraction},
    knowledgeGaps:gaps,
    conflictArbitration: conflictEdges,
    decision:{exploreExploit:mode, uncertaintyFraction,
      reason: mode==='explore'?'信息论驱动：世界图熵分数偏高或存在低置信边 → 探索':'世界图置信度高 → 利用'},
    resource:{recommend: gaps.length>3?'high':'low', note:'缺口越多建议分配更多推理资源'}
  };
}

      throw new Error('能力契约不合：需 {id, layer, name, run(ctx)}');
    if(cap.layer < 1 || cap.layer > 5) throw new Error('layer 须为 1~5（五层认知操作系统）');
    this._reg[cap.id] = cap;
    if(typeof EventBus !== 'undefined') EventBus.publish('capability', { id:cap.id, layer:cap.layer });
    return cap;
  },
  list(layer){ return Object.keys(this._reg).map(k => this._reg[k]).filter(c => !layer || c.layer === layer); },
  run(id, ctx){ const c = this._reg[id]; if(!c) throw new Error('未注册的能力：' + id); return c.run(ctx || {}); }
};

// —— 图算法：全源最短路（Dijkstra）与最短路还原（供给/需求间转运代价 c_ij） ——
// exclude：硬约束禁集——被禁节点从图中整体移除（既不作为端点，也不作为中转），
// 保证"转运代价"本身就不会经由禁区（此前 planTransport 不认 hard，导致绕过约束划走应急金）。
function allPairsCost(exclude){
  const ban = new Set(exclude || []);
  const nodes = WORLD.nodes.filter(n => !ban.has(n));
  const adj = {}; for(const n of nodes) adj[n] = [];
  for(const e of WORLD.edges){
    if(ban.has(e.from) || ban.has(e.to)) continue;
    if(adj[e.from]) adj[e.from].push({ to:e.to, w:(typeof e.w === 'number' ? e.w : 1) });
  }
  const dist = {}, prev = {};
  for(const s of nodes){
    const d = {}, pv = {}, seen = {};
    for(const n of nodes) d[n] = Infinity;
    d[s] = 0;
    while(true){
      let u = null, best = Infinity;
      for(const n of nodes) if(!seen[n] && d[n] < best){ best = d[n]; u = n; }
      if(u === null) break;
      seen[u] = true;
      for(const e of (adj[u] || [])){ const nd = d[u] + e.w; if(nd < d[e.to] - 1e-12){ d[e.to] = nd; pv[e.to] = u; } }
    }
    dist[s] = d; prev[s] = pv;
  }
  return { dist, prev };
}
function reconstructPath(prev, s, t){
  if(s === t) return [s];
  if(!prev[s] || prev[s][t] === undefined) return null;
  const p = [t]; let c = t;
  while(c !== s){ c = prev[s][c]; if(c === undefined) return null; p.unshift(c); }
  return p;
}
// —— 最小费用流（逐次最短路增广 / SPFA），运输问题精确最优 ——
// 供需拆点：同一主体可既供又需，须拆 i__out / i__in 并禁 i__out→i__in，否则 S→i→T 会造零代价"自满足假流"
function transportation(supplies, demands, costs){
  const S = '__S__', T = '__T__';
  const out = i => i + '__out', inn = j => j + '__in';
  const nodes = [S].concat(Object.keys(supplies).map(out), Object.keys(demands).map(inn), [T]);
  const idx = {}; nodes.forEach((n, k) => { idx[n] = k; });
  const N = nodes.length;
  const graph = []; for(let i = 0; i < N; i++) graph.push([]);
  function addEdge(u, v, cap, cost){
    const e1 = { to:idx[v], cap, cost, rev:null }, e2 = { to:idx[u], cap:0, cost:-cost, rev:null };
    e1.rev = e2; e2.rev = e1; graph[idx[u]].push(e1); graph[idx[v]].push(e2); return e1;
  }
  for(const i in supplies) addEdge(S, out(i), supplies[i], 0);
  for(const j in demands) addEdge(inn(j), T, demands[j], 0);
  const flowEdges = {};
  for(const i in supplies) for(const j in demands){
    if(i === j) continue;
    const c = costs[i] && costs[i][j];
    if(c != null && c !== Infinity) flowEdges[i + '→' + j] = addEdge(out(i), inn(j), Infinity, c);
  }
  let flow = 0, cost = 0; const s = idx[S], t = idx[T];
  while(true){
    const dist = new Array(N).fill(Infinity), inq = new Array(N).fill(false);
    const pe = new Array(N).fill(null), pv = new Array(N).fill(-1);
    dist[s] = 0; const q = [s]; inq[s] = true;
    while(q.length){
      const u = q.shift(); inq[u] = false;
      for(const e of graph[u]){
        if(e.cap > 1e-12 && dist[u] + e.cost < dist[e.to] - 1e-12){
          dist[e.to] = dist[u] + e.cost; pe[e.to] = e; pv[e.to] = u;
          if(!inq[e.to]){ q.push(e.to); inq[e.to] = true; }
        }
      }
    }
    if(dist[t] === Infinity) break;
    let push = Infinity;
    for(let v = t; v !== s; v = pv[v]) push = Math.min(push, pe[v].cap);
    for(let v = t; v !== s; v = pv[v]){ pe[v].cap -= push; pe[v].rev.cap += push; }
    flow += push; cost += push * dist[t];
  }
  const assignments = [];
  for(const k in flowEdges){
    const used = flowEdges[k].rev.cap;
    if(used > 1e-12){ const p = k.split('→'); assignments.push({ i:p[0], j:p[1], amount:used }); }
  }
  return { flow, cost, assignments };
}

// —— L2：确保领域通道连通（实体—中枢—实体，双向可达；跨领域无连边，故不会误连）——
// 世界图是累积的：不同领域的新节点/边会并入同一张 G，而不是每次换一个世界（规格：一个数学对象）
function ensureChannels(entities, hub, channels){
  const added = { nodes:0, edges:0 };
  const link = (a, b, w) => {
    for(const pair of [[a, b], [b, a]]){
      const f = pair[0], t = pair[1];
      if(!WORLD.nodes.includes(f)){ WORLD.nodes.push(f); added.nodes++; }
      if(!WORLD.nodes.includes(t)){ WORLD.nodes.push(t); added.nodes++; }
      const dup = WORLD.edges.find(e => e.from === f && e.to === t);
      if(!dup){ WORLD.edges.push({ from:f, to:t, w:(typeof w === 'number' ? w : 1), p:0.99 }); added.edges++; }
    }
  };
  if(hub){ WORLD.hub = hub; for(const e of (entities || [])) if(e && e.id != null) link(String(e.id), hub, 1); }
  for(const c of (channels || [])) if(c && c[0] != null && c[1] != null) link(String(c[0]), String(c[1]), c[2]);
  return added;
}
// —— L2：把领域实体（资源持有/缺口/产能）叠加到世界图 G 上 ——
function attachResources(entities){
  if(!Array.isArray(entities)) throw new Error('attachResources 需要 entities 数组');
  WORLD.resources = WORLD.resources || {}; WORLD.needs = WORLD.needs || {}; WORLD.entities = WORLD.entities || {};
  for(const e of entities){
    if(!e || e.id == null) throw new Error('实体缺少 id');
    const id = String(e.id);
    if(!WORLD.nodes.includes(id)) WORLD.nodes.push(id);
    WORLD.resources[id] = Object.assign({}, e.resources || {});
    WORLD.needs[id] = Object.assign({}, e.needs || {});
    WORLD.entities[id] = { id, name:e.name || id, produces:e.produces || null };
  }
  return { nodes:WORLD.nodes.length, entities:Object.keys(WORLD.entities).length,
           grounding:GROUNDING.KERNEL };
}
// —— L2/L3：发现错配（谁缺什么、谁多什么、谁能造什么）——
function discoverMismatch(){
  const res = WORLD.resources || {}, need = WORLD.needs || {}, ents = WORLD.entities || {};
  const out = [];
  for(const id in need){
    for(const r in need[id]){
      const deficit = need[id][r];
      if(!(deficit > 0)) continue;
      const direct = [];
      for(const oid in res){ if(oid === id) continue; const a = res[oid][r] || 0; if(a > 0) direct.push({ entity:oid, surplus:a }); }
      const makers = [];
      for(const oid in ents){
        const en = ents[oid];
        if(en && en.produces && en.produces.resource === r && oid !== id)
          makers.push({ entity:oid, makes:r, from:en.produces.from, rate:en.produces.rate });
      }
      out.push({ id:'M' + (out.length + 1), resource:r, deficitEntity:id, deficit,
        direct, makers, type: direct.length ? 'direct' : (makers.length ? 'production' : 'unmet') });
    }
  }
  return out;
}
// —— L3：协调（用大脑 reason 求最优流转路径；失败回落全源最短路）——
function coordinateMismatch(list, opts){
  opts = opts || {};
  const aps = allPairsCost(opts.hard);
  const plans = [];
  for(const m of list){
    const supplier = (m.direct[0] && m.direct[0].entity) || (m.makers[0] && m.makers[0].entity);
    if(!supplier){ plans.push({ matchId:m.id, resource:m.resource, status:'NO_SUPPLIER', route:null }); continue; }
    let route = null, cost = null, rr = null;
    try {
      const r = reason(supplier, m.deficitEntity, opts);
      if(r && r.path && r.path.length){ route = r.path; cost = r.cost; rr = r; }
    } catch(e) { /* 回落最短路 */ }
    if(!route && aps.dist[supplier] && aps.dist[supplier][m.deficitEntity] !== Infinity){
      route = reconstructPath(aps.prev, supplier, m.deficitEntity);
      cost = aps.dist[supplier][m.deficitEntity];
    }
    plans.push({ matchId:m.id, resource:m.resource, from:supplier, to:m.deficitEntity,
      route:route || null, cost, reasonResult:rr || null,
      grounding: rr ? GROUNDING.PROOF : GROUNDING.KERNEL });
  }
  return plans;
}
// —— L3：数学建模（把资源调拨写成运输问题，最小费用流求精确最优）——
function planTransport(opts){
  opts = opts || {};
  const hard = new Set(opts.hard || []);       // 约束单一真源：分配层同样尊重硬约束
  const aps = allPairsCost(opts.hard);         // 转运代价不得经由禁区
  const res = WORLD.resources || {}, need = WORLD.needs || {};
  const resources = new Set();
  for(const id in res) for(const r in res[id]) if(res[id][r] > 0) resources.add(r);
  for(const id in need) for(const r in need[id]) if(need[id][r] > 0) resources.add(r);
  const flows = [], models = [];
  let totalCost = 0, totalFlow = 0, unmet = 0;
  for(const r of resources){
    const supplies = {}, demands = {};
    // 禁集节点既不得作为供给方，也不得作为接收方（硬约束 = 不许碰）
    for(const id in res) if((res[id][r] || 0) > 0 && !hard.has(id)) supplies[id] = res[id][r];
    for(const id in need) if((need[id][r] || 0) > 0 && !hard.has(id)) demands[id] = need[id][r];
    if(!Object.keys(supplies).length || !Object.keys(demands).length) continue;
    const costs = {};
    for(const i in supplies){
      costs[i] = {};
      for(const j in demands){
        if(i === j) continue;
        const d = aps.dist[i] && aps.dist[i][j];
        if(d != null && d !== Infinity) costs[i][j] = d;
      }
    }
    const sol = transportation(supplies, demands, costs);
    for(const a of sol.assignments){
      const rt = reconstructPath(aps.prev, a.i, a.j);
      if(!rt) throw new Error('求解内部错误：' + a.i + '→' + a.j + ' 距离有限但最短路缺失');
      const uc = aps.dist[a.i][a.j];
      flows.push({ resource:r, from:a.i, to:a.j, amount:a.amount, unitCost:uc, route:rt });
      totalCost += uc * a.amount; totalFlow += a.amount;
    }
    const totDem = Object.keys(demands).reduce((s, k) => s + demands[k], 0);
    unmet += totDem - sol.flow;
    models.push({ resource:r, supplies, demands, optimalCost:sol.cost, method:'min-cost-flow' });
  }
  return { flows, models, totalCost:Math.round(totalCost * 1000) / 1000, totalFlow,
           unmet:Math.round(unmet * 1000) / 1000, method:'min-cost-flow(SSP/SPFA)', optimal:true };
}
// —— L1：行动（确定性调拨 + 库存校验 + 落经验 + 发事件）——
function applyAllocations(flows){
  const done = [];
  for(const f of flows){
    const fromRes = (WORLD.resources || {})[f.from], toRes = (WORLD.resources || {})[f.to];
    if(!fromRes || !toRes){ done.push(Object.assign({}, f, { status:'SKIPPED', reason:'主体不存在' })); continue; }
    const avail = fromRes[f.resource] || 0;
    const need = ((WORLD.needs || {})[f.to] || {})[f.resource] || 0;
    const amount = Math.max(0, Math.min(avail, need, f.amount));
    if(!(amount > 0)){ done.push(Object.assign({}, f, { status:'BLOCKED', amount:0 })); continue; }
    fromRes[f.resource] = avail - amount;
    toRes[f.resource] = (toRes[f.resource] || 0) + amount;
    ((WORLD.needs || {})[f.to])[f.resource] = Math.max(0, need - amount);
    const we = WORLD.edges.find(function(x){return x.from===f.from&&x.to===f.to;}); if(we){ we.p = Math.min(1, (we.p==null?0.5:we.p) + 0.1); }
    WORLD._txCounter = (WORLD._txCounter || 0) + 1;
    const entry = { id:'TX' + WORLD._txCounter, from:f.from, to:f.to, resource:f.resource,
                    amount, route:f.route, ts:new Date().toISOString() };
    if(typeof EventBus !== 'undefined') EventBus.publish('action', entry);
    done.push(Object.assign({}, f, { amount, status: amount < need ? 'PARTIAL' : 'ALLOCATED', tx:entry.id }));
  }
  return done;
}
// —— 统一认知循环：感知 → 状态 → 元认知调度 → 推理 → 行动 → 学习 → 审计 ——
// 这是"大脑"唯一的编排入口；切片只提供领域配置（entities / goal / observations / constraints）。
function cognitiveCycle(task){
  task = task || {};
  const t0 = Date.now();
  const rep = { cycleId:'CYC' + t0, domain:task.domain || 'generic', ts:new Date().toISOString(), layer:{} };
  // L1 感知
  if(task.observations && task.observations.length)
    rep.layer.L1_perception = perceive({ source:task.source || 'cognitive-cycle', evidence:task.evidence || null, observations:task.observations });
  else if(task.entities) rep.layer.L1_perception = { ok:true, mode:'structured-input', note:'宿主直供结构化实体（跳过感知）' };
  // L2 状态空间（先确保连通，再叠加资源）
  if(task.entities){
    const ch = ensureChannels(task.entities, task.hub, task.channels);
    rep.layer.L2_state = Object.assign(attachResources(task.entities), { channels:ch });
  }
  const mismatches = discoverMismatch();
  rep.layer.L2_mismatchCount = mismatches.length;
  // L5 元认知调度（决定本轮怎么想）
  const mc = metaCognition({ threshold:task.gapThreshold, alpha:task.alpha });
  rep.layer.L5_metacognition = { mode:mc.decision.exploreExploit, uncertainty:mc.uncertainty.global,
    gaps:mc.knowledgeGaps.length, system1Threshold:+(0.6 + 0.35 * mc.uncertainty.global).toFixed(3) };
  // L3 推理：协调（路径）+ 数学建模（最优分配）
  const plans = coordinateMismatch(mismatches, task.constraints || {});
  const transport = planTransport(task.constraints || {});   // 约束贯通到分配层
  const hardList = ((task.constraints || {}).hard) || [];
  const violated = transport.flows.filter(f => hardList.indexOf(f.from) >= 0 || hardList.indexOf(f.to) >= 0
    || f.route.some(n => hardList.indexOf(n) >= 0));
  rep.layer.L3_planning = { coordination:plans.length, method:transport.method,
    flows:transport.flows.length, totalCost:transport.totalCost, unmet:transport.unmet, optimal:transport.optimal,
    hardConstraints:{ nodes:hardList, violated:violated.length, passed:violated.length === 0 } };
  // L1 行动
  const allocations = applyAllocations(transport.flows);
  rep.layer.L1_action = { allocations:allocations.length, total:allocations.reduce((s, a) => s + (a.amount || 0), 0) };
  // L4 学习（行动内已落工作记忆与事件；此处落盘持久化）
  const saved = Memory.save();
  rep.layer.L4_learning = { saved:saved.ok, workingMemory:(typeof SelfLearn!=='undefined'?SelfLearn.experience.length:0) };
  // L3 审计：逐条真推理结果审计（fail-closed）
  const audited = plans.filter(p => p.reasonResult).map(p => {
    try {
      const a = generateAudit(p.reasonResult);
      return { route:p.reasonResult.path, status:a.status, verified:!!(a.proof && a.proof.verified), noHallucination:a.noHallucination };
    } catch(e) { return { route:p.route, status:'audit_failed', verified:false, noHallucination:false }; }
  });
  const passed = audited.filter(a => a.verified).length;
  rep.layer.L3_audit = { audited:audited.length, passed,
    status: (audited.length && passed === audited.length) ? 'valid'
      : (audited.some(a => a.status === 'audit_failed') ? 'audit_failed' : 'unverified'),
    noHallucination: audited.length > 0 && audited.every(a => a.noHallucination === true) };
  rep.mismatches = mismatches; rep.plans = plans; rep.transport = transport;
  rep.allocations = allocations; rep.audited = audited;
  rep.summary = { domain:rep.domain, mismatches:mismatches.length, allocations:allocations.length,
    totalCost:transport.totalCost, unmet:transport.unmet, audit:rep.layer.L3_audit.status,
    noHallucination:rep.layer.L3_audit.noHallucination };
  rep.elapsedMs = Date.now() - t0;
  if(typeof EventBus !== 'undefined') EventBus.publish('cycle', rep.summary);
  return rep;
}

    admissible: violations.length === 0,
    retracted: retracted, violations: violations,
    consistency: { ok: consistency.violations.length === 0, checked: consistency.checked, violations: consistency.violations },
    fusedWithBase: !!baseH,
    note: '仅从已验证最优路径反向传播剩余代价 ⇒ h_learned = h* ⇒ 可采纳；' +
      (baseH ? '与基础启发式取 max（Pearl 定理：两者可采纳 ⇒ max 可采纳且更强）；' : '') +
      (retracted ? ('回验撤回 ' + retracted + ' 条高估项（宁可启发式变弱，也不破坏 A* 最优性）；') : '回验未发现高估；') +
      (consistency.violations.length ? '一致性有违反 ⇒ 仍可采纳（A* 最优）但可能重开节点' : '满足一致性 ⇒ A* 无需重开节点')
  };
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（一）：保形预测 Conformal Prediction
// 来源：Vovk–Gammerman–Shafer 保形预测；split conformal（Angelopoulos & Bates 2021）
// 为什么融合：灵脑的"不幻觉"此前只是工程断言，没有统计保证。保形预测是唯一能在
//   **有限样本、无分布假设**下给出覆盖保证的框架——不需贝叶斯先验、不需模型正确。
// 定理（split conformal）：校准分数 s₁..sₙ 与新样本分数可交换 ⟹
//   P(Y_{n+1} ∈ Ĉ(X_{n+1})) ≥ 1 − α，阈值 q̂ = 经验 ⌈(n+1)(1−α)⌉/n 分位数。
// 关键：只要求**可交换性**（严格弱于 i.i.d.），不要求任何参数分布族 ⟹ 契合零依赖定位。
// ════════════════════════════════════════════════════════════════════════
function conformalQuantile(scores, alpha){
  if(!Array.isArray(scores) || !scores.length) return { ok:false, U:'无校准样本，不给覆盖保证（不猜）' };
  const a = (alpha == null) ? 0.1 : +alpha;
  if(!(a > 0 && a < 1)) return { ok:false, U:'α 必须 ∈ (0,1)' };
  const s = scores.filter(function(x){ return typeof x === 'number' && isFinite(x); }).slice().sort(function(x,y){ return x-y; });
  const n = s.length; if(!n) return { ok:false, U:'校准分数全为非有限值' };
  const k = Math.ceil((n + 1) * (1 - a));              // ⌈(n+1)(1−α)⌉，1-indexed
  const qhat = s[Math.min(n - 1, Math.max(0, k - 1))]; // 上界截断保证有限样本有效
  return { ok:true, qhat:qhat, alpha:a, n:n, rank:k, coverage:+(1-a).toFixed(6),
    guarantee:'P(Y∈Ĉ) ≥ ' + (1-a).toFixed(3) + '（有限样本·分布无关·仅需可交换性）',
    basis:'split conformal：q̂ = 校准分数经验 ⌈(n+1)(1−α)⌉/n 分位数',
    note:'这是边际(marginal)覆盖而非条件覆盖；分布漂移或校准集过期须重新校准' };
}
function conformalInterval(scores, alpha, point){
  const q = conformalQuantile(scores, alpha);
  // U 必须放最后：否则 pv.U（说明字符串）会覆盖布尔 true，使"诚实标 𝕌"判据失效
  if(!q.ok) return Object.assign({}, q, { U:true, ok:false });
  const lo = point - q.qhat, hi = point + q.qhat;
  return Object.assign({ ok:true }, q, { point:point, lo:lo, hi:hi, width:+(2*q.qhat).toFixed(6),
    covers:function(y){ return y >= lo && y <= hi; } });
}
// 保形异常检测：把"手拍阈值"（如 maxRate 变化率上界）升级为"数据驱动 + 误报率有保证"
// 定理：可交换性下，正常样本的保形 p 值随机地 ≥ Uniform(0,1) ⟹ P(p ≤ α) ≤ α，
//   即误报率被 α 严格控制——无需假设噪声是高斯的、无需人工定阈值。
function conformalPValue(calibScores, newScore){
  if(!Array.isArray(calibScores) || !calibScores.length) return { ok:false, U:'无校准样本，无法判异（不猜）' };
  if(typeof newScore !== 'number' || !isFinite(newScore)) return { ok:false, U:'新样本分数非有限值' };
  const s = calibScores.filter(function(x){ return typeof x === 'number' && isFinite(x); });
  const n = s.length; if(!n) return { ok:false, U:'校准分数全为非有限值' };
  let ge = 0; for(let i=0;i<n;i++) if(s[i] >= newScore) ge++;
  const p = (ge + 1) / (n + 1);   // 含自身 ⟹ p ∈ [1/(n+1), 1]，永不恰为 0（保守）
  return { ok:true, p:+p.toFixed(6), n:n, score:newScore,
    guarantee:'可交换性下 P(p ≤ α) ≤ α ⟹ 误报率被 α 严格控制',
    basis:'保形异常检测：以校准集为经验零分布的非参数置换检验（无高斯假设）' };
}
function conformalIsAnomaly(calibScores, newScore, alpha){
  const pv = conformalPValue(calibScores, newScore);
  if(!pv.ok) return Object.assign({}, pv, { U:true, ok:false, anomaly:null });
  const a = (alpha == null) ? 0.05 : +alpha;
  return Object.assign({ ok:true }, pv, { alpha:a, anomaly: pv.p <= a,
    verdict: pv.p <= a ? '判为异常（p ≤ α，误报率受控）' : '未检出异常（不足以判异 ≠ 证明正常）' });
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（二）：SayCan 可供性概率分解
// 来源：SayCan "Do As I Can, Not As I Say"（Google, 2022）
// 本质数学：把"技能会成功且有用于指令"做**条件概率分解**
//   P(π 成功且有用于 i | s) = P(π 有用于 i)〔Say：语义/值函数〕 × p(c_π | s, l_π)〔Can：可供性〕
//   其中 c_π ~ Bernoulli，可供性函数正是"成功=1"的语言条件价值函数。
// 为什么契合灵脑：灵脑的 pre/effect 能力契约是**布尔**的（能做/不能做），
//   而灵脑已从真实反馈学到成败率。升级为概率可供性后，
//   可行性(Can) 与 有用性(Say，灵脑已有 goalDirected 值函数 V) 可**分离审计**——
//   这正是灵脑"每个结论都能拆出依据"基因的自然延伸。
// ════════════════════════════════════════════════════════════════════════
function affordanceOf(s, a, opts){
  opts = opts || {};
  const minTrials = (opts.minTrials == null) ? 3 : +opts.minTrials;
  if(typeof SelfLearn === 'undefined' || !SelfLearn.experience) return { ok:false, U:'无经验库' };
  let tot = 0, succ = 0;
  const exp = SelfLearn.experience;
  for(let i=0;i<exp.length;i++){
    const e = exp[i];
    if(e.state === s && e.action === a && e.success != null){ tot++; if(e.success) succ++; }
  }
  if(tot < minTrials) return { ok:true, n:tot, affordance:null, U:true,
    reason:'样本不足(< ' + minTrials + ')，不给可供性估计（不猜）' };
  const af = (succ + 1) / (tot + 2);   // 拉普拉斯平滑 Beta(1,1)：避免 0/1 极端使后续乘法塌缩
  return { ok:true, n:tot, success:succ, affordance:+af.toFixed(6),
    pointEstimate:+(succ/tot).toFixed(6), U:false,
    basis:'p(c_π|s,l_π) = Bernoulli 成功概率（SayCan 中即"成功=1"的价值函数）；拉普拉斯平滑 Beta(1,1)' };
}
function sayCanRank(candidates, opts){
  opts = opts || {};
  if(!Array.isArray(candidates) || !candidates.length) return { ok:false, U:'无候选技能' };
  const rows = candidates.map(function(c){
    const say = (typeof c.utility === 'number' && isFinite(c.utility)) ? Math.max(0, Math.min(1, +c.utility)) : null;
    const can = affordanceOf(c.state, c.skill, opts);
    const a = can.affordance;                 // 样本不足时为 null → 诚实标 𝕌，不用 0.5 冒充中性
    const score = (say == null || a == null) ? null : +(say * a).toFixed(6);
    return { skill:c.skill, state:c.state, say:say, can:a, canN:can.n, score:score,
      U:(say == null || a == null),
      U_reason:(say == null ? '缺少有用性评分' : (a == null ? '可供性样本不足' : '—')) };
  });
  const decided = rows.filter(function(r){ return !r.U; });
  const undecided = rows.filter(function(r){ return r.U; });
  decided.sort(function(x,y){ return y.score - x.score; });
  return { ok:true, ranked:decided.concat(undecided), best:(decided.length ? decided[0] : null),
    undecidedCount:undecided.length,
    formula:'score(π) = P(有用|指令)〔Say〕 × P(成功|状态)〔Can〕',
    basis:'SayCan 概率分解；两因子可分离审计（灵脑要求：每个结论都能拆出依据）',
    note:'𝕌 项排最后且不参与择优——证据不足时拒绝排序，而非用 0.5 冒充中性' };
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（三）：Thompson Sampling（Beta 后验采样探索-利用）
// 来源：Thompson (1933)；Beta-Binomial 共轭下的后验采样
// 本质数学：不做"先估计再贪心"，而是**从后验采样再择优**——
//   被选中的概率 ∝ 该臂为最优的后验概率 ⟹ 探索自动集中在"有可能最优"的臂上，
//   是贝叶斯意义下 regret 有界的探索策略（非 ε-greedy 的盲目随机）。
// 为什么契合灵脑：SelfLearn 维护的 reliability **已经是 Beta(α,β) 后验**，
//   Thompson 采样是它的零成本自然应用；此前灵脑的 explore/exploit 是启发式拍的。
// 确定性：灵脑要求可复现 ⟹ 用可播种 PRNG（mulberry32），给定种子结果完全可重放。
// ════════════════════════════════════════════════════════════════════════
function _mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function _stdNormal(rnd){
  let u = 0, v = 0;
  while(u === 0) u = rnd();
  while(v === 0) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function _gammaShape(k, rnd){
  if(k < 1) return _gammaShape(k + 1, rnd) * Math.pow(Math.max(1e-12, rnd()), 1 / k); // Boost: Γ(k)=Γ(k+1)·U^(1/k)
  const d = k - 1/3, c = 1 / Math.sqrt(9 * d);
  for(;;){
    let x, v;
    do { x = _stdNormal(rnd); v = 1 + c * x; } while (v <= 0);
    v = v * v * v;
    const u = rnd();
    if(u < 1 - 0.0331 * x * x * x * x) return d * v;
    if(Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v;
  }
}
function _betaSample(alpha, beta, rnd){
  const x = _gammaShape(alpha, rnd), y = _gammaShape(beta, rnd);   // Γ(α,1)/(Γ(α,1)+Γ(β,1)) ~ Beta(α,β)
  return (x + y > 0) ? x / (x + y) : 0.5;
}
function thompsonSample(arms, opts){
  opts = opts || {};
  if(!Array.isArray(arms) || !arms.length) return { ok:false, U:'无候选臂' };
  const seed = (opts.seed == null) ? 20260830 : (+opts.seed >>> 0);
  const rnd = _mulberry32(seed);
  const draws = arms.map(function(a){
    const al = (a.alpha == null) ? 1 : +a.alpha;
    const be = (a.beta  == null) ? 1 : +a.beta;
    if(!(al > 0) || !(be > 0)) return { id:a.id, U:true, reason:'α,β 必须为正' };
    return { id:a.id, alpha:al, beta:be, mean:+(al/(al+be)).toFixed(6),
             draw:+_betaSample(al, be, rnd).toFixed(6), U:false };
  });
  const valid = draws.filter(function(d){ return !d.U; });
  if(!valid.length) return { ok:false, U:true, draws:draws, reason:'所有臂的后验参数无效' };
  let best = valid[0];
  for(let i=1;i<valid.length;i++) if(valid[i].draw > best.draw) best = valid[i];
  return { ok:true, seed:seed, picked:best, draws:draws,
    basis:'Thompson Sampling：从 Beta(α,β) 后验采样，选中概率 ∝ 该臂为最优的后验概率（regret 有界）',
    note:'确定性 PRNG（seed=' + seed + '）⟹ 灵脑可复现要求下结果完全可重放' };
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（四）：矩阵代数基石（为卡尔曼 / LQR 提供零依赖线性代数）
// 原则：只做**数值线性代数**（高斯消元求逆、乘法、转置），不引入任何依赖；
//   病态/奇异一律诚实返回失败，绝不返回看似合理的错误数值。
// ════════════════════════════════════════════════════════════════════════
function _col(v){ return (Array.isArray(v[0])) ? v : v.map(function(x){ return [x]; }); }
function _flat(M){ return Array.isArray(M[0]) ? M.map(function(r){ return r[0]; }) : M.slice(); }
function matEye(n){ const I=[]; for(let i=0;i<n;i++){ I.push(new Array(n).fill(0)); I[i][i]=1; } return I; }
function matT(A){ const r=A.length, c=A[0].length, O=[]; for(let j=0;j<c;j++){ const row=[]; for(let i=0;i<r;i++) row.push(A[i][j]); O.push(row); } return O; }
function matMul(A,B){
  const n=A.length, m=A[0].length, p=(B[0] && B[0].length) || 1;
  if(m !== B.length) return { ok:false, U:'维数不匹配 A(' + n + '×' + m + ') × B(' + B.length + '×' + p + ')' };
  const O=[]; for(let i=0;i<n;i++){ const row=[]; for(let j=0;j<p;j++){ let s=0; for(let k=0;k<m;k++) s += A[i][k]*B[k][j]; row.push(s); } O.push(row); }
  return { ok:true, M:O };
}
function matAdd(A,B){ const n=A.length, m=A[0].length; if(n!==B.length||m!==B[0].length) return {ok:false,U:'维数不匹配'};
  const O=[]; for(let i=0;i<n;i++){ const row=[]; for(let j=0;j<m;j++) row.push(A[i][j]+B[i][j]); O.push(row); } return {ok:true,M:O}; }
function matSub(A,B){ const n=A.length, m=A[0].length; if(n!==B.length||m!==B[0].length) return {ok:false,U:'维数不匹配'};
  const O=[]; for(let i=0;i<n;i++){ const row=[]; for(let j=0;j<m;j++) row.push(A[i][j]-B[i][j]); O.push(row); } return {ok:true,M:O}; }
function matScale(A,s){ return A.map(function(r){ return r.map(function(x){ return x*s; }); }); }
// 高斯-约旦消元求逆（部分主元）；主元过小时判为奇异——宁可失败也不给错数
function matInv(A, opts){
  opts = opts || {};
  const n = A.length;
  if(!n || !A[0] || A[0].length !== n) return { ok:false, U:'只支持方阵求逆' };
  const eps = (opts.eps == null) ? 1e-12 : opts.eps;
  const M = []; for(let i=0;i<n;i++){ const row = A[i].slice(); for(let j=0;j<n;j++) row.push(i===j?1:0); M.push(row); }
  for(let c=0;c<n;c++){
    let piv = c, best = Math.abs(M[c][c]);
    for(let r=c+1;r<n;r++){ const v = Math.abs(M[r][c]); if(v > best){ best = v; piv = r; } }
    if(best < eps) return { ok:false, U:'矩阵奇异或接近奇异（主元 ' + best.toExponential(2) + ' < ' + eps + '），拒绝求逆' };
    if(piv !== c){ const t = M[c]; M[c] = M[piv]; M[piv] = t; }
    const d = M[c][c];
    for(let j=0;j<2*n;j++) M[c][j] /= d;
    for(let r=0;r<n;r++){ if(r===c) continue; const f = M[r][c]; if(f===0) continue;
      for(let j=0;j<2*n;j++) M[r][j] -= f*M[c][j]; }
  }
  const O=[]; for(let i=0;i<n;i++) O.push(M[i].slice(n));
  return { ok:true, M:O };
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（五）：卡尔曼滤波 —— 融合形式 F「估计器」
// 来源：Kalman (1960)；LQE（线性二次估计）
// 本质数学：在**线性系统 + 高斯噪声**假设下，卡尔曼滤波是**最小方差无偏估计**
//   （且在高斯下即后验均值 = MAP）。它不是"平滑一下"，而是有最优性定理的估计器。
// 为什么灵脑需要：此前 execute() 直接 `setState(observed)`——**带噪观测被当成真值**，
//   传感器噪声直接污染世界状态并进入规划。卡尔曼把"观测"升级为"最优估计 + 不确定度"。
// 形式选择：必须融成**估计器（F）**而非约束（B）——因为噪声是连续量，阈值化会丢信息。
// ════════════════════════════════════════════════════════════════════════
function kalmanUpdate(x, P, z, H, R, opts){
  opts = opts || {};
  const xv = _col(x), zv = _col(z);
  const n = xv.length;
  if(!P || P.length !== n) return { ok:false, U:'P 维数与状态不符' };
  const Hm = Array.isArray(H[0]) ? H : [H];
  const Rm = Array.isArray(R[0]) ? R : [[R]];
  const m = zv.length;
  const Hx = matMul(Hm, xv); if(!Hx.ok) return { ok:false, U:'H·x 失败：' + Hx.U };
  const y = matSub(zv, Hx.M);                       // 新息 innovation = z − Hx
  const Ht = matT(Hm);
  const PHt = matMul(P, Ht); if(!PHt.ok) return { ok:false, U:'P·Hᵀ 失败：' + PHt.U };
  const HP = matMul(Hm, P); if(!HP.ok) return { ok:false, U:'H·P 失败：' + HP.U };
  const HP_Ht = matMul(HP.M, Ht); if(!HP_Ht.ok) return { ok:false, U:'H·P·Hᵀ 失败：' + HP_Ht.U };
  const S = matAdd(HP_Ht.M, Rm); if(!S.ok) return { ok:false, U:'S 构造失败：' + S.U };
  const Sinv = matInv(S.M); if(!Sinv.ok) return { ok:false, U:'新息协方差 S 奇异，无法更新：' + Sinv.U };
  const K = matMul(PHt.M, Sinv.M); if(!K.ok) return { ok:false, U:'K 计算失败：' + K.U };
  const Ky = matMul(K.M, y.M); if(!Ky.ok) return { ok:false, U:'K·y 失败：' + Ky.U };
  const xn = matAdd(xv, Ky.M); if(!xn.ok) return { ok:false, U:'状态更新失败：' + xn.U };
  // Joseph 形式：P' = (I−KH)P(I−KH)ᵀ + KRKᵀ —— 比 (I−KH)P 数值更稳，保证对称正定
  const I = matEye(n), KH = matMul(K.M, Hm); if(!KH.ok) return { ok:false, U:'K·H 失败：' + KH.U };
  const IKH = matSub(I, KH.M); if(!IKH.ok) return { ok:false, U:'I−KH 失败：' + IKH.U };
  const IKHt = matT(IKH.M);
  const A1 = matMul(IKH.M, P); if(!A1.ok) return { ok:false, U:'P′ 计算失败：' + A1.U };
  const A2 = matMul(A1.M, IKHt); if(!A2.ok) return { ok:false, U:'P′ 计算失败：' + A2.U };
  const KR = matMul(K.M, Rm); if(!KR.ok) return { ok:false, U:'K·R 失败：' + KR.U };
  const KRKt = matMul(KR.M, matT(K.M)); if(!KRKt.ok) return { ok:false, U:'K·R·Kᵀ 失败：' + KRKt.U };
  const Pn = matAdd(A2.M, KRKt.M); if(!Pn.ok) return { ok:false, U:'P′ 合成失败：' + Pn.U };
  // 不确定度收缩量：滤波真的降低了多少方差（可审计：证明"估计优于裸观测"）
  const trBefore = P.reduce(function(s,r,i){ return s + r[i]; }, 0);
  const trAfter  = Pn.M.reduce(function(s,r,i){ return s + r[i]; }, 0);
  return { ok:true, x:_flat(xn.M), P:Pn.M, K:K.M, innovation:_flat(y.M), S:S.M,
    traceBefore:+trBefore.toFixed(6), traceAfter:+trAfter.toFixed(6),
    varianceReduction: trBefore > 0 ? +(1 - trAfter/trBefore).toFixed(6) : null,
    guarantee:'线性高斯假设下为最小方差无偏估计（Kalman 1960）；非线性/非高斯下退化为次优，须诚实标注',
    form:'融合形式 F（估计器）：把带噪观测升级为最优估计 + 不确定度，而非阈值化丢弃',
    note:'此函数只做量测更新；过程预测 x←Ax+Bu, P←APAᵀ+Q 由调用方按需做' };
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（六）：LQR —— 融合形式 G「控制器」
// 来源：Kalman (1960)；离散代数 Riccati 方程（DARE）
// 本质数学：对 x_{k+1}=Ax_k+Bu_k、代价 Σ(xᵀQx + uᵀRu)，最优控制是**线性状态反馈**
//   u = −Kx，其中 K = (R+BᵀPB)⁻¹BᵀPA，P 为 DARE 的唯一正定解
//   P = AᵀPA − AᵀPB(R+BᵀPB)⁻¹BᵀPA + Q（值迭代从 P₀=Q 出发收敛，局部二次收敛）。
// 为什么灵脑需要：灵脑缺连续控制（MPC 需 QP/SDP 求解器，与零依赖有张力），
//   而 LQR 是**解析可解**的——只需矩阵求逆 + Riccati 迭代，零依赖可实装，
//   且在"线性系统 + 二次代价"假设下**就是最优**（不是近似，是定理）。
// 组合定理：LQG = 卡尔曼(LQE) + LQR 由**分离原理**保证可独立设计再拼装仍最优。
// ════════════════════════════════════════════════════════════════════════
function lqrSolve(A, B, Q, R, opts){
  opts = opts || {};
  const maxIter = (opts.maxIter == null) ? 500 : +opts.maxIter;
  const tol = (opts.tol == null) ? 1e-9 : +opts.tol;
  const n = A.length;
  if(!A[0] || A[0].length !== n) return { ok:false, U:'A 必须是方阵' };
  let P = (Array.isArray(Q[0]) ? Q : _col(Q)).map(function(r){ return r.slice(); });
  if(P.length !== n) return { ok:false, U:'Q 维数与 A 不符' };
  const Bm = Array.isArray(B[0]) ? B : _col(B);
  const Rm = Array.isArray(R[0]) ? R : [[R]];
  const At = matT(A), Bt = matT(Bm);
  let K = null, iters = 0, converged = false, lastDelta = null;
  for (iters = 1; iters <= maxIter; iters++){
    const BtP = matMul(Bt, P); if(!BtP.ok) return { ok:false, U:'BᵀP 失败：' + BtP.U };
    const M = matAdd(Rm, matMul(BtP.M, Bm).M); if(!M.ok) return { ok:false, U:'R+BᵀPB 失败：' + M.U };
    const Minv = matInv(M.M); if(!Minv.ok) return { ok:false, U:'R+BᵀPB 奇异，Riccati 迭代失败：' + Minv.U };
    const BtPA = matMul(BtP.M, A); if(!BtPA.ok) return { ok:false, U:'BᵀPA 失败：' + BtPA.U };
    const Kn = matMul(Minv.M, BtPA.M); if(!Kn.ok) return { ok:false, U:'K 失败：' + Kn.U };
    const AtP = matMul(At, P); if(!AtP.ok) return { ok:false, U:'AᵀP 失败：' + AtP.U };
    const AtPA = matMul(AtP.M, A); if(!AtPA.ok) return { ok:false, U:'AᵀPA 失败：' + AtPA.U };
    const AtPB = matMul(AtP.M, Bm); if(!AtPB.ok) return { ok:false, U:'AᵀPB 失败：' + AtPB.U };
    const corr = matMul(AtPB.M, Kn.M); if(!corr.ok) return { ok:false, U:'AᵀPB·K 失败：' + corr.U };
    const s1 = matSub(AtPA.M, corr.M); if(!s1.ok) return { ok:false, U:'Riccati 递推失败：' + s1.U };
    const Pn = matAdd(s1.M, (Array.isArray(Q[0]) ? Q : _col(Q))); if(!Pn.ok) return { ok:false, U:'Riccati 递推失败：' + Pn.U };
    let d = 0; for(let i=0;i<n;i++) for(let j=0;j<n;j++) d = Math.max(d, Math.abs(Pn.M[i][j] - P[i][j]));
    lastDelta = d; K = Kn.M; P = Pn.M;
    if(d < tol){ converged = true; break; }
  }
  // 稳定性判定（保守）：闭环 A−BK 的 ∞-范数 < 1 ⟹ 谱半径 < 1（Gershgorin 行圆盘，
  // 复用灵脑已有的 Gershgorin 思路）。这是**充分非必要**判据：判稳定必稳定，判不出则诚实标 𝕌。
  let stable = null, normInf = null, closedLoop = null, spectralRadius = null, stabMethod = null;
  if(K){
    const BK = matMul(Bm, K); if(BK.ok){
      const CL = matSub(A, BK.M); if(CL.ok){
        closedLoop = CL.M;
        normInf = 0; for(let i=0;i<n;i++){ let s=0; for(let j=0;j<n;j++) s += Math.abs(CL.M[i][j]); normInf = Math.max(normInf, s); }
        // 谱半径：n≤2 用特征方程闭式解（精确）；n≥3 回退 ∞-范数上界（Gershgorin 行圆盘，保守）
        if(n === 1){ spectralRadius = Math.abs(CL.M[0][0]); stabMethod = '精确（标量）'; }
        else if(n === 2){
          const a = CL.M[0][0], b = CL.M[0][1], c = CL.M[1][0], d = CL.M[1][1];
          const tr = a + d, det = a * d - b * c, disc = tr * tr - 4 * det;
          spectralRadius = disc >= 0
            ? Math.max(Math.abs((tr + Math.sqrt(disc)) / 2), Math.abs((tr - Math.sqrt(disc)) / 2))
            : Math.sqrt(Math.max(0, det));              // 复共轭特征值：|λ| = √det
          stabMethod = '精确（2×2 特征方程闭式解）';
        } else { stabMethod = '保守上界（‖·‖∞，Gershgorin）；判稳定必稳定，判不出则标 𝕌'; }
        stable = (spectralRadius != null) ? (spectralRadius < 1) : (normInf < 1);
      }
    }
  }
  return { ok:true, K:K, P:P, iterations:iters, converged:converged, delta:+lastDelta.toFixed(12),
    closedLoop:closedLoop, normInf:+normInf.toFixed(6),
    spectralRadius:(spectralRadius == null ? null : +spectralRadius.toFixed(6)),
    stabMethod:stabMethod, stable:stable,
    stableVerdict: stable === true ? '闭环谱半径 ' + (spectralRadius == null ? '<1（∞-范数上界）' : spectralRadius.toFixed(6) + ' < 1，稳定')
      : (stable === false ? '判据不足以判定稳定（保守，可能是判据不紧而非真不稳定）' : '𝕌 无法判定'),
    guarantee:'线性系统 + 二次代价下 u=−Kx 为最优控制（Kalman 1960）；非线性须先线性化（iLQR/DDP）',
    form:'融合形式 G（控制器）：解析求解连续控制，填补灵脑 MPC 缺口（MPC 需 QP/SDP，与零依赖冲突）',
    note:'与 kalmanUpdate 组合即 LQG，由分离原理保证组合最优；但 LQG **不自动保证鲁棒性**（Doyle），鲁棒裕度须另查' };
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（七）：CVaR 一致性风险度量 —— 融合形式 A「代价项」/ C「证书」
// 来源：Artzner et al. (1999) 一致性风险度量；Rockafellar & Uryasev (2000)
// 本质数学：CVaR_α(X) = E[X | X ≥ VaR_α(X)]，即**尾部平均**（最坏 α 部分的期望）。
//   它满足一致性四公理：单调性 / 平移不变性 / 正齐次性 / **次可加性**；
//   而 VaR **不满足次可加性**——这意味着用 VaR 会导出"分散化反而增加风险"的荒谬结论。
//   Rockafellar–Uryasev：CVaR_α(X) = inf_m { m + E[(X−m)⁺]/(1−α) }，凸 ⟹ 可优化。
// 形式选择（关键陷阱）：CVaR **不是可加的**（次可加 ≠ 可加），
//   ⟹ **不能**拆成边权塞进 A* 的加性代价（路径 CVaR ≠ 各边 CVaR 之和）！
//   在灵脑的正确形式是对**整条路径的情景集**做评估 → 形式 C（证书/审计），
//   报告"这条路径最坏 5% 情况下平均代价多少"，而不是污染可加代价结构。
// ════════════════════════════════════════════════════════════════════════
function cvar(samples, alpha){
  if(!Array.isArray(samples)) return { ok:false, U:'需要样本数组' };
  const s = samples.filter(function(x){ return typeof x === 'number' && isFinite(x); }).slice().sort(function(a,b){ return a-b; });
  const n = s.length; if(!n) return { ok:false, U:'无有效样本' };
  const a = (alpha == null) ? 0.95 : +alpha;
  if(!(a > 0 && a < 1)) return { ok:false, U:'α 必须 ∈ (0,1)' };
  // VaR 取 α 分位（业界惯例：95% 置信水平的 VaR = 95% 分位）；减 1e-9 抵消浮点误差（100*0.05=5.000000000000001）
  const kVar = Math.min(n - 1, Math.max(0, Math.ceil(n * a - 1e-9) - 1));
  const varAt = s[kVar];
  const kTail = Math.max(1, Math.round(n * (1 - a)));      // 尾部至少取 1 个，避免空集
  const tail = s.slice(n - kTail);
  const mean = s.reduce(function(x,y){ return x + y; }, 0) / n;
  const cvarAt = tail.reduce(function(x,y){ return x + y; }, 0) / tail.length;
  return { ok:true, var:+varAt.toFixed(6), cvar:+cvarAt.toFixed(6), alpha:a, n:n,
    tailCount:kTail, mean:+mean.toFixed(6),
    // 尾部溢价：CVaR 比均值坏多少——风险厌恶者真正关心的量
    tailPremium:+(cvarAt - mean).toFixed(6),
    coherent:true,
    axioms:['单调性','平移不变性','正齐次性','次可加性（VaR 不满足 ⟹ 用 VaR 会惩罚分散化）'],
    basis:'Artzner et al.(1999) 一致性风险度量；CVaR_α=E[X|X≥VaR_α]；Rockafellar–Uryasev 凸变分公式',
    form:'融合形式 C（证书）：对整条路径的情景集评估尾部风险',
    warning:'CVaR 次可加但**不可加** ⟹ 严禁拆成边权塞入 A* 加性代价（路径 CVaR ≠ Σ 边 CVaR）' };
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（八）：粒子滤波 —— 融合形式 F「估计器」（补卡尔曼的非线性缺口）
// 来源：序贯蒙特卡洛 / Bootstrap Filter（Gordon et al. 1993）
// 本质数学：卡尔曼是"线性+高斯"下的**解析**最优；一旦非线性或非高斯，它连次优都谈不上
//   （EKF 线性化会发散，UKF 仍假设高斯）。粒子滤波用**一组带权样本近似后验**：
//   重要性采样 w ∝ p(z|x)，N→∞ 时收敛到真实后验（一致性）；有限 N 是近似，须诚实标注。
// 核心病理：**粒子退化**——几轮后权重集中到极少数粒子。用有效样本数监控
//   Neff = 1/Σwᵢ²，低于阈值即重采样（系统重采样，低方差且确定性可选）。
// 形式选择：形式 F（估计器），与卡尔曼同层，按"系统是否线性高斯"二选一，互为补充。
// ════════════════════════════════════════════════════════════════════════
function effectiveSampleSize(weights){
  if(!Array.isArray(weights) || !weights.length) return { ok:false, U:'无权重' };
  let s = 0, s2 = 0;
  for(let i=0;i<weights.length;i++){ s += weights[i]; s2 += weights[i]*weights[i]; }
  if(!(s > 0)) return { ok:false, U:'权重和为零（全部粒子被判不可能），后验已退化' };
  const wn = weights.map(function(w){ return w/s; });
  let sq = 0; for(let i=0;i<wn.length;i++) sq += wn[i]*wn[i];
  return { ok:true, n:weights.length, neff:+(1/sq).toFixed(6),
    ratio:+(1/(sq*weights.length)).toFixed(6), normalized:wn,
    note:'Neff/n 越接近 0 退化越严重；< 0.5 通常触发重采样' };
}
function particleFilterStep(particles, weights, predictFn, likelihoodFn, opts){
  opts = opts || {};
  if(!Array.isArray(particles) || !particles.length) return { ok:false, U:'无粒子' };
  const n = particles.length;
  const w0 = (Array.isArray(weights) && weights.length === n) ? weights.slice() : new Array(n).fill(1/n);
  const resampleRatio = (opts.resampleRatio == null) ? 0.5 : +opts.resampleRatio;
  const seed = (opts.seed == null) ? 20260830 : (+opts.seed >>> 0);
  // ① 预测：沿动力学推进每个粒子（非线性即可，无需线性化）
  let ps = particles.slice();
  if(typeof predictFn === 'function'){ for(let i=0;i<n;i++) ps[i] = predictFn(ps[i], i); }
  // ② 更新：重要性权重 w ∝ p(观测 | 粒子)
  if(typeof likelihoodFn !== 'function') return { ok:false, U:'缺少似然函数' };
  let w = new Array(n), sum = 0, anyPos = false;
  for(let i=0;i<n;i++){
    const l = likelihoodFn(ps[i], i);
    if(typeof l !== 'number' || !isFinite(l) || l < 0) return { ok:false, U:'第 ' + i + ' 个粒子的似然非有限/为负' };
    w[i] = w0[i] * l; sum += w[i]; if(w[i] > 0) anyPos = true;
  }
  if(!anyPos || !(sum > 0)) return { ok:false, U:'所有粒子似然为零——模型与观测矛盾（可能是模型错误，非数值问题）' };
  for(let i=0;i<n;i++) w[i] /= sum;
  // ③ 退化诊断 + 系统重采样（低方差；用固定 u 保证确定性可复现）
  const ess = effectiveSampleSize(w);
  let resampled = false;
  if(ess.ok && ess.ratio < resampleRatio){
    const rnd = _mulberry32(seed), u = rnd();       // 系统重采样：单一随机偏移
    const out = new Array(n), cw = new Array(n);
    let acc = 0; for(let i=0;i<n;i++){ acc += w[i]; cw[i] = acc; }
    let j = 0;
    for(let i=0;i<n;i++){
      const pos = (i + u) / n;
      while(j < n-1 && cw[j] < pos) j++;
      out[i] = ps[j];
    }
    ps = out; w = new Array(n).fill(1/n); resampled = true;
  }
  return { ok:true, particles:ps, weights:w, n:n, neff:ess.ok ? ess.neff : null,
    neffRatio:ess.ok ? ess.ratio : null, resampled:resampled, seed:seed,
    guarantee:'N→∞ 时重要性采样一致收敛到真实后验；有限 N 为**近似**，非最优（诚实区别于卡尔曼）',
    form:'融合形式 F（估计器）：非线性/非高斯场景替代卡尔曼；线性高斯下仍应优先卡尔曼（解析最优）',
    warning:'粒子退化由 Neff 监控；若 Neff 持续极低，说明提议分布与真实后验失配，需换提议而非加大 N' };
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（九）：期望信息增益 EIG —— 融合形式 E「选择器」（主动感知）
// 来源：贝叶斯实验设计（Lindley 1956）；Mackay (1992) 主动学习
// 本质数学：做哪个动作/观测能最多减少对未知量 θ 的不确定性？答案就是**互信息**
//   EIG(a) = I(θ; O_a) = H(θ) − E_O[H(θ|O)] = H(O) − H(O|θ)（两条恒等路径，可交叉验证）
//   选 argmax_a EIG ⟹ 每一步都最大化"信息获取率"，这是贪心但可证近最优（次模性 ⟹ (1−1/e) 保证）。
// 为什么灵脑需要：灵脑有元认知 knowledgeGaps（知道"不知道什么"），但**没用它来选动作**——
//   即"知道缺什么，却不会主动去看"。EIG 正是把缺口转化为"下一步该观测什么"。
// ════════════════════════════════════════════════════════════════════════
function entropyOf(dist){
  if(!Array.isArray(dist) || !dist.length) return { ok:false, U:'无分布' };
  let s = 0; for(let i=0;i<dist.length;i++){ if(dist[i] < 0) return { ok:false, U:'概率为负' }; s += dist[i]; }
  if(!(s > 0)) return { ok:false, U:'概率和为零' };
  let H = 0, eps = 1e-12;
  for(let i=0;i<dist.length;i++){ const p = dist[i]/s; if(p > eps) H -= p * Math.log(p); }
  return { ok:true, H:+H.toFixed(9), n:dist.length, basis:'香农熵 H = −Σ p log p（底 e，单位 nat）' };
}
function expectedInfoGain(prior, likelihood, opts){
  opts = opts || {};
  const H0 = entropyOf(prior);
  if(!H0.ok) return { ok:false, U:'先验无效：' + H0.U };
  if(!Array.isArray(likelihood) || likelihood.length !== prior.length) return { ok:false, U:'似然矩阵行数须等于先验维度' };
  const nO = (likelihood[0] && likelihood[0].length) || 0;
  if(!nO) return { ok:false, U:'似然矩阵为空' };
  // P(o) = Σ_θ prior[θ]·p(o|θ)；后验 ∝ prior·likelihood
  let pO = new Array(nO).fill(0), condH = 0, jointH = 0;
  const post = [];
  for(let t=0;t<prior.length;t++){
    if(!Array.isArray(likelihood[t]) || likelihood[t].length !== nO) return { ok:false, U:'似然矩阵各行长度须一致' };
    let rs = 0; for(let o=0;o<nO;o++) rs += likelihood[t][o];
    if(Math.abs(rs - 1) > 1e-6) return { ok:false, U:'第 ' + t + ' 行似然未归一化（和=' + rs + '）' };
    const row = [];
    for(let o=0;o<nO;o++){ const v = prior[t]*likelihood[t][o]; pO[o] += v; row.push(v); }
    post.push(row);
  }
  // 路径①：H(θ) − E_O[H(θ|O)]
  for(let o=0;o<nO;o++){
    if(!(pO[o] > 1e-12)) continue;
    const col = []; for(let t=0;t<post.length;t++) col.push(post[t][o]/pO[o]);
    const hc = entropyOf(col); if(!hc.ok) return { ok:false, U:'后验熵计算失败：' + hc.U };
    condH += pO[o] * hc.H;
  }
  const eigPath1 = H0.H - condH;
  // 路径②：H(O) − H(O|θ) —— 恒等式交叉验证（两条独立路径必须一致，否则实现有误）
  const hO = entropyOf(pO);
  let condHO = 0;
  for(let t=0;t<prior.length;t++){ const hr = entropyOf(likelihood[t]); if(!hr.ok) return { ok:false, U:'行熵失败：' + hr.U }; condHO += prior[t]*hr.H; }
  const eigPath2 = (hO.ok ? hO.H : 0) - condHO;
  const agree = Math.abs(eigPath1 - eigPath2) < 1e-6;
  return { ok:true, eig:+eigPath1.toFixed(9), priorEntropy:H0.H,
    expectedPosteriorEntropy:+condH.toFixed(9), mutualInfo:+eigPath1.toFixed(9),
    eigViaPath2:+eigPath2.toFixed(9), identitiesAgree:agree,
    identityCheck: agree ? 'H(θ)−E[H(θ|O)] = H(O)−E[H(O|θ)] 两条路径一致（互信息恒等式成立）'
      : '⚠ 两条恒等路径不一致，实现可能有误',
    basis:'EIG = I(θ;O) = H(θ) − E_O[H(θ|O)]；贪心最大化 EIG 在次模目标下有 (1−1/e) 近似保证',
    form:'融合形式 E（选择器）：把"知道缺什么"转化为"下一步该观测什么"' };
}
function selectByInfoGain(prior, candidates, opts){
  opts = opts || {};
  if(!Array.isArray(candidates) || !candidates.length) return { ok:false, U:'无候选动作' };
  const rows = candidates.map(function(c, i){
    const r = expectedInfoGain(prior, c.likelihood, opts);
    return { id:(c.id == null ? i : c.id), ok:r.ok, eig:r.ok ? r.eig : null,
             identitiesAgree:r.ok ? r.identitiesAgree : null, U:!r.ok, U_reason:r.ok ? '—' : r.U };
  });
  const valid = rows.filter(function(r){ return r.ok; });
  const invalid = rows.filter(function(r){ return !r.ok; });
  valid.sort(function(a,b){ return b.eig - a.eig; });
  return { ok:true, ranked:valid.concat(invalid), best:(valid.length ? valid[0] : null),
    undecidedCount:invalid.length,
    formula:'argmax_a I(θ; O_a) —— 选能最多减少不确定性的动作',
    note:'EIG=0 表示该动作不带来任何信息（如观测与未知量独立），此时不应浪费执行代价' };
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（十）：Shapley 值归因 —— 融合形式 C「证书」（审计可解释性）
// 来源：Shapley (1953) 合作博弈；SHAP（Lundberg & Lee, NeurIPS 2017）
// 本质数学：把"结论"当作总收益 v(N)，把"证据/特征"当作玩家，问每条证据贡献了多少。
//   φᵢ = Σ_{S⊆N\{i}} |S|!(n−|S|−1)!/n! · [v(S∪{i}) − v(S)]
//   **唯一性定理**：Shapley 值是唯一同时满足四公理的归因——
//   ①效率 Σφᵢ = v(N)−v(∅)（不遗漏不捏造）②哑元（无贡献者得 0）③对称（等价者同酬）④可加性。
//   效率公理**可自检**：算完 Σφᵢ 必须等于 v(N)−v(∅)，这是可验证的证书而非断言。
// 为什么灵脑需要：灵脑审计目前是"**列出**证据"，Shapley 升级为"**量化**每条证据贡献多少"，
//   且是唯一公理化公平的分配——这对"可审计"是质变（不是"我用了这些证据"，而是"各自占多少"）。
// ════════════════════════════════════════════════════════════════════════
function shapleyValues(valueFn, n, opts){
  opts = opts || {};
  if(typeof valueFn !== 'function') return { ok:false, U:'需要价值函数 v(S)' };
  if(!(n >= 1) || n !== Math.floor(n)) return { ok:false, U:'玩家数 n 必须为正整数' };
  const maxExact = (opts.maxExact == null) ? 16 : +opts.maxExact;
  // n 过大时精确枚举 2ⁿ 不可行 → 蒙特卡洛排列采样（线性于采样数，非指数）
  if(n > maxExact){
    const iters = (opts.iterations == null) ? 2000 : +opts.iterations;
    const rnd = _mulberry32((opts.seed == null) ? 20260830 : (+opts.seed >>> 0));
    const phi = new Array(n).fill(0);
    const order = []; for(let i=0;i<n;i++) order.push(i);
    for(let it=0; it<iters; it++){
      for(let i=n-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); const t = order[i]; order[i] = order[j]; order[j] = t; }
      let inS = 0, vPrev = 0;
      for(let k=0;k<n;k++){
        inS |= (1 << order[k]);
        const vNow = valueFn(inS, n);
        phi[order[k]] += (vNow - vPrev);
        vPrev = vNow;
      }
    }
    for(let i=0;i<n;i++) phi[i] = +(phi[i]/iters).toFixed(9);
    return { ok:true, values:phi, n:n, method:'monte-carlo-permutation', iterations:iters,
      exact:false, basis:'Shapley 唯一性定理（四公理）；n>' + maxExact + ' 用排列采样近似（近似，非精确）',
      form:'融合形式 C（证书）：量化每条证据的贡献度（近似值，须标注）' };
  }
  // 精确枚举：φᵢ = Σ_S |S|!(n−|S|−1)!/n! [v(S∪{i}) − v(S)]
  const total = 1 << n;
  const v = new Array(total);
  for(let m=0;m<total;m++){ v[m] = valueFn(m, n); if(typeof v[m] !== 'number' || !isFinite(v[m])) return { ok:false, U:'v(S) 在第 ' + m + ' 个联盟上返回非有限值' }; }
  const fact = [1]; for(let i=1;i<=n;i++) fact[i] = fact[i-1]*i;
  const phi = new Array(n).fill(0);
  for(let i=0;i<n;i++){
    const bit = 1 << i;
    for(let S=0;S<total;S++){
      if(S & bit) continue;                       // 只枚举不含 i 的联盟
      const k = 0; let cnt = 0;
      for(let b=0;b<n;b++) if(S & (1<<b)) cnt++;  // |S|
      const w = (fact[cnt] * fact[n-cnt-1]) / fact[n];
      phi[i] += w * (v[S | bit] - v[S]);
    }
  }
  for(let i=0;i<n;i++) phi[i] = +phi[i].toFixed(9);
  // 效率公理自检（可验证证书）：Σφᵢ 必须 = v(N) − v(∅)
  const sum = phi.reduce(function(a,b){ return a+b; }, 0);
  const target = v[total-1] - v[0];
  return { ok:true, values:phi, n:n, method:'exact-enumeration', exact:true, coalitions:total,
    efficiencyCheck:{ sum:+sum.toFixed(9), target:+target.toFixed(9),
      residual:+Math.abs(sum - target).toFixed(12), passes:Math.abs(sum - target) < 1e-6 },
    axioms:['效率 Σφᵢ = v(N)−v(∅)（已自检）','哑元：无贡献者得 0','对称：等价者同酬','可加性'],
    basis:'Shapley (1953) 唯一性定理：四公理唯一确定该分配；Young (1985) 可用效率+对称+单调性替代可加性',
    form:'融合形式 C（证书）：把"列出证据"升级为"量化每条证据贡献多少"',
    note:'注意 Shapley 衡量**贡献**不等于**因果**（相关性归因），不可当作因果证据使用' };
}

// ════════════════════════════════════════════════════════════════════════
// 外部数学思想融合（十一）：分布漂移检测 —— 融合形式 C「证书」（保形预测的必要配套）
// 来源：最优传输 / Wasserstein-1（earth mover）；保形检验（Vovk）
// 本质数学（关键）：一维经验分布间的 W₁ 距离有**闭式解**——最优传输就是排序后配对：
//   W₁(P,Q) = ∫₀¹ |F_P⁻¹(t) − F_Q⁻¹(t)| dt（长度相同时退化为 Σ|sorted_A[i]−sorted_B[i]|/n）
//   它衡量"把一堆土搬成另一堆的最小工作量"，对**形状变化**敏感（不像均值只反映位置）。
// 为什么灵脑**必须**有它：保形预测的覆盖保证依赖**可交换性**；一旦分布漂移，保证即失效。
//   所以保形预测必须配一个漂移检测器，否则"覆盖 ≥ 90%"会在漂移后悄悄变成谎言。
//   检测方式：用校准期内部的 W₁ 波动作为**零分布**，再复用 conformalPValue 给 p 值
//   ⟹ 误报率被 α 严格控制（与保形异常检测同一套理论，零额外假设）。
// ════════════════════════════════════════════════════════════════════════
function wasserstein1(a, b, opts){
  opts = opts || {};
  if(!Array.isArray(a) || !Array.isArray(b)) return { ok:false, U:'需要两个样本数组' };
  const A = a.filter(function(x){ return typeof x === 'number' && isFinite(x); }).slice().sort(function(x,y){ return x-y; });
  const B = b.filter(function(x){ return typeof x === 'number' && isFinite(x); }).slice().sort(function(x,y){ return x-y; });
  if(!A.length || !B.length) return { ok:false, U:'样本为空' };
  const M = (opts.grid == null) ? 512 : Math.max(16, +opts.grid);
  // 分位数逆函数（线性插值）→ 对 t∈(0,1) 网格积分 |F_A⁻¹ − F_B⁻¹|
  function q(S, t){
    const pos = t * (S.length - 1), lo = Math.floor(pos), hi = Math.ceil(pos);
    return (lo === hi) ? S[lo] : S[lo] + (S[hi] - S[lo]) * (pos - lo);
  }
  let acc = 0;
  for(let j=0;j<M;j++){ const t = (j + 0.5) / M; acc += Math.abs(q(A, t) - q(B, t)); }
  return { ok:true, w1:+(acc / M).toFixed(9), nA:A.length, nB:B.length, grid:M,
    scale:+(Math.abs(q(A,0.5)) + Math.abs(q(B,0.5))).toFixed(9),
    basis:'W₁ = ∫₀¹|F_A⁻¹(t) − F_B⁻¹(t)|dt（一维最优传输闭式解：排序后配对即为最优）',
    note:'W₁ 对分布**形状**变化敏感；绝对值需结合数据尺度解读（可用 w1/scale 作相对量）' };
}
function driftCheck(calib, recent, opts){
  opts = opts || {};
  const alpha = (opts.alpha == null) ? 0.05 : +opts.alpha;
  const B = (opts.bootstrap == null) ? 200 : +opts.bootstrap;
  const seed = (opts.seed == null) ? 20260830 : (+opts.seed >>> 0);
  if(!Array.isArray(calib) || calib.length < 8) return { ok:false, U:'校准样本过少(<8)，无法构造零分布' };
  if(!Array.isArray(recent) || !recent.length) return { ok:false, U:'无近期样本' };
  const rnd = _mulberry32(seed);
  // 零分布：把校准集随机对半分，算组内 W₁ —— 代表"**没有漂移时** W₁ 的典型波动"
  const nullScores = [];
  for(let b=0;b<B;b++){
    const idx = []; for(let i=0;i<calib.length;i++) idx.push(i);
    for(let i=idx.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    const h1 = [], h2 = [];
    for(let i=0;i<idx.length;i++){ (i % 2 === 0 ? h1 : h2).push(calib[idx[i]]); }
    const w = wasserstein1(h1, h2, opts);
    if(w.ok) nullScores.push(w.w1);
  }
  if(nullScores.length < 8) return { ok:false, U:'零分布样本不足，无法给出 p 值' };
  const obs = wasserstein1(calib, recent, opts);
  if(!obs.ok) return { ok:false, U:'观测量计算失败：' + obs.U };
  // 复用保形 p 值：与 conformalIsAnomaly 同一套理论 ⟹ 误报率同样被 α 控制
  const pv = conformalPValue(nullScores, obs.w1);
  if(!pv.ok) return Object.assign({}, pv, { U:true, ok:false, drift:null });
  return { ok:true, observedW1:obs.w1, p:pv.p, alpha:alpha, drift:pv.p <= alpha,
    nullMedian:+nullScores.slice().sort(function(x,y){ return x-y; })[Math.floor(nullScores.length/2)].toFixed(9),
    nullMax:+Math.max.apply(null, nullScores).toFixed(9), bootstrap:B, seed:seed,
    verdict: pv.p <= alpha ? '检出分布漂移 ⟹ **保形校准已过期，必须重新校准**'
      : '未检出漂移（不足以证明无漂移，仅表示当前证据不够）',
    guarantee:'可交换性下 P(p ≤ α) ≤ α ⟹ 误报率受控（与保形异常检测同一理论）',
    form:'融合形式 C（证书）：为保形预测提供"保证是否仍有效"的监控',
    note:'这是保形预测的**必要配套**——没有它，"覆盖 ≥ 90%"可能已在漂移下悄悄失效' };
}

// ════════════════════════════════════════════════════════════════════════
// ║  灵脑数学内核（LCF 可信内核架构）—— 整个产品的地基                     ║
// ║  此处之上无断言，只有公理与由之派生的定理。                            ║
// ════════════════════════════════════════════════════════════════════════
// 为什么这样重构：
//   此前灵脑的"保证"是**事后标注**的（sound:true 硬编码、verified 布尔位、grounding 人工分层），
//   声称可靠却不给证明，这违反灵脑自己的可审计原则。
// 采用的范式：LCF 架构（Logic of Computable Functions，Milner 1972）——Coq/Isabelle/HOL 的共同祖先。
//   核心思想：把"定理"做成**抽象数据类型**，只有内核的推理规则才能构造它。
//   ⟹ 任何持有 thm 值的地方，**它必然已被证明**（可靠性由类型系统/构造过程保证，而非信任调用方）。
//   ⟹ De Bruijn 准则：证明可被一个独立的小内核复核。
// 三条铁律（内核不变量）：
//   ① 公理（axiom）是无条件接受的基础，须显式声明且可审计（不偷加公理）。
//   ② 定理（theorem）只能由推理规则从【已证明的定理或公理】派生 —— **禁止**依赖猜想。
//   ③ 猜想（conjecture）即使有大量数值证据，也**永远不能**作为任何定理的前提。
//      ⟹ 这条保证"未被证明的东西绝不会污染证明链"，是灵脑"不幻觉"最硬的形式化。
// ════════════════════════════════════════════════════════════════════════
const MathKernel = {
  _axioms: {}, _rules: {}, _theorems: {}, _conjectures: {}, _order: [], _log: [],

  // ── 公理：无条件接受的基础，必须显式声明来源 ──
  axiom(id, statement, opts) {
    opts = opts || {};
    if (this._axioms[id] || this._theorems[id]) return { ok: false, error: '标识已存在：' + id };
    this._axioms[id] = { id: id, kind: 'axiom', statement: statement,
      field: opts.field || '未分类', source: opts.source || '未注明来源',
      informal: opts.informal || '', at: this._order.length };
    this._order.push(id);
    return { ok: true, id: id };
  },

  // ── 推理规则：唯一能"产生"定理的途径 ──
  rule(id, spec) {
    if (this._rules[id]) return { ok: false, error: '规则已存在：' + id };
    this._rules[id] = Object.assign({ id: id }, spec);
    return { ok: true, id: id };
  },

  // ── 定理：只能由规则从【公理 / 已证明定理】派生 ──
  theorem(id, statement, opts) {
    opts = opts || {};
    if (this._axioms[id] || this._theorems[id]) return { ok: false, error: '标识已存在：' + id };
    const by = opts.by, from = opts.from || [];
    if (!this._rules[by]) return { ok: false, error: '未知推理规则：' + by };
    // 铁律②③：前提必须是公理或已证明定理，猜想一律拒绝
    const bad = from.filter(p => this._conjectures[p]);
    if (bad.length) return { ok: false, error: '定理不得依赖未证明的猜想：' + bad.join(', '), rejected: bad };
    const unknown = from.filter(p => !this._axioms[p] && !this._theorems[p]);
    if (unknown.length) return { ok: false, error: '前提不存在：' + unknown.join(', '), missing: unknown };
    this._theorems[id] = { id: id, kind: 'theorem', statement: statement, by: by, from: from.slice(),
      field: opts.field || '未分类', evidence: opts.evidence || null,
      proof: opts.proof || '', refuted: false, at: this._order.length };
    this._order.push(id);
    this._log.push({ t: 'theorem', id: id, by: by, from: from.slice() });
    return { ok: true, id: id, dependsOn: from.slice() };
  },

  // ── 猜想：有证据但未证明 ⟹ 明确标记，**禁止**进入证明链 ──
  conjecture(id, statement, opts) {
    opts = opts || {};
    if (this._theorems[id] || this._conjectures[id]) return { ok: false, error: '标识已存在：' + id };
    this._conjectures[id] = { id: id, kind: 'conjecture', statement: statement,
      field: opts.field || '未分类', evidence: opts.evidence || '无', usable: false, at: this._order.length };
    this._order.push(id);
    return { ok: true, id: id, note: '猜想不可作为任何定理的前提（铁律③）' };
  },
  // 猜想被证明 ⟹ 升格为定理（这是唯一让它进入证明链的方式）
  promoteConjecture(cid, id, statement, opts) {
    if (!this._conjectures[cid]) return { ok: false, error: '无此猜想：' + cid };
    delete this._conjectures[cid];
    return this.theorem(id, statement, opts);
  },

  // ── 证明链：把定理回溯到它所依赖的公理（可审计的证据路径）──
  proofChain(id, seen) {
    // seen = **当前递归路径**（非全局已访问集），且**所有**返回路径都必须出栈。
    // 否则 DAG 中"同一公理被两条不同路径引用"会被误判为循环（依赖图是 DAG 不是树）。
    // 实现上用 try/finally 统一出栈，避免任一 return 分支遗漏。
    seen = seen || new Set();
    if (seen.has(id)) return { ok: false, error: '证明链存在循环：' + id };
    seen.add(id);
    try {
      return this._chainWalk(id, seen);
    } finally {
      seen.delete(id);
    }
  },
  _chainWalk(id, seen) {
    const t = this._theorems[id];
    if (!t) {
      if (this._axioms[id]) return { ok: true, chain: [id], axioms: [id], depth: 1 };
      if (this._conjectures[id]) return { ok: false, error: '这是猜想，不是定理：' + id };
      return { ok: false, error: '未知标识：' + id };
    }
    let axioms = [], chain = [id], maxDepth = 1;
    for (const p of t.from) {
      const r = this.proofChain(p, seen);
      if (!r.ok) return { ok: false, error: r.error };
      chain = chain.concat(r.chain);
      axioms = axioms.concat(r.axioms);
      maxDepth = Math.max(maxDepth, r.depth + 1);
    }
    return { ok: true, chain: chain, axioms: [...new Set(axioms)], depth: maxDepth, by: t.by };
  },

  // ── 验证单个定理：规则存在、前提合法、链能回溯到公理 ──
  verify(id) {
    const t = this._theorems[id];
    if (!t) return { ok: false, error: '非定理：' + id };
    if (!this._rules[t.by]) return { ok: false, error: '未知规则：' + t.by, invalid: true };
    const badPremise = t.from.filter(p => this._conjectures[p]);
    if (badPremise.length) return { ok: false, error: '前提含猜想（违反铁律③）', invalid: true, bad: badPremise };
    const c = this.proofChain(id);
    if (!c.ok) return { ok: false, error: c.error, invalid: true };
    return { ok: true, id: id, valid: true, depth: c.depth,
      founded: c.axioms.length > 0, foundationAxioms: c.axioms,
      verdict: '由 ' + t.by + ' 从 ' + t.from.length + ' 个前提派生，深度 ' + c.depth
               + '，根基为公理 [' + c.axioms.join(', ') + ']' };
  },

  // ── 全内核验证（De Bruijn 准则：独立、可重复地复核一切）──
  verifyAll() {
    const ids = Object.keys(this._theorems);
    const invalid = [], results = [];
    let maxDepth = 0;
    for (const id of ids) {
      const r = this.verify(id);
      results.push({ id: id, valid: r.ok, depth: r.ok ? r.depth : null });
      if (!r.ok) invalid.push({ id: id, error: r.error });
      else maxDepth = Math.max(maxDepth, r.depth);
    }
    return { ok: invalid.length === 0, theorems: ids.length, invalid: invalid,
      axioms: Object.keys(this._axioms).length, conjectures: Object.keys(this._conjectures).length,
      maxDepth: maxDepth, results: results,
      verdict: invalid.length === 0
        ? '全部 ' + ids.length + ' 条定理证明链闭合，均可回溯至公理（无可信缺口）'
        : invalid.length + ' 条定理无效，证明链断裂' };
  },

  // ── 某条定理的数学根基（它到底建立在哪些公理上）──
  foundationOf(id) {
    const c = this.proofChain(id);
    if (!c.ok) return { ok: false, error: c.error };
    return { ok: true, id: id, axioms: c.axioms,
      detail: c.axioms.map(a => ({ id: a, statement: this._axioms[a] ? this._axioms[a].statement : '?' })) };
  },
  get(id) { return this._axioms[id] || this._theorems[id] || this._conjectures[id] || null; },
  status() {
    return { axioms: Object.keys(this._axioms).length, theorems: Object.keys(this._theorems).length,
      conjectures: Object.keys(this._conjectures).length, rules: Object.keys(this._rules).length,
      order: this._order.slice() };
  }
};

// ── 推理规则（逻辑上真实、数量极小 ⟹ 内核可信）──
MathKernel.rule('AXIOM',    { arity: 0, desc: '直接引用公理' });
MathKernel.rule('MP',       { arity: 2, desc: '假言推理：A, A⟹B ⊢ B' });
MathKernel.rule('CONJ',     { arity: -1, desc: '合取引入：A, B ⊢ A∧B（前提数可变）' });
MathKernel.rule('INST',     { arity: 1, desc: '全称实例化：∀x.P(x) ⊢ P(c)' });

// ── 11. 匈牙利算法（Kuhn–Munkres 最优二分匹配）─────────────────────────
// 定位：Hall 定理只回答「能不能全分配」；匈牙利算法回答「最优怎么分」。
// 数学保证：线性分配问题是 LP，且其约束矩阵全单模 ⇒ LP 最优解自动整数
//   ⇒ 无需分支界定即得整数最优（Birkhoff–von Neumann / 全单模性）。
// 可验证性：返回 LP 对偶变量 (u,v) 作为**最优性证书**，满足
//   ① 对偶可行：∀i,j  c[i][j] − u[i] − v[j] ≥ 0
//   ② 互补松弛：被选边上取等号
//   ③ 强对偶：Σu + Σv == 总代价（duality gap = 0）
//   三者成立 ⇒ 该分配可被第三方独立验证为最优（不必信任本实现）。
// 禁止分配：cost 用 null / Infinity 表示；内部代以 BIG = 1+Σ有限代价，
//   BIG 严格大于任何可行解总代价 ⇒ 若最优解仍含 BIG 边，则**不存在**满足禁止
//   约束的完美匹配 ⇒ 诚实返回 feasible:false，绝不给出违反禁止约束的方案。
function hungarian(cost, opts) {
  opts = opts || {};
  if (!Array.isArray(cost) || !cost.length || !Array.isArray(cost[0]))
    return { ok: false, U: true, error: 'cost 必须为非空二维数组 ⇒ 𝕌' };
  var nR = cost.length, nC = cost[0].length, i, j;
  for (i = 0; i < nR; i++) if (!Array.isArray(cost[i]) || cost[i].length !== nC)
    return { ok: false, U: true, error: '第 ' + i + ' 行长度不一致 ⇒ 𝕌（拒绝猜测缺失代价）' };
  // BIG：严格大于任何可行完美匹配的总代价
  var sumFinite = 0;
  for (i = 0; i < nR; i++) for (j = 0; j < nC; j++) {
    var c0 = cost[i][j];
    if (c0 != null && isFinite(c0)) { if (c0 < 0 && !opts.allowNegative) sumFinite += Math.abs(c0); else sumFinite += Math.abs(c0); }
  }
  var BIG = sumFinite + 1;
  // 方阵化：列不足则补虚拟列（代价 0，被分到虚拟列 ⇒ 该行未分配）
  var n = nR, m = Math.max(nR, nC), padded = m - nC;
  var a = [];                       // 1-indexed 工作矩阵
  for (i = 1; i <= n; i++) {
    a[i] = [];
    for (j = 1; j <= m; j++) {
      if (j > nC) { a[i][j] = 0; continue; }             // 虚拟列
      var c = cost[i - 1][j - 1];
      a[i][j] = (c == null || !isFinite(c)) ? BIG : c;   // 禁止分配 → BIG
    }
  }
  // Jonker–Volgenant O(n²m)：逐行增广 + 势(potential)维护
  var INF = Infinity;
  var u = new Array(n + 1).fill(0), v = new Array(m + 1).fill(0);
  var p = new Array(m + 1).fill(0), way = new Array(m + 1).fill(0);
  for (i = 1; i <= n; i++) {
    p[0] = i;
    var j0 = 0;
    var minv = new Array(m + 1).fill(INF), used = new Array(m + 1).fill(false);
    do {
      used[j0] = true;
      var i0 = p[j0], delta = INF, j1 = -1;
      for (j = 1; j <= m; j++) if (!used[j]) {
        var cur = a[i0][j] - u[i0] - v[j];
        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
      }

      for (j = 0; j <= m; j++) {

        ? '最优解被迫使用禁止边 ⇒ 不存在满足禁止约束的完美匹配（诚实报不可行，不输出违规方案）'
        : '列少于行，' + unassigned.length + ' 行无法分配 ⇒ 返回最优部分分配并标记未分配行')
      : '最优分配已求得；对偶证书 (u,v) 满足对偶可行+互补松弛+零对偶间隙 ⇒ 第三方可独立验证最优性（LP 全单模 ⇒ 整数最优）'
  };
}

// ── 12. 抽象解释 / 区间不动点分析（格上迭代 + widening）───────────────
// Cousot & Cousot 1977：程序不变式 = 单调算子在完备格上的最小不动点。
// 关键定理：
//   ① Tarski/Kleene：单调算子在完备格上有最小不动点，可由 ⊥ 起迭代逼近；
//   ② 区间格高度无限 ⇒ 迭代可能不终止 ⇒ 用 widening ∇ 强制有限步收敛
//      （代价：过近似 over-approximation ⇒ 结论「安全」可信，「不安全」需 narrowing 复核）；
//   ③ narrowing △ 在不动点后向内收窄，恢复部分精度，且保持可靠性。

// ════════════════════════════════════════════════════════════════════════
// 重新审视（一）：抽象解释只做了**一半** —— 补上 must（证不安全）方向的严格结论
// 审视发现：人类数学里的抽象解释是**双向**的（may 过近似 / must 欠近似）。
//   灵脑只实现了 may（过近似），后果是**严重的能力不对称**：
//     只能证明"安全"，无法证明"危险" ⟹ 遇到确定会违规的路径，也只会含糊标 𝕌，
//     无法果断拒绝。对安全产品而言，这是比"算不快"严重得多的缺陷。
// 关键洞察（无需新假设）：**同一个过近似就能给出双向严格结论**——
//   设 inv 是过近似（真实可达集 R ⊆ inv）：
//   ① inv ⊆ safe        ⟹ R ⊆ safe       ⟹ **确定安全**（灵脑已有）
//   ② inv ∩ safe = ∅    ⟹ R ∩ safe = ∅   ⟹ **确定不安全**（严格成立！此前漏掉）
//   ③ 其余              ⟹ 才是真正不可判定的 𝕌
//   ② 的正确性：R ⊆ inv 且 inv ∩ safe = ∅ ⟹ R ∩ safe = ∅。这是纯集合论，零新假设。
// ════════════════════════════════════════════════════════════════════════
function absVerdict(inv, safeItv, opts) {
  opts = opts || {};
  if (itvIsBot(inv)) return { verdict:'SAFE', U:false, invariant:inv, safeRegion:safeItv,
    reason:'不变式为 ⊥（不可达）⇒ 平凡安全', basis:'R ⊆ ⊥ = ∅，空集安全' };
  if (itvIsBot(safeItv)) return { verdict:'UNSAFE', U:false, invariant:inv, safeRegion:safeItv,
    reason:'安全区间为空集 ⇒ 任何可达状态都违规 ⇒ 确定不安全', basis:'safe = ∅ ⟹ R ∩ safe = ∅ 且 R ≠ ∅' };
  // ① 确定安全：inv ⊆ safe
  if (itvLe(inv, safeItv)) return { verdict:'SAFE', U:false, invariant:inv, safeRegion:safeItv,
    reason:'不变式 ⊑ 安全区间 ⇒ 过近似都安全 ⇒ 真实执行必安全',
    basis:'R ⊆ inv ⊆ safe ⟹ R ⊆ safe（可靠/完备的证明结论）' };

    reason:'不变式与安全区间**完全不相交** ⇒ 所有可达状态都在安全区之外 ⇒ 确定会违规',
    basis:'R ⊆ inv 且 inv ∩ safe = ∅ ⟹ R ∩ safe = ∅ ⇒ 必然违反（纯集合论，无需欠近似域）',
    note:'这是此前遗漏的方向：**可以证明不安全**，从而果断拒绝执行，而非含糊标 𝕌' };

    overlap: inter, potentialViolation: [violLo, violHi].filter(Boolean),
    reason:'不变式部分越出安全区间，但**越出部分可能是过近似引入的假象**（真实集未必触及）⇒ 真·不可判定',
    basis:'既不满足 inv ⊆ safe，也不满足 inv ∩ safe = ∅ ⟹ 无法判定',
    advice:'要定论：① 精化抽象域（如改用 zonotope/多面体）② 收窄初值区间 ③ 缩短时间步后重判' };
}

// ════════════════════════════════════════════════════════════════════════
// 重新审视（二）：`sound: true` 是**断言**而非结论 —— 用 Galois 连接把它变成可验证性质

//   字段引用支撑定理（THM_ABSINT_SOUND / THM_ZONOTOPE_SOUND），且 `sound` 由
//   `MathKernel.get(定理ID)` 派生 —— 标注彻底消失，结论全部来自内核。
//   声称"可靠"却不给出证明，这违反灵脑自己的可审计原则。
// 数学标准：抽象解释的正确性由 **Galois 连接**（Galois connection）保证：
//   存在抽象化 α: C→A 与具体化 γ: A→C，满足  α(c) ⊑ a  ⟺  c ≤ γ(a)
//   这是抽象解释**唯一**的标准正确性判据；有了它，"sound" 才是定理而非口号。

//   验证：α(S) ⊑ [l,h] ⟺ [min S,max S] ⊆ [l,h] ⟺ l ≤ min S ∧ max S ≤ h ⟺ S ⊆ γ([l,h]) ✓

function galoisAlphaSet(S) {                       // α：具体点集 → 区间
  if (!Array.isArray(S) || !S.length) return ITV_BOT;

  for (let i = 0; i < sampleSets.length && sampleSets[i] && sampleSets[i].length; i++) {

      const rhs = galoisGammaContains(a, S);       // S ⊆ γ(a)

      : '发现 ' + violations.length + ' 处违反 ⟹ 该抽象**不可靠**，必须修正',
    basis:'Galois 连接（Cousot & Cousot 标准正确性判据）；α(S)=[minS,maxS]，γ([l,h])={x|l≤x≤h}',
    note:'采样验证是**实证**而非穷尽证明；理论证明见 α/γ 定义的等价推导（对区间域恒成立）' };
}

// ════════════════════════════════════════════════════════════════════════
// 重新审视（三）：𝕌 是**布尔标记**，但不确定性应该是**区间** —— 升级为不精确概率
// 审视发现：灵脑最独特的卖点是"诚实标 𝕌"，但 𝕌 目前是**一个布尔位**，
//   无法区分"差一点就能判定"和"完全无知" —— 信息被压扁了，决策也因此过度保守。
// 自主设计：引入**不精确概率**（imprecise probability；Walley / Dempster–Shafer）
//   用区间 [belief, plausibility] 表示不确定性：
//     belief        = 确信成立的概率下界（证据支持的）
//     plausibility  = 可能成立的概率上界（未被否证的）
//     恒有 belief ≤ plausibility；宽度 w = plausibility − belief = **不确定性本身**
//   统一了灵脑里原本分裂的三种表示：
//     精确概率   ⟹ belief = plausibility = p（w = 0，完全确定）
//     区间/集合   ⟹ 转成概率包络（w > 0）
//     完全无知   ⟹ [0, 1]（w = 1）
//   **𝕌 的严格语义**：决策阈值 θ 落在区间内，即 belief < θ ≤ plausibility ⟹ 无法判定。
//   这把 𝕌 从"不知道"变成"**差多少才能知道**"（可量化、可指导下一步该补什么证据）。
// ════════════════════════════════════════════════════════════════════════
function beliefPlausibility(belief, plausibility, opts) {

  if (b < 0 || p > 1) return { ok:false, U:'须满足 0 ≤ belief ≤ plausibility ≤ 1' };

    basis:'不精确概率包络 [belief, plausibility]（Dempster–Shafer / Walley）；宽度即不确定性本身',

  const th = (threshold == null) ? 0.5 : +threshold;
  if (!(th >= 0 && th <= 1)) return { ok:false, U:'阈值须 ∈ [0,1]' };

  const st=bootSelfTest(); st.lines.forEach(l=>log.push(l));
  // 3) 状态灯
  const stEl=$('brainState');
  if(stEl){ stEl.textContent = imaKnowledge.loaded ? '灵脑大脑已接入 ✓' : '大脑已就绪 · IMA 未加载'; stEl.className='tag '+(imaKnowledge.loaded?'done':'todo'); }
  $('bootOut').innerHTML = log.map(l=>'· '+l).join('<br>') + '<br><b>核心能力自检 '+st.pass+'/'+st.total+' 通过</b>';
  if(btn){ btn.disabled=false; btn.textContent = imaKnowledge.loaded ? '重新接入灵脑大脑' : '接入灵脑大脑'; }
}
function bootSelfTest(){
  const lines=[]; let pass=0, total=0;
  const ck=(name, cond)=>{ total++; if(cond){pass++; lines.push('✓ '+name);} else lines.push('✗ '+name); };
  try{ const r=reason('CHARGE','C',{hard:[],soft:[]}); ck('自动规划最优路径（可审计推理）', r && r.status==='optimal' && Array.isArray(r.path) && r.path[0]==='CHARGE'); }catch(e){ ck('自动规划最优路径', false); lines.push('  '+e.message); }
  try{ const g=goalDirected('CHARGE','C',{}); ck('目标导向决策（已吸收 IMA 目标框架）', g && Array.isArray(g.path) && g.path[g.path.length-1]==='C'); }catch(e){ ck('目标导向决策', false); lines.push('  '+e.message); }
  try{ const d=dmcts('CHARGE','C',[],[]); ck('分支探索（蒙特卡洛树搜索）', d && d.best); }catch(e){ ck('分支探索', false); lines.push('  '+e.message); }
  if(imaKnowledge.loaded){ try{ const q=imaKnowledge.query('未知',3); ck('证据检索：可引用 IMA 数学公理', q && q.length>0); }catch(e){ ck('证据检索', false); } }
  else lines.push('· IMA 检索：未加载（手动加载后可验证）');
  ck('误差监控（切比雪夫界）', typeof SelfLearn!=='undefined' && typeof SelfLearn.slMonitor==='function');
  return {pass,total,lines};
}
// 一键接入智能体：给出 MCP stdio 接入配置（浏览器内无法启动 Node 进程，这里输出可复制的配置/命令）
function connectAgent(){
  const box=$('agentBox'); if(!box) return; box.style.display='block';
  const cfg=JSON.stringify({mcpServers:{lingnao:{command:'node',args:['lingnao-mcp.js']}}},null,2);
  box.innerHTML='外部智能体接入（MCP stdio）：<br><pre style="background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px">node lingnao-mcp.js</pre>'
    +'客户端配置（写入 MCP 客户端的 mcp.json）：<br><pre style="background:#0f172a;color:#e2e8f0;padding:10px;border-radius:8px">'+cfg+'</pre>'
    +'暴露工具：perceive · reason · carrier_report · learn · audit · query · add · set_world · goal_directed · dmcts · pac_bound · ask · explain<br>'
