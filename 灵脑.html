// ── 11. 匈牙利算法（Kuhn–Munkres 最优二分匹配）─────────────────────────
// 定位：Hall 定理只回答「能不能全分配」；匈牙利算法回答「最优怎么分」。
// 数学保证：线性分配问题是 LP，且其约束矩阵全单模 ⇒ LP 最优解自动整数
//   ⇒ 无需分支界定即得整数最优（Birkhoff–von Neumann / 全单模性）。
// 可验证性：返回 LP 对偶变量 (u,v) 作为**最优性证书**，满足
//   ① 对偶可行：∀i,j  c[i][j] − u[i] − v[j] ≥ 0
//   ② 互补松弛：被选边上取等号
//   ③ 强对偶：Σu + Σv == 总代价（duality gap = 0）
//   三者成立 ⇒ 该分配可被第三方独立验证为最优（不必信任本实现）。
// 禁止分配：cost 用 null / Infinity 表示；内部代以 BIG = 1+Σ有限代价，
//   BIG 严格大于任何可行解总代价 ⇒ 若最优解仍含 BIG 边，则**不存在**满足禁止
//   约束的完美匹配 ⇒ 诚实返回 feasible:false，绝不给出违反禁止约束的方案。
function hungarian(cost, opts) {
  opts = opts || {};
  if (!Array.isArray(cost) || !cost.length || !Array.isArray(cost[0]))
    return { ok: false, U: true, error: 'cost 必须为非空二维数组 ⇒ 𝕌' };
  var nR = cost.length, nC = cost[0].length, i, j;
  for (i = 0; i < nR; i++) if (!Array.isArray(cost[i]) || cost[i].length !== nC)
    return { ok: false, U: true, error: '第 ' + i + ' 行长度不一致 ⇒ 𝕌（拒绝猜测缺失代价）' };
  // BIG：严格大于任何可行完美匹配的总代价
  var sumFinite = 0;
  for (i = 0; i < nR; i++) for (j = 0; j < nC; j++) {
    var c0 = cost[i][j];
    if (c0 != null && isFinite(c0)) { if (c0 < 0 && !opts.allowNegative) sumFinite += Math.abs(c0); else sumFinite += Math.abs(c0); }
  }
  var BIG = sumFinite + 1;
  // 方阵化：列不足则补虚拟列（代价 0，被分到虚拟列 ⇒ 该行未分配）
  var n = nR, m = Math.max(nR, nC), padded = m - nC;
  var a = [];                       // 1-indexed 工作矩阵
  for (i = 1; i <= n; i++) {
    a[i] = [];
    for (j = 1; j <= m; j++) {
      if (j > nC) { a[i][j] = 0; continue; }             // 虚拟列
      var c = cost[i - 1][j - 1];
      a[i][j] = (c == null || !isFinite(c)) ? BIG : c;   // 禁止分配 → BIG
    }
  }
  // Jonker–Volgenant O(n²m)：逐行增广 + 势(potential)维护
  var INF = Infinity;
  var u = new Array(n + 1).fill(0), v = new Array(m + 1).fill(0);
  var p = new Array(m + 1).fill(0), way = new Array(m + 1).fill(0);
  for (i = 1; i <= n; i++) {
    p[0] = i;
    var j0 = 0;
    var minv = new Array(m + 1).fill(INF), used = new Array(m + 1).fill(false);
    do {
      used[j0] = true;
      var i0 = p[j0], delta = INF, j1 = -1;
      for (j = 1; j <= m; j++) if (!used[j]) {
        var cur = a[i0][j] - u[i0] - v[j];
        if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
        if (minv[j] < delta) { delta = minv[j]; j1 = j; }
      }
      if (j1 < 0) return { ok: false, U: true, error: '增广失败（矩阵含非数值）⇒ 𝕌' };
      for (j = 0; j <= m; j++) {
        if (used[j]) { u[p[j]] += delta; v[j] -= delta; }
        else minv[j] -= delta;
      }
      j0 = j1;
    } while (p[j0] !== 0);
    do { var jw = way[j0]; p[j0] = p[jw]; j0 = jw; } while (j0);
  }
  // 抽取分配
  var assignment = new Array(n).fill(null), total = 0, forbiddenUsed = [], unassigned = [];
  for (j = 1; j <= m; j++) {
    if (p[j] === 0) continue;
    var row = p[j] - 1, col = j - 1;
    if (col >= nC) { unassigned.push(row); continue; }   // 分到虚拟列 ⇒ 该行没有真实分配
    assignment[row] = col;
    var real = cost[row][col];
    if (real == null || !isFinite(real)) forbiddenUsed.push({ row: row, col: col });
    else total += real;
  }
  // 最优性证书：对偶可行 + 互补松弛 + 强对偶
  var eps = 1e-9, dualFeasible = true, slackMin = INF, complementary = true;
  for (i = 1; i <= n; i++) for (j = 1; j <= m; j++) {
    var s = a[i][j] - u[i] - v[j];
    if (s < slackMin) slackMin = s;
    if (s < -eps) dualFeasible = false;
  }
  for (i = 0; i < n; i++) {
    var cj = assignment[i] != null ? assignment[i] : null;
    if (cj == null) continue;
    var s2 = a[i + 1][cj + 1] - u[i + 1] - v[cj + 1];
    if (Math.abs(s2) > 1e-7) complementary = false;
  }
  var dualObj = 0;
  for (i = 1; i <= n; i++) dualObj += u[i];
  for (j = 1; j <= m; j++) dualObj += v[j];
  var primalWork = 0;
  for (i = 0; i < n; i++) if (assignment[i] != null) primalWork += a[i + 1][assignment[i] + 1];
  var gap = Math.abs(dualObj - primalWork);
  var feasible = forbiddenUsed.length === 0 && unassigned.length === 0;
  return {
    ok: true, feasible: feasible,
    assignment: assignment,            // assignment[i] = 分给行 i 的列（null=未分配）
    totalCost: feasible ? total : null,
    unassigned: unassigned, forbiddenUsed: forbiddenUsed,
    padded: padded,
    certificate: {
      u: u.slice(1), v: v.slice(1, nC + 1),
      dualFeasible: dualFeasible, complementarySlackness: complementary,
      minSlack: slackMin, dualObjective: dualObj, primalObjective: primalWork,
      dualityGap: gap, verified: dualFeasible && complementary && gap < 1e-6
    },
    note: !feasible
      ? (forbiddenUsed.length
        ? '最优解被迫使用禁止边 ⇒ 不存在满足禁止约束的完美匹配（诚实报不可行，不输出违规方案）'
        : '列少于行，' + unassigned.length + ' 行无法分配 ⇒ 返回最优部分分配并标记未分配行')
      : '最优分配已求得；对偶证书 (u,v) 满足对偶可行+互补松弛+零对偶间隙 ⇒ 第三方可独立验证最优性（LP 全单模 ⇒ 整数最优）'
  };
}

// ── 12. 抽象解释 / 区间不动点分析（格上迭代 + widening）───────────────
// Cousot & Cousot 1977：程序不变式 = 单调算子在完备格上的最小不动点。
// 关键定理：
//   ① Tarski/Kleene：单调算子在完备格上有最小不动点，可由 ⊥ 起迭代逼近；
//   ② 区间格高度无限 ⇒ 迭代可能不终止 ⇒ 用 widening ∇ 强制有限步收敛
//      （代价：过近似 over-approximation ⇒ 结论「安全」可信，「不安全」需 narrowing 复核）；
//   ③ narrowing △ 在不动点后向内收窄，恢复部分精度，且保持可靠性。
// 诚实性：一切结论都标注 sound=true（过近似），绝不把过近似当精确值。
var ITV_BOT = { bot: true };
function itv(lo, hi) {
  if (lo == null || hi == null) return ITV_BOT;
  if (lo > hi) return ITV_BOT;                       // 空区间 = ⊥
  return { lo: lo, hi: hi };
}
function itvIsBot(x) { return !x || x.bot === true; }
function itvTop() { return { lo: -Infinity, hi: Infinity }; }
function itvLe(x, y) {                               // x ⊑ y（区间包含序）
  if (itvIsBot(x)) return true;
  if (itvIsBot(y)) return false;
  return y.lo <= x.lo && x.hi <= y.hi;
}
function itvEq(x, y) {
  if (itvIsBot(x) && itvIsBot(y)) return true;
  if (itvIsBot(x) || itvIsBot(y)) return false;
  return x.lo === y.lo && x.hi === y.hi;
}
function itvJoin(x, y) {                             // ⊔ 最小上界（凸包）
  if (itvIsBot(x)) return itvIsBot(y) ? ITV_BOT : { lo: y.lo, hi: y.hi };
  if (itvIsBot(y)) return { lo: x.lo, hi: x.hi };
  return { lo: Math.min(x.lo, y.lo), hi: Math.max(x.hi, y.hi) };
}
function itvMeet(x, y) {                             // ⊓ 最大下界（相交）
  if (itvIsBot(x) || itvIsBot(y)) return ITV_BOT;
  return itv(Math.max(x.lo, y.lo), Math.min(x.hi, y.hi));
}
function itvAddI(x, y) {
  if (itvIsBot(x) || itvIsBot(y)) return ITV_BOT;
  return { lo: x.lo + y.lo, hi: x.hi + y.hi };
}
function itvMulI(x, y) {
  if (itvIsBot(x) || itvIsBot(y)) return ITV_BOT;
  var c = [x.lo * y.lo, x.lo * y.hi, x.hi * y.lo, x.hi * y.hi].filter(function (z) { return !isNaN(z); });
  if (!c.length) return ITV_BOT;
  return { lo: Math.min.apply(null, c), hi: Math.max.apply(null, c) };
}
// widening：不稳定端点直接推到 ±∞（可选阈值集 thresholds 做分级 widening）
function itvWiden(old, nw, thresholds) {
  if (itvIsBot(old)) return itvIsBot(nw) ? ITV_BOT : { lo: nw.lo, hi: nw.hi };
  if (itvIsBot(nw)) return { lo: old.lo, hi: old.hi };
  var ts = (thresholds || []).slice().sort(function (p, q) { return p - q; });
  function downTo(x) { for (var k = ts.length - 1; k >= 0; k--) if (ts[k] <= x) return ts[k]; return -Infinity; }
  function upTo(x) { for (var k = 0; k < ts.length; k++) if (ts[k] >= x) return ts[k]; return Infinity; }
  return {
    lo: nw.lo < old.lo ? (ts.length ? downTo(nw.lo) : -Infinity) : old.lo,
    hi: nw.hi > old.hi ? (ts.length ? upTo(nw.hi) : Infinity) : old.hi
  };
}
// narrowing：仅当旧值为无穷端时才允许收窄（保证可靠性）
function itvNarrow(old, nw) {
  if (itvIsBot(old) || itvIsBot(nw)) return ITV_BOT;
  // 标准 narrowing：只有被 widening 推到无穷的端点才允许向内收，
  // 有限端点一律保持不变 ⇒ 收窄后仍是过近似（sound 不被破坏）。
  return {
    lo: (old.lo === -Infinity) ? nw.lo : old.lo,
    hi: (old.hi === Infinity) ? nw.hi : old.hi
  };
}
// 不动点迭代：X ← X ∇ (init ⊔ F(X))；widening 保证终止，再 narrowing 提精度
// transfer: (X) => 区间   —— 循环体对变量的作用（须单调）
function absFixpoint(transfer, init, opts) {
  opts = opts || {};
  var maxIter = opts.maxIter || 200, thresholds = opts.thresholds || null;
  var X = itvIsBot(init) ? ITV_BOT : { lo: init.lo, hi: init.hi };
  var trace = [], widened = false, k;
  for (k = 0; k < maxIter; k++) {
    var F;
    try { F = transfer(X); } catch (e) { return { ok: false, U: true, error: 'transfer 抛错：' + e.message + ' ⇒ 𝕌' }; }
    var next = itvJoin(init, F);
    var w = itvWiden(X, next, thresholds);
    if (!itvEq(w, X)) widened = widened || !itvEq(w, next);
    trace.push({ iter: k, before: X, after: w });
    if (itvLe(w, X) && itvLe(X, w)) { X = w; break; }   // 到达不动点
    X = w;
  }
  var converged = k < maxIter;
  // narrowing：把 widening 推到 ±∞ 的端点向内收（保持可靠）
  var narrowed = X, nSteps = 0;
  if (converged && !itvIsBot(X) && (X.lo === -Infinity || X.hi === Infinity)) {
    for (var t = 0; t < (opts.narrowIter || 20); t++) {
      var Fn;
      try { Fn = transfer(narrowed); } catch (e) { break; }
      var cand = itvJoin(init, Fn);
      var nx = itvNarrow(narrowed, cand);
      nSteps++;
      if (itvEq(nx, narrowed)) break;
      narrowed = nx;
    }
  }
  return {
    ok: true, converged: converged, iterations: k + (converged ? 1 : 0),
    invariant: X, refined: narrowed, widened: widened, narrowSteps: nSteps,
    basis: 'THM_ABSINT_SOUND',
    sound: !!MathKernel.get('THM_ABSINT_SOUND'),   // 由内核定理派生，不再硬编码断言
    exact: !widened,
    trace: trace.slice(0, 12),
    note: converged
      ? ('不动点在 ' + (k + 1) + ' 步收敛。结果是**过近似**（sound）：'
        + '真实可达集 ⊆ invariant ⇒ 若 invariant 满足安全性则程序安全；'
        + (widened ? '用过 widening ⇒ 可能比真实集大，"不安全"结论需 narrowing/复核，不可据此断言违规' : '未触发 widening ⇒ 该结果即精确最小不动点'))
      : ('达到 maxIter=' + maxIter + ' 仍未收敛 ⇒ 结论标 𝕌（不谎称已求得不变式）')
  };
}
// 区间抽象域上的安全性检查：不变式是否被安全区间包含
function absSafe(inv, safeItv) {
  if (itvIsBot(inv)) return { safe: true, reason: '不变式为 ⊥（不可达）⇒ 平凡安全' };
  if (itvIsBot(safeItv)) return { safe: false, reason: '安全区间为空 ⇒ 不可能安全' };
  var ok = itvLe(inv, safeItv);
  return {
    safe: ok, invariant: inv, safeRegion: safeItv,
    reason: ok ? '不变式 ⊑ 安全区间 ⇒ 过近似都安全 ⇒ 真实执行必安全（可靠结论）'
      : '不变式越出安全区间。因不变式是过近似，这**不等于**真的会违规 ⇒ 标 𝕌，需精化后复判',
    U: ok ? false : true
  };
}

// ════════════════════════════════════════════════════════════════════════
// 重新审视（一）：抽象解释只做了**一半** —— 补上 must（证不安全）方向的严格结论
// 审视发现：人类数学里的抽象解释是**双向**的（may 过近似 / must 欠近似）。
//   灵脑只实现了 may（过近似），后果是**严重的能力不对称**：
//     只能证明"安全"，无法证明"危险" ⟹ 遇到确定会违规的路径，也只会含糊标 𝕌，
//     无法果断拒绝。对安全产品而言，这是比"算不快"严重得多的缺陷。
// 关键洞察（无需新假设）：**同一个过近似就能给出双向严格结论**——
//   设 inv 是过近似（真实可达集 R ⊆ inv）：
//   ① inv ⊆ safe        ⟹ R ⊆ safe       ⟹ **确定安全**（灵脑已有）
//   ② inv ∩ safe = ∅    ⟹ R ∩ safe = ∅   ⟹ **确定不安全**（严格成立！此前漏掉）
//   ③ 其余              ⟹ 才是真正不可判定的 𝕌
//   ② 的正确性：R ⊆ inv 且 inv ∩ safe = ∅ ⟹ R ∩ safe = ∅。这是纯集合论，零新假设。
// ════════════════════════════════════════════════════════════════════════
function absVerdict(inv, safeItv, opts) {
  opts = opts || {};
  if (itvIsBot(inv)) return { verdict:'SAFE', U:false, invariant:inv, safeRegion:safeItv,
    reason:'不变式为 ⊥（不可达）⇒ 平凡安全', basis:'R ⊆ ⊥ = ∅，空集安全' };
  if (itvIsBot(safeItv)) return { verdict:'UNSAFE', U:false, invariant:inv, safeRegion:safeItv,
    reason:'安全区间为空集 ⇒ 任何可达状态都违规 ⇒ 确定不安全', basis:'safe = ∅ ⟹ R ∩ safe = ∅ 且 R ≠ ∅' };
  // ① 确定安全：inv ⊆ safe
  if (itvLe(inv, safeItv)) return { verdict:'SAFE', U:false, invariant:inv, safeRegion:safeItv,
    reason:'不变式 ⊑ 安全区间 ⇒ 过近似都安全 ⇒ 真实执行必安全',
    basis:'R ⊆ inv ⊆ safe ⟹ R ⊆ safe（可靠/完备的证明结论）' };
  // ② 确定不安全：inv 与 safe 不相交
  const inter = itvMeet(inv, safeItv);
  if (itvIsBot(inter)) return { verdict:'UNSAFE', U:false, invariant:inv, safeRegion:safeItv,
    reason:'不变式与安全区间**完全不相交** ⇒ 所有可达状态都在安全区之外 ⇒ 确定会违规',
    basis:'R ⊆ inv 且 inv ∩ safe = ∅ ⟹ R ∩ safe = ∅ ⇒ 必然违反（纯集合论，无需欠近似域）',
    note:'这是此前遗漏的方向：**可以证明不安全**，从而果断拒绝执行，而非含糊标 𝕌' };
  // ③ 真正不可判定
  const violLo = inv.lo < safeItv.lo ? { lo: inv.lo, hi: safeItv.lo } : null;
  const violHi = inv.hi > safeItv.hi ? { lo: safeItv.hi, hi: inv.hi } : null;
  return { verdict:'UNKNOWN', U:true, invariant:inv, safeRegion:safeItv,
    overlap: inter, potentialViolation: [violLo, violHi].filter(Boolean),
    reason:'不变式部分越出安全区间，但**越出部分可能是过近似引入的假象**（真实集未必触及）⇒ 真·不可判定',
    basis:'既不满足 inv ⊆ safe，也不满足 inv ∩ safe = ∅ ⟹ 无法判定',
    advice:'要定论：① 精化抽象域（如改用 zonotope/多面体）② 收窄初值区间 ③ 缩短时间步后重判' };
}

// ════════════════════════════════════════════════════════════════════════
// 重新审视（二）：`sound: true` 是**断言**而非结论 —— 用 Galois 连接把它变成可验证性质
// 审视发现：`absFixpoint` 里硬编码 `sound: true`，但**没有任何验证**。
// 【已落地】`absFixpoint` 与 `zonoReach` 现已移除硬编码 `sound:true`，改为返回 `basis`
//   字段引用支撑定理（THM_ABSINT_SOUND / THM_ZONOTOPE_SOUND），且 `sound` 由
//   `MathKernel.get(定理ID)` 派生 —— 标注彻底消失，结论全部来自内核。
//   声称"可靠"却不给出证明，这违反灵脑自己的可审计原则。
// 数学标准：抽象解释的正确性由 **Galois 连接**（Galois connection）保证：
//   存在抽象化 α: C→A 与具体化 γ: A→C，满足  α(c) ⊑ a  ⟺  c ≤ γ(a)
//   这是抽象解释**唯一**的标准正确性判据；有了它，"sound" 才是定理而非口号。
// 区间域的 α/γ：
//   α(S) = [min S, max S]（S 非空）      γ([l,h]) = { x | l ≤ x ≤ h }
//   验证：α(S) ⊑ [l,h] ⟺ [min S,max S] ⊆ [l,h] ⟺ l ≤ min S ∧ max S ≤ h ⟺ S ⊆ γ([l,h]) ✓
// 具体域无限 ⟹ 无法穷尽验证，故做**采样验证**（实证而非断言，符合诚实原则）。
// ════════════════════════════════════════════════════════════════════════
function galoisAlphaSet(S) {                       // α：具体点集 → 区间
  if (!Array.isArray(S) || !S.length) return ITV_BOT;
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < S.length; i++) { if (S[i] < lo) lo = S[i]; if (S[i] > hi) hi = S[i]; }
  return itv(lo, hi);
}
function galoisGammaContains(a, S) {               // S ⊆ γ(a)?
  if (itvIsBot(a)) return false;
  for (let i = 0; i < S.length; i++) if (!(S[i] >= a.lo && S[i] <= a.hi)) return false;
  return true;
}
function galoisCheck(sampleSets, intervals, opts) {
  opts = opts || {};
  if (!Array.isArray(sampleSets) || !Array.isArray(intervals)) return { ok:false, U:'需要样本集数组与区间数组' };
  let checked = 0, violations = [];
  for (let i = 0; i < sampleSets.length && sampleSets[i] && sampleSets[i].length; i++) {
    const S = sampleSets[i];
    const aS = galoisAlphaSet(S);
    for (let j = 0; j < intervals.length; j++) {
      const a = intervals[j];
      if (itvIsBot(a)) continue;
      const lhs = itvLe(aS, a);                    // α(S) ⊑ a
      const rhs = galoisGammaContains(a, S);       // S ⊆ γ(a)
      checked++;
      if (lhs !== rhs) violations.push({ sample:i, interval:j, alphaS:aS, a:a, lhs:lhs, rhs:rhs });
    }
  }
  if (!checked) return { ok:false, U:'无可验证的样本/区间组合' };
  return { ok:true, checked:checked, violations:violations,
    holds: violations.length === 0,
    verdict: violations.length === 0
      ? 'Galois 连接 α(c) ⊑ a ⟺ c ≤ γ(a) 在 ' + checked + ' 组样本上**成立** ⟹ 抽象域可靠（sound 是验证结论，非断言）'
      : '发现 ' + violations.length + ' 处违反 ⟹ 该抽象**不可靠**，必须修正',
    basis:'Galois 连接（Cousot & Cousot 标准正确性判据）；α(S)=[minS,maxS]，γ([l,h])={x|l≤x≤h}',
    note:'采样验证是**实证**而非穷尽证明；理论证明见 α/γ 定义的等价推导（对区间域恒成立）' };
}

// ════════════════════════════════════════════════════════════════════════
// 重新审视（三）：𝕌 是**布尔标记**，但不确定性应该是**区间** —— 升级为不精确概率
// 审视发现：灵脑最独特的卖点是"诚实标 𝕌"，但 𝕌 目前是**一个布尔位**，
//   无法区分"差一点就能判定"和"完全无知" —— 信息被压扁了，决策也因此过度保守。
// 自主设计：引入**不精确概率**（imprecise probability；Walley / Dempster–Shafer）
//   用区间 [belief, plausibility] 表示不确定性：
//     belief        = 确信成立的概率下界（证据支持的）
//     plausibility  = 可能成立的概率上界（未被否证的）
//     恒有 belief ≤ plausibility；宽度 w = plausibility − belief = **不确定性本身**
//   统一了灵脑里原本分裂的三种表示：
//     精确概率   ⟹ belief = plausibility = p（w = 0，完全确定）
//     区间/集合   ⟹ 转成概率包络（w > 0）
//     完全无知   ⟹ [0, 1]（w = 1）
//   **𝕌 的严格语义**：决策阈值 θ 落在区间内，即 belief < θ ≤ plausibility ⟹ 无法判定。
//   这把 𝕌 从"不知道"变成"**差多少才能知道**"（可量化、可指导下一步该补什么证据）。
// ════════════════════════════════════════════════════════════════════════
function beliefPlausibility(belief, plausibility, opts) {
  opts = opts || {};
  const b = +belief, p = +plausibility;
  if (!isFinite(b) || !isFinite(p)) return { ok:false, U:'belief/plausibility 必须为有限数' };
  if (b < 0 || p > 1) return { ok:false, U:'须满足 0 ≤ belief ≤ plausibility ≤ 1' };
  if (b > p + 1e-12) return { ok:false, U:'违反 belief ≤ plausibility（输入不一致，概率包络为空）' };
  return { ok:true, belief:+b.toFixed(9), plausibility:+Math.min(1, p).toFixed(9),
    width:+(Math.min(1, p) - b).toFixed(9),
    precise:(Math.min(1, p) - b) < 1e-12,
    totalIgnorance:b === 0 && Math.min(1, p) === 1,
    basis:'不精确概率包络 [belief, plausibility]（Dempster–Shafer / Walley）；宽度即不确定性本身',
    semantics:'belief=证据确证的下界；plausibility=未被否证的上界；二者之间即"未知地带"' };
}
function decideImprecise(bp, threshold, opts) {
  opts = opts || {};
  if (!bp || !bp.ok) return { ok:false, U:'需要有效的概率包络' };
  const th = (threshold == null) ? 0.5 : +threshold;
  if (!(th >= 0 && th <= 1)) return { ok:false, U:'阈值须 ∈ [0,1]' };
  if (bp.belief >= th - 1e-12)
    return { ok:true, decision:'ACCEPT', U:false, threshold:th, bp:bp,
      reason:'belief ' + bp.belief + ' ≥ 阈值 ' + th + ' ⟹ **最坏情况也达标** ⟹ 确定接受',
      margin:+(bp.belief - th).toFixed(9) };
  if (bp.plausibility < th)
    return { ok:true, decision:'REJECT', U:false, threshold:th, bp:bp,
      reason:'plausibility ' + bp.plausibility + ' < 阈值 ' + th + ' ⟹ **最好情况也不达标** ⟹ 确定拒绝',
      margin:+(th - bp.plausibility).toFixed(9) };
  // 阈值落在包络内 ⟹ 这就是 𝕌 的严格含义
  return { ok:true, decision:'UNKNOWN', U:true, threshold:th, bp:bp,
    reason:'阈值落在 [belief, plausibility] = [' + bp.belief + ', ' + bp.plausibility + '] 之内 ⟹ 真·不可判定',
    gapToDecide:+(th - bp.belief).toFixed(9),
    advice:'需再获得 ' + (th - bp.belief).toFixed(3) + ' 的 belief 增量才能接受；'
         + '或再排除 ' + (bp.plausibility - th).toFixed(3) + ' 的 plausibility 才能拒绝',
    semantics:'𝕌 不是"不知道"，而是"**差这么多证据才能知道**"——可量化、可指导补证据' };
}

// ═══════════════════════════O 物理正确性第二层：守恒律/Noether 不变量 ════════════════════════════
// 量纲分析（Buckingham π）只挡"单位"错误，不挡"物理定律"错误（如错误受力模型仍可能量纲正确）。
// 第一性原理（Noether）：连续对称 ⇔ 守恒量。给定流 ẋ=flow(x) 与守恒量 E(x)（如总能量），
// 沿数值积分检验 dE/dt≈0 ⇒ 该对称未被破坏 ⇒ 物理正确。无能量函数时诚实 UNKNOWN（不编造守恒）。
function conservationCheck(flow, energyFn, x0, dt, steps) {
  if (typeof flow !== 'function' || typeof energyFn !== 'function') return { ok: false, U: '需要 flow 与 energyFn' };
  dt = dt || 0.01; steps = steps || 100;
  let x = (x0 && x0.slice) ? x0.slice() : [x0];
  let prevE = null, maxDrift = 0, driftSum = 0;
  for (let k = 0; k < steps; k++) {
    const dx = flow(x);
    const E = energyFn(x);
    if (prevE != null) { const dE = (E - prevE) / dt; driftSum += Math.abs(dE); maxDrift = Math.max(maxDrift, Math.abs(dE)); }
    prevE = E;
    for (let j = 0; j < x.length; j++) x[j] = x[j] + dt * (dx[j] || 0);
  }
  const avgDrift = driftSum / Math.max(1, steps - 1);
  const tol = 1e-3;
  const verdict = (maxDrift <= tol) ? 'SAFE' : (maxDrift > 1 ? 'UNSAFE' : 'UNKNOWN');
  return { ok: true, verdict: verdict, maxDriftRate: +maxDrift.toFixed(6), avgDriftRate: +avgDrift.toFixed(6), dt: dt, steps: steps,
    basis: 'Noether：连续对称 ⇔ 守恒量；沿流数值积分检验 dE/dt≈0（守恒律不变量，强化"物理正确性"超越量纲）',
    note: '无能量函数时调用方应直接返回 UNKNOWN（不编造守恒）；UNKNOWN 非断言，仅表示未给足前提' };
}

// ── 备用数学思想：应对真实世界不可预测的"工具箱"（诚实降级为 UNKNOWN，不幻觉编造）──
// 设计原则：这些都是"备用"——平时不主动调用，但当大脑遇到未知/对抗/混沌/部分信息时按需取用，
// 且每一件都带诚实边界（算不出就 UNKNOWN + 指向对应数学分支）。复用 THM_* 已登记定理。

// f-散度族（KL / Total-Variation / Jensen–Shannon / Hellinger）——分布变化检测的宽备用（Wasserstein 之外）
function fDivergence(P, Q, kind, opts) {
  kind = kind || 'KL';
  if (!Array.isArray(P) || !Array.isArray(Q) || P.length !== Q.length) return { ok: false, U: 'P/Q 须等长数组' };
  const n = P.length;
  let s = 0;
  for (let i = 0; i < n; i++) {
    const p = P[i], q = Q[i];
    if (kind === 'KL') {
      if (p > 0 && q <= 0) return { ok: true, kind: 'KL', value: Infinity, U: true, note: 'KL 在 q=0 且 p>0 时发散（分布支撑集不同）' };
      if (p > 0 && q > 0) s += p * Math.log(p / q);
    } else if (kind === 'TV') {
      s += Math.abs(p - q);
    } else if (kind === 'JS') {
      const m = (p + q) / 2;
      if (p > 0 && m > 0) s += 0.5 * p * Math.log(p / m);
      if (q > 0 && m > 0) s += 0.5 * q * Math.log(q / m);
    } else if (kind === 'Hellinger') {
      s += (Math.sqrt(p) - Math.sqrt(q)) * (Math.sqrt(p) - Math.sqrt(q));
    } else {
      return { ok: false, U: '未知 f-散度类型：' + kind };
    }
  }
  if (kind === 'TV') s = 0.5 * s;
  if (kind === 'Hellinger') s = Math.sqrt(0.5 * s);
  return { ok: true, kind: kind, value: +s.toFixed(6), U: false,
    note: kind + ' 散度：分布偏差度量；与 wasserstein1/driftCheck 互补构成分布变化检测矩阵（THM_FDIVERGENCE_FAMILY）' };
}

// 粗糙集上下近似（部分信息/unknown-unknown 的结构化备用）
function roughSetApprox(partition, set) {
  if (!Array.isArray(partition) || !Array.isArray(set)) return { ok: false, U: '需 partition(等价类数组) 与 set(成员数组)' };
  const inSet = new Set(set);
  const lower = [], upper = [], boundary = [];
  partition.forEach(function (cls) {
    if (!Array.isArray(cls)) return;
    const allIn = cls.every(function (x) { return inSet.has(x); });
    const someIn = cls.some(function (x) { return inSet.has(x); });
    if (allIn) lower.push(cls);
    if (someIn) { upper.push(cls); if (!allIn) boundary.push(cls); }
  });
  const lowerCount = lower.reduce(function (a, c) { return a + c.length; }, 0);
  const upperCount = upper.reduce(function (a, c) { return a + c.length; }, 0);
  const certainty = upperCount > 0 ? +(lowerCount / upperCount).toFixed(4) : 1;
  return { ok: true, lower: lower, upper: upper, boundary: boundary,
    certainty: certainty, partial: boundary.length > 0,
    note: '粗糙集下/上近似；边界非空 ⇒ 部分可知，诚实保留不可知区间（THM_ROUGHSET_BOUNDARY）' };
}

// 可计算性/不可判定登记（元推理备用：超出自身可判定范围须诚实 UNKNOWN）
const DECIDABILITY = {
  'halting':            { decidable: false, semi: false, note: '图灵停机问题不可判定（Church–Turing）' },
  'fol-entailment':     { decidable: false, semi: true,  note: '一阶逻辑蕴含半可判定（正向可证则停，反例不保证停）' },
  'presburger':         { decidable: true,  note: 'Presburger 算术（无乘法）可判定' },
  'linear-arithmetic':  { decidable: true,  note: '线性实算术可判定' },
  'graph-reachability': { decidable: true,  note: '图可达性可判定（BFS/DFS）' },
  'pomdp-value':        { decidable: true, intractable: true, note: 'POMDP 值可判定但是 PSPACE-complete（指数难）' },
  'context-free':       { decidable: true,  note: '上下文无关文法成员可判定' },
  'first-order-unification': { decidable: true, note: '一阶合一可判定' },
  'wang-tile':          { decidable: false, note: 'Wang 拼贴问题不可判定' },
  'real-closed-geometry':   { decidable: true, note: 'Tarski 实闭域几何定理可判定' },
  'metric-theorem':     { decidable: false, note: '一般一阶几何定理不可判定（仅特定簇可判定）' }
};
function decidabilityCheck(problemType, opts) {
  const r = DECIDABILITY[problemType];
  if (!r) return { ok: false, U: true, unknownType: problemType,
    note: '未登记该问题的可判定性 ⟹ 大脑应诚实返回 UNKNOWN 并指向对应数学分支，而非猜测' };
  return { ok: true, problemType: problemType, decidable: r.decidable, semiDecidable: !!r.semi,
    intractable: !!r.intractable, directive: r.decidable ? (r.intractable ? '可计算但难解 ⇒ 标注 intractable 并尽力而为' : '可计算，尽量精确求解')
      : '不可判定 ⇒ 必须诚实返回 UNKNOWN（不猜、不编造证明）',
    note: r.note + '（THM_DECIDABILITY_AWARE）' };
}

// Lyapunov 最大指数估计（混沌/对初值敏感 ⇒ 长视野预测失效的备用判定）
function lyapunovExponent(flow, x0, dt, steps, eps) {
  if (typeof flow !== 'function' || !Array.isArray(x0)) return { ok: false, U: '需要 flow 与初始状态数组' };
  dt = dt || 0.01; steps = steps || 200; eps = eps || 1e-6;
  let x = x0.slice(), y = x0.slice(); y[0] += eps;
  let d0 = eps, sumLog = 0, valid = 0;
  for (let k = 0; k < steps; k++) {
    const dx = flow(x), dy = flow(y);
    for (let j = 0; j < x.length; j++) { x[j] += dt * (dx[j] || 0); y[j] += dt * (dy[j] || 0); }
    let d = 0; for (let j = 0; j < x.length; j++) d += (x[j] - y[j]) * (x[j] - y[j]); d = Math.sqrt(d);
    if (d > 0 && d0 > 0) { sumLog += Math.log(d / d0); valid++; }
    d0 = d;
  }
  const lambda = valid > 0 ? sumLog / (valid * dt) : 0;
  return { ok: true, lambda: +lambda.toFixed(6), sensitive: lambda > 0,
    verdict: lambda > 0 ? 'CHAOTIC：对初值敏感，长视野预测失效（应降级为 UNKNOWN）'
      : (lambda < 0 ? 'CONTRACTIVE：收敛，预测可信' : 'NEUTRAL：需结合其他判据'),
    note: '最大 Lyapunov 指数 λ；λ>0 ⇒ 混沌/敏感，超出可信视野即诚实放弃长预测（THM_LYAPUNOV_EXP_SENSITIVITY）' };
}

// ── 建模思想备用原语：把真实世界现象抽象成数学结构时的诚实工具 ──
// 设计原则同其他备用数学：平时不主动调，遇到未知/高维/非线性时按需取用，且都带诚实边界（算不出 UNKNOWN）。

// ① 建模假设登记与失效检测：建模必带假设（线性/平稳/独立/闭合…），假设破则模型废。
//    大脑把当前模型依赖的假设显式登记，推理前做越界检测，越界即诚实 UNKNOWN（不幻觉续用破假设模型）。
function modelAssumptions(spec) {
  spec = spec || {};
  var assumes = Array.isArray(spec.assumes) ? spec.assumes : [];
  function check(state) {
    var violations = [];
    for (var i = 0; i < assumes.length; i++) {
      var a = assumes[i];
      if (!a || typeof a.test !== 'function') continue;
      var ok = true;
      try { ok = !!a.test(state); } catch (e) { ok = false; }
      if (!ok) violations.push({ name: a.name, kind: a.kind || 'assumption', note: a.note || '' });
    }
    var intact = violations.length === 0;
    return {
      ok: true, model: spec.id || 'anonymous', intact: intact, violations: violations,
      directive: intact ? 'MODEL_VALID' : 'UNKNOWN',
      reason: intact ? '全部建模假设成立，模型适用'
        : '建模假设被违反：' + violations.map(function (v) { return v.name; }).join(', ') + ' ⟹ 模型不再可信，须降级 UNKNOWN（不幻觉续用破假设模型）',
      basis: '建模思想：任何模型都是带假设的近似；假设越界即失效（THM_MODEL_ASSUMPTION_AUDIT）',
      note: '检测是运行时校验，不进入证明链；假设清单由调用方声明，内核只做诚实越界判定'
    };
  }
  return { ok: true, model: spec.id || 'anonymous', assumptionCount: assumes.length, check: check,
    honesty: 'BELIEF-LEVEL：未登记假设不代表不存在；登记本身是元信息，越界判定依赖调用方给出的检测器' };
}

// ② 局部线性化建模：在 x0 用雅可比给局部线性模型，附"近似有效半径"；超出即 UNKNOWN。
//    雅可比用中心差分数值估计（不强制 f 支持对偶数 AD；对普通 f 鲁棒，标注 numerical 近似）。
function numJacobian(f, x0, h) {
  h = (h == null) ? 1e-6 : +h;
  var f0 = f(x0), n = x0.length, m = (f0 && f0.length) || 0, J = [], k, i;
  if (!m) return null;

function bootSelfTest(){
  const lines=[]; let pass=0, total=0;
  const ck=(name, cond)=>{ total++; if(cond){pass++; lines.push('✓ '+name);} else lines.push('✗ '+name); };
  try{ const r=reason('CHARGE','C',{hard:[],soft:[]}); ck('自动规划最优路径（可审计推理）', r && r.status==='optimal' && Array.isArray(r.path) && r.path[0]==='CHARGE'); }catch(e){ ck('自动规划最优路径', false); lines.push('  '+e.message); }
  try{ const g=goalDirected('CHARGE','C',{}); ck('目标导向决策（已吸收 IMA 目标框架）', g && Array.isArray(g.path) && g.path[g.path.length-1]==='C'); }catch(e){ ck('目标导向决策', false); lines.push('  '+e.message); }
  try{ const d=dmcts('CHARGE','C',[],[]); ck('分支探索（蒙特卡洛树搜索）', d && d.best); }catch(e){ ck('分支探索', false); lines.push('  '+e.message); }
  if(imaKnowledge.loaded){ try{ const q=imaKnowledge.query('未知',3); ck('证据检索：可引用 IMA 数学公理', q && q.length>0); }catch(e){ ck('证据检索', false); } }
  else lines.push('· IMA 检索：未加载（手动加载后可验证）');
  ck('误差监控（切比雪夫界）', typeof SelfLearn!=='undefined' && typeof SelfLearn.slMonitor==='function');
  return {pass,total,lines};
}

  const el=$('kbOut'); if(!el) return;

  let h='<b>世界节点</b> '+(getWorld().nodes||[]).length+' ｜ <b>世界边</b> '+edges.length+' ｜ <b>感知边</b> '+edges.filter(function(e){return e.perceived;}).length+' ｜ <b>情景反思</b> '+((typeof ReflectionBuffer!=='undefined')?ReflectionBuffer.length:0)+' <span class="muted">(大脑不内置经验库；知识来自外部世界模型)</span><br><table><tr><th>从</th><th>到</th><th>代价</th><th>概率p</th><th>感知</th></tr>';
  edges.slice(0,50).forEach(function(e){ h+='<tr><td>'+e.from+'</td><td>'+e.to+'</td><td>'+e.w+'</td><td>'+(e.p==null?'-':e.p)+'</td><td>'+(e.perceived?'是':'否')+'</td></tr>'; });
  h+='</table>';
  el.innerHTML=h;
}
function learnUI(){
  const path=JSON.parse($('fbPath').value||'[]'); const success=$('fbRes').value==='true';
  if(!path.length){ $('learnOut').innerHTML='<span class="bad">路径为空</span>'; return; }
  const r=learn(path, success);
  $('learnOut').innerHTML=`<b>学习：</b>${r.log}<br>更新：${r.updated.map(u=>u.transition+'='+u.confidence+'('+u.kind+')').join('， ')}`;
  renderKB();
}
function learn(){ learnUI(); }
function loadWorld(){
  try{ const j=JSON.parse($('worldJson').value); setWorld(j); $('worldOut').innerHTML='已导入 '+j.nodes.length+' 节点 / '+j.edges.length+' 边'; }
  catch(e){ $('worldOut').innerHTML='<span class="bad">导入失败：'+e.message+'</span>'; }
}
// ⑧ IMA 数学库 UI：加载知识壳 + 检索
async function autoLoadIMA(){
  try{
    const r = await fetch('ima_knowledge.json');
    if(!r.ok){ $('imaLoadOut').innerHTML='<span class="warn">同目录未找到 ima_knowledge.json（用文件选择或粘贴）</span>'; return; }
    const j = await r.json(); const res = loadIMAKB(j);
    $('imaLoadOut').innerHTML='<span class="ok">已加载 '+res.total+' 条 / '+res.modules+' 模块 / '+res.types+' 类型</span>';
  }catch(e){ $('imaLoadOut').innerHTML='<span class="bad">自动加载失败：'+e.message+'</span>'; }
}
function loadIMAUI(){
  const f = $('imaFile').files[0];
  if(f){
    const rd = new FileReader();
    rd.onload = () => { try{ const j=JSON.parse(rd.result); const res=loadIMAKB(j); $('imaLoadOut').innerHTML='<span class="ok">已加载 '+res.total+' 条 / '+res.modules+' 模块</span>'; }catch(e){ $('imaLoadOut').innerHTML='<span class="bad">解析失败：'+e.message+'</span>'; } };
    rd.readAsText(f); return;
  }
  const txt = $('imaPaste').value.trim();
  if(!txt){ $('imaLoadOut').innerHTML='<span class="warn">请选择文件或粘贴 JSON</span>'; return; }
  try{ const j=JSON.parse(txt); const res=loadIMAKB(j); $('imaLoadOut').innerHTML='<span class="ok">已加载 '+res.total+' 条 / '+res.modules+' 模块</span>'; }
  catch(e){ $('imaLoadOut').innerHTML='<span class="bad">解析失败：'+e.message+'</span>'; }
}
function imaSearchUI(){
  if(!imaKnowledge.loaded){ $('imaSearchOut').innerHTML='<span class="warn">请先加载 IMA 知识壳</span>'; return; }
  const hits = imaKnowledge.query($('imaKw').value.trim(), 12);
  if(!hits.length){ $('imaSearchOut').innerHTML='<span class="muted">无命中</span>'; return; }
  let h='<table><tr><th>编号</th><th>类型</th><th>模块</th><th>标题</th></tr>';
  hits.forEach(e=>h+='<tr><td>'+e.no+'</td><td>'+e.type+'</td><td>'+e.module+'</td><td>'+e.title+'</td></tr>');
  h+='</table>';
  $('imaSearchOut').innerHTML=h;
}
// 加载完成（调试台已移除；IMA 数学库由「接入灵脑大脑」按需加载，确定性推理不依赖 LLM）
