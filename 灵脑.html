}
function copyAgentCfg(){ try{ navigator.clipboard.writeText(JSON.stringify({mcpServers:{lingnao:{command:'node',args:['lingnao-mcp.js']}}})); }catch(e){} }
// 用大白话让大脑理解并规划：感知(免费LLM)→确定性推理→解释(免费LLM, grounding IMA)
async function askBrainUI(){
  const keyEl=$('orKey');
  const key=(keyEl&&keyEl.value.trim())||(function(){ try{ return localStorage.getItem('lingnao_or_key'); }catch(e){ return null; } })()||undefined;
  if(keyEl && keyEl.value.trim()){ try{ localStorage.setItem('lingnao_or_key', keyEl.value.trim()); }catch(e){} }
  const text=$('orAsk').value.trim();
  if(!text){ $('orOut').textContent='请输入你的目标描述'; return; }
  $('orOut').textContent='调用免费 LLM 理解中…'; $('orQuota').textContent='';
  const r=await askBrain(text, key||undefined);
  if(!r.ok){ $('orOut').textContent='失败（'+r.stage+'）：'+(r.error||''); return; }
  let s='【大脑理解】'+JSON.stringify(r.percept)+'\n\n【确定性规划】状态：'+(r.reason.status==='optimal'?'已规划最优路径':'不可判定')+'\n';
  if(r.reason.status==='optimal'){ s+='路径：'+r.reason.path.join(' → ')+' ｜ 代价：'+r.reason.cost+'\n'; }
  else { s+='U：'+(r.reason.U||[]).join('； ')+'\n'; }
  s+='\n【大白话解释】\n'+(r.explanation.ok? r.explanation.text : '（解释层不可用：'+(r.explanation.error||'')+'）');
  $('orOut').textContent=s;
  $('orQuota').textContent = r.explanation.cached ? '（解释命中缓存，未烧额度）' : '';
}
async function perceiveLLMUI(){
  const key = $('orKey').value.trim();
  const text = $('nlText').value.trim();
  if(!text){ $('perceiveOut').innerHTML='<span class="bad">请输入描述</span>'; return; }
  $('perceiveOut').innerHTML='调用外部 LLM 中…';
  const r = await perceiveLLM(text, {apiKey: key||undefined});
  if(!r.ok){ $('perceiveOut').innerHTML='<span class="bad">感知失败：'+(r.error||'')+'</span>'; return; }
  window.__percept = r.percept;
  const pc = r.perceive || {};
  const summary = (pc.added&&pc.added.nodes.length? '新增节点：'+pc.added.nodes.join(',')+'<br>' : '')
    + (pc.added&&pc.added.edges.length? '新增边：'+pc.added.edges.join(',')+'<br>' : '')
    + (pc.selfCorrections&&pc.selfCorrections.length? '自我修正：'+pc.selfCorrections.length+' 次（推测已贴合事实）<br>' : '')
    + (pc.conflicts&&pc.conflicts.length? '冲突：'+pc.conflicts.length+' 处（保留原值待仲裁）<br>' : '');
  $('perceiveOut').innerHTML = '<b>外部 LLM 理解（'+r.mode+' · '+r.percept._model+'）</b><pre>'
    + JSON.stringify(r.percept,null,2)+'</pre>'+summary+'<button onclick="applyPercept()">填充并推理</button>';
}
function applyPercept(){
  const p=window.__percept; if(!p) return;
  const intent = p.intent || {};
  if(intent.goal) $('rgoal').value = intent.goal;
  if(p.observations && p.observations[0]){ $('start').value = p.observations[0].from || $('start').value; }
  runReason();
}
function carrierReportUI(){
  const r=carrierReport($('battery').value, $('goal').value, JSON.parse($('density').value||'{}'));
  $('carrierOut').innerHTML = `<div class="zone"><b>电量</b> ${r.battery}%<div class="bar"><i style="width:${r.battery}%;background:${r.battery<20?'var(--red)':'var(--green)'}"></i></div></div>`
    + `<div class="zone"><b>目标</b> ${r.goal}</div>`
    + `<div class="zone"><b>硬约束</b> ${r.hard.length? r.hard.join(',') : '无'}</div>`;
  window.__carrier = r;
}
function carrierReport(){ carrierReportUI(); }
function runReason(){
  const hard=($('hard').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const soft=($('soft').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  const start=$('start').value.trim(), goal=$('rgoal').value.trim();
  const r=reason(start, goal, {hard, soft, system1Only:$('sys1Only').checked});
  let html=`<div class="pill ${r.status==='optimal'?'ok':'warn'}">${r.status==='optimal'?'最优':'不可判定 U'}</div> `;
  html+=`<span class="pill ${r.system==='1'?'ok':'warn'}">使用 ${r.system==='1'?'系统1(快答)':'系统2(深度+RSG)'}</span><br>`;
  if(r.status==='optimal'){
    html+=`<b>路径</b> ${r.path.join(' → ')} ｜ <b>代价</b> ${r.cost} ｜ <b>扩展节点</b> ${r.expanded||'-'}<br><table><tr><th>步</th><th>状态</th><th>行动</th><th>结果</th><th>依据</th><th>置信度</th><th>p</th></tr>`;
    r.steps.forEach(s=>html+=`<tr><td>${s.seq}</td><td>${s.state}</td><td>${s.action}</td><td>${s.result}</td><td>${s.reason}</td><td>${s.confidence}</td><td>${s.p}</td></tr>`);
    html+='</table>';
  } else { html+=`<b>U=</b> ${r.U.join('; ')}`; }
  $('reasonOut').innerHTML=html;
  window.__path = r;
  if(r.rsg){
    const g=r.rsg;
    let rsg='<b>RSG 推理状态图</b> 节点 '+g.nodes.length+' ｜ 分支 '+g.branchCount+' ｜ 剪枝(回溯) '+g.pruneCount+'<br>';
    rsg+='扩展序: '+g.expanded.join(' → ')+'<br>';
    rsg+='<span class="opt">最优: '+(g.optimalPath.length?g.optimalPath.join('→'):'(无)')+'</span><br>';
    rsg+='<span class="prn">分支(含剪枝): '+g.edges.map(e=>e.from+'→'+e.to+(e.pruned?'✗':'')).join('  ')+'</span>';
    $('rsgOut').innerHTML='<div class="rsg">'+rsg+'</div>';
  } else { $('rsgOut').innerHTML='<div class="muted">系统1 快答：无 RSG（直接复用经验，未展开搜索）</div>'; }
  const aud=generateAudit(r, {hard, soft});
  renderAudit(aud);
}
function testUnknown(){
  $('start').value='CHARGE'; $('rgoal').value='Z'; $('hard').value=''; $('soft').value='';
  $('sys1Only').checked=false; runReason();
}
function renderAudit(aud){
  let h=`<div class="pill ${aud.status==='valid'?'ok':'warn'}">审计 ${aud.status}</div> `;
  h+=`<b>概要：</b>${aud.summary.key} ｜ 代价 ${aud.summary.totalCost} ｜ 状态 ${aud.summary.status} ｜ 系统 ${aud.summary.usedSystem}<br>`;
  h+=`<details open><summary>详细（${aud.details.length} 步）</summary><table><tr><th>步</th><th>状态</th><th>行动</th><th>结果</th><th>依据</th><th>置信度</th></tr>`;
  aud.details.forEach(d=>h+=`<tr><td>${d.step}</td><td>${d.state}</td><td>${d.action}</td><td>${d.result}</td><td>${d.reason}</td><td>${d.confidence}</td></tr>`);
  h+='</table></details>';
  h+=`<details><summary>证据（${aud.evidence.length}）</summary><ul>`+aud.evidence.map(e=>`<li>${e.id}: ${e.t}</li>`).join('')+'</ul></details>';
  h+=`<details><summary>约束检查</summary><ul>`+aud.constraints.map(c=>`<li>${c.type}: ${JSON.stringify(c.nodes)} passed=${c.passed}</li>`).join('')+'</ul></details>';
  h+=`<details><summary>附录：不可判定 U</summary>`+(aud.unknown.length? aud.unknown.join('; ') : '无')+'</details>';
  h+=`<details><summary>不确定性量化</summary>`+(aud.uncertainty? '偶然='+aud.uncertainty.aleatoric+' ｜ 认知='+aud.uncertainty.cognitive+' ｜ 合计='+aud.uncertainty.total+'<br>'+aud.uncertainty.note : '无')+'</details>';
  h+=`<details><summary>形式化证明证书（霍尔逻辑）</summary><pre>`+JSON.stringify(aud.proof,null,2)+'</pre></details>';
  h+=`<details><summary>可复现信息</summary><pre>`+JSON.stringify(aud.reproducible,null,2)+'</pre></details>';
  $('auditOut').innerHTML=h;
}
function renderKB(){
  const el=$('kbOut'); if(!el) return;
  const edges=WORLD.edges||[];
  let h='<b>世界节点</b> '+(WORLD.nodes||[]).length+' ｜ <b>世界边</b> '+edges.length+' ｜ <b>感知边</b> '+edges.filter(function(e){return e.perceived;}).length+' ｜ <b>情景反思</b> '+((typeof ReflectionBuffer!=='undefined')?ReflectionBuffer.length:0)+' <span class="muted">(大脑不内置经验库；知识来自外部世界模型)</span><br><table><tr><th>从</th><th>到</th><th>代价</th><th>概率p</th><th>感知</th></tr>';
  edges.slice(0,50).forEach(function(e){ h+='<tr><td>'+e.from+'</td><td>'+e.to+'</td><td>'+e.w+'</td><td>'+(e.p==null?'-':e.p)+'</td><td>'+(e.perceived?'是':'否')+'</td></tr>'; });
  h+='</table>';
  el.innerHTML=h;
}
function learnUI(){
  const path=JSON.parse($('fbPath').value||'[]'); const success=$('fbRes').value==='true';
  if(!path.length){ $('learnOut').innerHTML='<span class="bad">路径为空</span>'; return; }
  const r=learn(path, success);
  $('learnOut').innerHTML=`<b>学习：</b>${r.log}<br>更新：${r.updated.map(u=>u.transition+'='+u.confidence+'('+u.kind+')').join('， ')}`;
  renderKB();
}
function learn(){ learnUI(); }
function loadWorld(){
  try{ const j=JSON.parse($('worldJson').value); setWorld(j); $('worldOut').innerHTML='已导入 '+j.nodes.length+' 节点 / '+j.edges.length+' 边'; }
  catch(e){ $('worldOut').innerHTML='<span class="bad">导入失败：'+e.message+'</span>'; }
}
// ⑧ IMA 数学库 UI：加载知识壳 + 检索
async function autoLoadIMA(){
  try{
    const r = await fetch('ima_knowledge.json');
    if(!r.ok){ $('imaLoadOut').innerHTML='<span class="warn">同目录未找到 ima_knowledge.json（用文件选择或粘贴）</span>'; return; }
    const j = await r.json(); const res = loadIMAKB(j);
    $('imaLoadOut').innerHTML='<span class="ok">已加载 '+res.total+' 条 / '+res.modules+' 模块 / '+res.types+' 类型</span>';
  }catch(e){ $('imaLoadOut').innerHTML='<span class="bad">自动加载失败：'+e.message+'</span>'; }
}
function loadIMAUI(){
  const f = $('imaFile').files[0];
  if(f){
    const rd = new FileReader();
    rd.onload = () => { try{ const j=JSON.parse(rd.result); const res=loadIMAKB(j); $('imaLoadOut').innerHTML='<span class="ok">已加载 '+res.total+' 条 / '+res.modules+' 模块</span>'; }catch(e){ $('imaLoadOut').innerHTML='<span class="bad">解析失败：'+e.message+'</span>'; } };
    rd.readAsText(f); return;
  }
  const txt = $('imaPaste').value.trim();
  if(!txt){ $('imaLoadOut').innerHTML='<span class="warn">请选择文件或粘贴 JSON</span>'; return; }
  try{ const j=JSON.parse(txt); const res=loadIMAKB(j); $('imaLoadOut').innerHTML='<span class="ok">已加载 '+res.total+' 条 / '+res.modules+' 模块</span>'; }
  catch(e){ $('imaLoadOut').innerHTML='<span class="bad">解析失败：'+e.message+'</span>'; }
}
function imaSearchUI(){
  if(!imaKnowledge.loaded){ $('imaSearchOut').innerHTML='<span class="warn">请先加载 IMA 知识壳</span>'; return; }
  const hits = imaKnowledge.query($('imaKw').value.trim(), 12);
  if(!hits.length){ $('imaSearchOut').innerHTML='<span class="muted">无命中</span>'; return; }
  let h='<table><tr><th>编号</th><th>类型</th><th>模块</th><th>标题</th></tr>';
  hits.forEach(e=>h+='<tr><td>'+e.no+'</td><td>'+e.type+'</td><td>'+e.module+'</td><td>'+e.title+'</td></tr>');
  h+='</table>';
  $('imaSearchOut').innerHTML=h;
}
