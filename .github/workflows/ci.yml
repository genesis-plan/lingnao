name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 安装依赖（灵数求解器真引擎）
        run: npm install --no-audit --no-fund
      - name: 内核自测（含不幻觉 grounding 分层项）
        run: npm test
