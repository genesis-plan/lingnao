name: Bug 报告
description: 报告一个缺陷或异常行为
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 实际发生了什么异常？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 最小可复现步骤（命令 / 输入 / 预期触发条件）
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你认为正确的结果应是什么？
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: node 版本、OS、仓库 commit（git rev-parse HEAD）
    validations:
      required: false
  - type: textarea
    id: self
    attributes:
      label: 自测输出
      description: 运行 `node lingnao-mcp.js --selftest` 的完整输出（便于定位是否已有回归）
    validations:
      required: false
