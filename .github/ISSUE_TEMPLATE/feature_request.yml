name: 功能建议
description: 建议一个新能力或改进
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题 / 场景
      description: 当前缺什么？真实使用场景是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你设想的解决方式（可附草图 / 伪代码）
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - "感知 / 免费 LLM"
        - "推理 / A* / RSG"
        - "因果 / do 演算"
        - "审计 / 不幻觉分层"
        - "知识库"
        - "学习闭环 / 元认知"
        - "MCP / 工程落地"
        - "文档 / 示例"
        - "其他"
    validations:
      required: false
  - type: textarea
    id: honesty
    attributes:
      label: 诚实边界自检
      description: 若涉及新算法，是否可确定性实装？是否需标注 lite / 路线？（本项目硬性要求不虚构）
    validations:
      required: false
