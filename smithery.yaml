# Smithery 清单（MCP 服务器）
# 提交方式：在 smithery.ai 选 "Add Server" → 粘贴本仓库 GitHub URL，
# 或待 Smithery Key 就绪后由维护者后台导入。
name: lingnao
displayName: 灵脑 LingNao（任意智能体的确定性·不幻觉推理服务）
description: >-
  面向任意智能体的本地确定性、不幻觉推理服务（非概率生成式 LLM、无神经网络在环）。对外以 MCP stdio 暴露唯一 lingnao 网关工具
  （op 参数收编 51 项推理能力）：深思规划(A*/确定性 MCTS/RSG) / 因果推理(do-演算、Pearl 因果阶梯) / 不确定性理论(PAC 样本界)
  / 数学健全性压力测试(Baire 纲·紧致性·代数簇·范德瓦尔登·柯西-利普希茨·Bertrand，均有真实定理保证) / 世界模型与反事实 / 元认知与自演化 / 具身决策(规划-执行-安全停车-重规划闭环)。
  零依赖、零安装、不幻觉、可复现。方法学与数学定理见 docs/00-推理引擎原理与方法学.md。
startCommand:
  type: stdio
  command: npx
  args:
    - github:genesis-plan/lingnao
  env:
    - key: OPENROUTER_API_KEY
      description: OpenRouter 免费 LLM Key（可选；留空则大脑以结构化输入降级运行，100% 确定性可用）
      required: false
