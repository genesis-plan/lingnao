<script>
// ==KERNEL START==  （灵境 LingJing 确定性内核；可被 Node 抽取校验，亦被 MCP server 复用）
// 核心数据模型（文档 3.1）：
//   State{id,data,fingerprint,ts}  Transition{from,action,to,cost}
//   Experience{id,transition,success,confidence,source,kind,createdAt}
//   ReasonStep{seq,state,action,result,reason,confidence,evidenceIds,p}
//   ReasonPath{id,start,goal,steps,totalCost,status,searchLog,rsg,system}
//   AuditReport{pathId,reportId,summary,details[],evidence[],constraints[],unknown[],uncertainty,proof,reproducible,status,generatedAt,version}

const ALGO_VERSION = '3.0';   // 算法版本（审计可复现信息）
const SEED = null;            // 推理确定性、无随机种子（审计可复现信息）

// IMA 数学库素材（仅作知识库依据引用，非核心）——文档融合框架 Layer3 素材来源
const IMA = [
  {id:'IMA-35', t:'皮亚诺公理：自然数良序，归纳法基础'},
  {id:'IMA-33', t:'整数构造：等价类定义加法逆元'},
  {id:'IMA-44', t:'实数完备性：戴德金分割'},
  {id:'IMA-50', t:'微积分基本定理：积分与微分的互逆'},
  {id:'IMA-45', t:'度量空间：距离函数三公理'}
];

// IMA 数学库接入（文档融合框架 Layer3 素材来源；用户授权 IMA 连接器后吸收「有用的思想」）
// 知识壳 ima_knowledge.json：431 条公理/定理/定义/方法/思想方法，含模块倒排索引。
// 接入后：IMA 可检索、元认知层可路由、审计报告可引用证据；完整形式化陈述存 IMA（按需拉取，壳不臆造）。
const imaKnowledge = {
  entries: [], _byId: {}, moduleIndex: {}, typeIndex: {}, loaded: false, source: null, total: 0,
  load(arr, opts){
    opts = opts || {};
    let list = Array.isArray(arr) ? arr : (arr && Array.isArray(arr.entries) ? arr.entries : null);
    if (!list) throw new Error('IMA 知识壳需为数组或 {entries:[...]}');
    this.entries = list.map(e => ({ id:e.id, no:e.no, type:e.type, module:e.module, title:e.title, status:e.status }));
    this._byId = {}; this.moduleIndex = {}; this.typeIndex = {};
    for (const e of this.entries){
      this._byId[e.id] = e;
      (this.moduleIndex[e.module] = this.moduleIndex[e.module] || []).push(e.id);
      (this.typeIndex[e.type] = this.typeIndex[e.type] || []).push(e.id);
    }
    this.loaded = true; this.total = this.entries.length;
    this.source = (opts && opts.source) || (arr && arr.source) || 'ima_knowledge.json';
    // 同步并入 IMA 证据数组，使审计可引用 ima_<编号>（不与旧 IMA-xx 冲突）
    for (const e of this.entries){ if (!IMA.find(x => x.id === e.id)) IMA.push({ id: e.id, t: e.title }); }
    return { loaded:true, total:this.total, modules:Object.keys(this.moduleIndex).length, types:Object.keys(this.typeIndex).length };
  },
  get(id){ return this._byId[id] || null; },
  // 关键词检索：标题/模块/类型/编号 命中即返回（确定性、不依赖 LSH）
  query(keyword, k){
    if (!this.loaded) return [];
    k = k || 10; const kw = String(keyword || '').toLowerCase();
    if (!kw) return this.entries.slice(0, k);
    const hits = this.entries.filter(e =>
      e.title.toLowerCase().includes(kw) || e.module.toLowerCase().includes(kw) ||
      e.type.toLowerCase().includes(kw) || String(e.no) === kw || e.id.toLowerCase().includes(kw)
    );
    return hits.slice(0, k).map(e => ({ id:e.id, no:e.no, type:e.type, module:e.module, title:e.title, status:e.status }));
  },
  stats(){ return { loaded:this.loaded, total:this.total, modules:Object.keys(this.moduleIndex).length, types:Object.keys(this.typeIndex).length }; }
};
function loadIMAKB(arr, opts){ return imaKnowledge.load(arr, opts); }

// 默认世界图（智能灭蚊器场景）——文档 MVP 演示场景；边带 p=转移概率（默认1，确定性）
let WORLD = {
  nodes:['CHARGE','A','B','C'],
  edges:[
    {from:'CHARGE',to:'A',w:Math.hypot(3,0),p:1}, {from:'A',to:'CHARGE',w:Math.hypot(3,0),p:1},
    {from:'A',to:'B',w:Math.hypot(3,3),p:1}, {from:'B',to:'A',w:Math.hypot(3,3),p:1},
    {from:'B',to:'C',w:Math.hypot(3,0),p:1}, {from:'C',to:'B',w:Math.hypot(3,0),p:1},
    {from:'CHARGE',to:'B',w:Math.hypot(3,3),p:1}, {from:'B',to:'CHARGE',w:Math.hypot(3,3),p:1},
    {from:'A',to:'C',w:Math.hypot(3,3),p:1}, {from:'C',to:'A',w:Math.hypot(3,3),p:1}
  ],
  coord:{CHARGE:[0,0], A:[3,0], B:[3,3], C:[6,0]},
  // 来源存证（神经②）：只记录"大脑自己感知进来"的节点/边，其中未经验证的部分绝不混入证明链
  _prov:{node:{}, edge:{}}
};

// ⑦ 世界图外部可定义（文档：状态建模可配置）——灭蚊器仅为默认场景，非硬编码绑定
// 安全：世界图校验（防越界 / 畸形输入进入确定性内核；资源上限防耗尽）
function validateWorld(json){
  if(!json || typeof json!=='object') throw new Error('世界图必须是对象');
  if(!Array.isArray(json.nodes) || json.nodes.length===0) throw new Error('世界图需含非空 nodes 数组');
  if(!Array.isArray(json.edges)) throw new Error('世界图需含 edges 数组');
  if(json.nodes.length>5000) throw new Error('节点数超过 5000 上限（防资源耗尽）');
  if(json.edges.length>50000) throw new Error('边数超过 50000 上限（防资源耗尽）');
  json.nodes.forEach(n=>{ if(typeof n!=='string' && typeof n!=='number') throw new Error('节点名须为字符串或数字'); });
  json.edges.forEach(e=>{
    if(!e || e.from==null || e.to==null) throw new Error('边须含 from/to');
    if(typeof e.w!=='number'){ e.w = (e.w==null?1:Number(e.w)); }
    if(isNaN(e.w)) e.w=1;
    if(typeof e.p==='number') e.p = Math.max(0, Math.min(1, e.p)); // 概率夹紧到 [0,1]
  });
  return true;
}
// 置信分层（"不幻觉"核心保证）：在神经符号架构中显式区分三档可信度
const GROUNDING = {
  PERCEPTION: { tier:'UNVERIFIED_LLM', mayHallucinate:true,  desc:'免费 LLM 自然语言理解，可能出错（幻觉），绝不进入证明链或决策依据' },
  KERNEL:     { tier:'DETERMINISTIC',  mayHallucinate:false, desc:'内核 A* / 知识库确定性计算，可复现、不幻觉' },
  PROOF:      { tier:'AUDITED',        mayHallucinate:false, desc:'七段审计 + 霍尔证明证书，可机器验证' }
};
// 返回神经符号边界说明：LLM 只做感知/解释（可能错），推理与审计全在内核（确定性、不幻觉）
function groundingMeta(){ return {
  model:'灵境 LingJing 神经符号边界',
  principle:'LLM 仅做感知/解释前端（允许出错）；推理、证明、审计全部在本地确定性内核，不经大模型，因此可审计、可复现、不幻觉',
  tiers: GROUNDING,
  rule:'任何对外结论都须能回溯到 KERNEL/PROOF 档；PERCEPTION 档输出必须显式标注"可能幻觉"且不可作为依据'
}; }

// ══════════════════════════════════════════════════════════════════════
function setWorld(json){
  validateWorld(json);
  // 仅当用户显式提供 coord 时才启用欧氏启发式；否则启发式恒为 0（退化为 Dijkstra），
  // 保证 A* 在任意世界图上都返回真正最优路径（此前对缺坐标节点随机撒点，导致启发式不可采纳、A* 次优且结果随随机种子漂移）。
  const explicit = !!(json.coord && typeof json.coord === 'object' && Object.keys(json.coord).length);
  const coord = json.coord || {};
  if(explicit) json.nodes.forEach(n=>{ if(!coord[n]) coord[n]=[0,0]; });
  WORLD.nodes = json.nodes; WORLD.edges = json.edges; WORLD.coord = coord; WORLD._coordExplicit = explicit;
}

// 可采纳启发式：欧氏距离（≤真实代价，保证 A* 最优）——文档附录B建议
function heuristic(a,b){
  if(!WORLD._coordExplicit) return 0; // 未显式给坐标 → 无启发式，退化为 Dijkstra（保证最优）
  const ca=WORLD.coord[a], cb=WORLD.coord[b];
  if(!ca||!cb) return 0;
  return Math.hypot(ca[0]-cb[0], ca[1]-cb[1]);
}
function edgeP(e){ return (e && typeof e.p==='number') ? e.p : 1; }

// ★ 世界图第四分量 ℙ = 命题（proposition），不是概率 —— 依 ARCHITECTURE.md 七元组定义 𝕎=(𝕍,𝔼,𝕨,ℙ,ℂ,𝕌)
// 边携带"这条转移成立的条件"：{var, op, val} 或字符串。用已知事实集 facts 判定：
//   true = 命题成立，可通行；false = 命题不成立，剪枝；null = 已知事实不足，命题不可判定 → 归入 𝕌，绝不猜。
function evaluateProposition(P, facts){
  if(P == null) return true;                       // 无命题 = 无条件可通行
  if(typeof P === 'string'){
    if(!facts || !(P in facts)) return null;       // 事实缺失 = 不可判定（不猜）
    const v = facts[P];
    return (v === true || v === 1) ? true : (v === false || v === 0 ? false : null);
  }
  if(typeof P === 'object'){
    const f = (facts || {})[P.var];
    if(f === undefined || f === null) return null; // 事实缺失 = 不可判定
    switch(P.op){
      case '>':  return f >  P.val;
      case '>=': return f >= P.val;
      case '<':  return f <  P.val;
      case '<=': return f <= P.val;
      case '==': case '=': return f === P.val;
      case '!=': return f !== P.val;
      default:   return null;                      // 未知算子 = 不可判定
    }
  }
  return null;
}
// 边在当前事实下是否成立：返回 true/false/null（null=不可判定，须进 𝕌）
function edgeHolds(e, facts){
  const P = (e && (e.P !== undefined ? e.P : e.proposition)) !== undefined
    ? (e.P !== undefined ? e.P : e.proposition) : null;
  return evaluateProposition(P, facts);
}
let _SOFT = new Set(), _SOFT_PENALTY = 2;
function edgeW(e){ return e.w + (_SOFT.has(e.to)? _SOFT_PENALTY : 0); }
function edgeCost(a,b){ const e=WORLD.edges.find(e=>e.from===a&&e.to===b); return e? edgeW(e):0; }

// ② 推理引擎：A* 最优搜索 + 硬约束剪枝 + 软约束代价加成（文档 3.2）
// 同时构建 RSG（推理状态图）：记录扩展节点、候选分支、剪枝/回溯，兑现"从生成到搜索"

// 消费定理：一致(单调)启发式 ⟹ A* 最优 by construction。
// 一致性 = 三角不等式（度量公理）作用于启发式势函数：h(n) ≤ c(n,n') + h(n') ∀边 且 h(goal)=0。
// 一致则 A* 每节点只扩展一次并得最优路径（定理内容）；不一致则定理不保证 → 诚实标 'optimal-unverified'。
function verifyHeuristicConsistency(goal){
  const eps = 1e-9; const viol = [];
  if(heuristic(goal, goal) !== 0) viol.push('h(goal)≠0');
  for(const e of WORLD.edges){
    const lhs = heuristic(e.from, goal);
    const rhs = edgeW(e) + heuristic(e.to, goal);
    if(lhs > rhs + eps) viol.push(e.from + '→' + e.to + '（' + lhs.toFixed(3) + '>' + rhs.toFixed(3) + '）');
  }
  return { consistent: viol.length === 0, violations: viol,
    basis: '一致启发式 = 三角不等式 h(n)≤c(n,n\')+h(n\')；一致 ⟹ A* 最优由定理保证，非断言' };
}

function aStar(start, goal, opts={}){
  const hard = new Set(opts.hard||[]);
  _SOFT = new Set(opts.soft||[]);
  const log=[]; const rsgNodes=new Set([start]); const rsgEdges=[];
  if(!WORLD.nodes.includes(start)) return unknownReturn('起点不在世界图', log, rsgNodes, rsgEdges);
  if(!WORLD.nodes.includes(goal))  return unknownReturn('目标不在世界图', log, rsgNodes, rsgEdges);
  if(hard.has(goal)) return unknownReturn('目标位于硬约束禁集', log, rsgNodes, rsgEdges);
  const open=[{node:start, g:0, f:heuristic(start,goal), parent:null}];
  const closed=new Map();
  const undecided=[];   // ℙ 命题不可判定的边（已知事实不足）—— 诚实归入 𝕌，不猜
  let expanded=0;
  while(open.length){
    open.sort((x,y)=>x.f-y.f);
    const cur=open.shift(); expanded++;
    log.push({expand:cur.node, g:+cur.g.toFixed(3), f:+cur.f.toFixed(3)});
    rsgNodes.add(cur.node);
    if(cur.node===goal){
      const path=[]; let p=cur; while(p){path.unshift(p.node); p=p.parent;}
      const steps=path.slice(1).map((node,i)=>{
        const e=WORLD.edges.find(e=>e.from===path[i]&&e.to===node);
        return {seq:i+1, state:path[i], action:'move→'+node, result:node,
          reason:'A* 选最小 f 后继；代价 '+edgeW(e).toFixed(3)+'｜命题 ℙ='+(edgeHolds(e, opts.facts)===true?'成立':'—'),
          confidence:1, evidenceIds:[], proposition:(e && (e.P !== undefined ? e.P : e.proposition)) || null};
      });
      const cons = verifyHeuristicConsistency(goal);   // 消费一致性定理：最优性由验证结果派生
      return {status: cons.consistent ? 'optimal' : 'optimal-unverified', optimalGuaranteed: cons.consistent,
        heuristicConsistency: cons, path, cost:+cur.g.toFixed(6), steps, expanded, searchLog:log,
        rsg:buildRSG(path, log, rsgNodes, rsgEdges, start, goal), grounding:GROUNDING.KERNEL};
    }
    if(closed.has(cur.node) && closed.get(cur.node)<=cur.g) continue;
    closed.set(cur.node, cur.g);
    if(hard.has(cur.node) && cur.node!==start) continue;
    for(const e of WORLD.edges.filter(e=>e.from===cur.node)){
      if(hard.has(e.to)) continue;
      // ℙ 命题闸门：命题为假 → 剪枝；命题不可判定（事实不足）→ 不进解，记入 𝕌
      const holds = edgeHolds(e, opts.facts || {});
      if(holds === false) continue;
      if(holds === null){ undecided.push(e.from + '→' + e.to); continue; }
      rsgNodes.add(e.to);
      const ng=cur.g+edgeW(e);
      const pruned = closed.has(e.to) && closed.get(e.to)<=ng;
      rsgEdges.push({from:cur.node, to:e.to, g:+ng.toFixed(3), pruned});
      if(pruned) continue;
      open.push({node:e.to, g:ng, f:ng+heuristic(e.to,goal), parent:cur});
    }
  }
  return unknownReturn('世界图中无满足约束的可达路径', log, rsgNodes, rsgEdges, undecided);
}
function unknownReturn(msg, log, rsgNodes, rsgEdges, extraU){
  const U = [msg];
  if(extraU && extraU.length)
    U.push('命题不可判定（已知事实不足，未猜测）：' + extraU.join('，'));
  return {status:'unknown', U, path:[], cost:0, steps:[], searchLog:log, rsg:buildRSG([], log, rsgNodes, rsgEdges, null, null)};
}
// RSG 构建：把搜索过程转成可审计的推理状态图（节点=思维态，边=推理动作；含分支与剪枝/回溯）
function buildRSG(path, log, rsgNodes, rsgEdges, start, goal){
  return {
    kind:'ReasoningStateGraph',
    nodes:[...rsgNodes],
    edges:rsgEdges,
    expanded:log.map(x=>x.expand),
    optimalPath:path,
    branchCount:rsgEdges.length,
    pruneCount:rsgEdges.filter(e=>e.pruned).length,
    note:'最优路径(绿色) + 剪枝分支(灰) 构成完整可审计推理轨迹（文档 3.2 RSG：分支探索/合并/回溯）'
  };
}

// ③ 系统1（快思考）：复用世界图高置信直接边，否则升级系统2（文档 3.1）
// 约束单一真源：系统1 必须同样尊重 opts.hard——目标在禁集内一律拒绝快答（修复快路径绕过硬约束旁路）
// 系统1 快答：复用世界图预置的高置信直接边（知识来自外部世界定义，大脑不持身体经验库）
function system1(start, goal, opts={}){
  const hard = new Set(opts.hard||[]);
  if(hard.has(goal)) return {system:'1', decided:false, reason:'目标位于硬约束禁集，系统1 拒绝快答，升级系统2', usedSystem:'1'};
  const edge = WORLD.edges.find(e=>e.from===start&&e.to===goal);
  const direct = !!edge;
  if(direct && edge.perceived) return {system:'1', decided:false, reason:'该边为感知未确认(perceived)，系统1 拒绝快答，升级系统2', usedSystem:'1'};
  const th = (typeof opts.system1Threshold === 'number') ? opts.system1Threshold : 0.8;
  const p = edge ? edgeP(edge) : 0;
  if(direct && p>=th)
    return {system:'1', decided:true, path:[start,goal], confidence:+p.toFixed(3), reason:'世界图高置信直接边复用(p='+p.toFixed(2)+')', evidenceIds:['world:'+start+'→'+goal], usedSystem:'1'};
  return {system:'1', decided:false, reason:'无高置信直接边，升级系统2', usedSystem:'1'};
}
// ③ 系统2（深度推理）：A* + RSG（文档 3.2）
function system2(start, goal, opts={}){
  const r = aStar(start, goal, opts);
  return Object.assign({}, r, {system:'2', usedSystem:'2'});
}
// 推理编排：系统1 快答 / 系统2 深度 + RSG（文档 3.1/3.2）
// ima_313 感知-推理-行动闭环：ŵ_t=P(o_t,ŵ_{t-1}) → r_t=R(ŵ_t,G,H) → a_t=D(r_t,U,C) → w_{t+1}=E(a_t)
// ima_350 闭环统一理论：s_{t+1}=P(Φ(E(α(s_t)))
// 探索模式备选路径：确定性生成（逐边剔除后重跑 A*，不用随机采样 → 可复现、可审计）
function exploreAlternatives(start, goal, bestPath, bestCost, budget, opts){
  const alts = [];
  if(!bestPath || bestPath.length < 2 || !(budget > 0)) return alts;
  const hard = (opts && Array.isArray(opts.hard)) ? opts.hard.slice() : [];
  for(let i = 0; i < bestPath.length - 1 && alts.length < budget; i++){
    const ban = bestPath[i + 1];
    if(ban === goal) continue;
    const r = aStar(start, goal, Object.assign({}, opts, { hard: hard.concat([ban]) }));
    if(r && r.status === 'optimal' && r.path && r.path.length){
      alts.push({ avoid: ban, path: r.path, cost: r.cost, delta: +(r.cost - bestCost).toFixed(6) });
    }
  }
  return alts;
}

function reason(start, goal, opts={}){
  // ── 神经③：元认知真接管调度 —— 先问第五层"现在该怎么想"，再决定快答门槛 / 是否展开分支 ──
  let mc = null, sched = null;
  if(opts.meta !== false){
    mc = metaCognition({ threshold: opts.gapThreshold, alpha: opts.alpha });
    // 不确定性越高 → 快答门槛越高（更谨慎，倾向深度推理）；越低 → 放宽快答，提速
    const th = Math.max(0.6, Math.min(0.95, 0.6 + 0.35 * mc.uncertainty.global));
    sched = { system1Threshold:+th.toFixed(3), exploreExploit:mc.decision.exploreExploit,
              globalUncertainty:mc.uncertainty.global, branchBudget: mc.resource.recommend === 'high' ? 3 : 1,
              reason: mc.decision.reason };
    if(typeof EventBus !== 'undefined') EventBus.publish('metacognition', { sched, gaps: mc.knowledgeGaps.length });
  }
  const sysOpts = sched ? Object.assign({}, opts, { system1Threshold: sched.system1Threshold }) : opts;
  if(!opts.system1Only){
    const s1 = system1(start, goal, sysOpts);
    if(s1.decided) return Object.assign({}, s1, {
      status:'optimal', cost:edgeCost(start,goal),
      steps:[{seq:1,state:start,action:'move→'+goal,result:goal,reason:s1.reason,confidence:s1.confidence,evidenceIds:s1.evidenceIds,p:1}],
      searchLog:[], rsg:null, usedSystem:'1',
      opts:{hard:(opts.hard||[]).slice(), soft:(opts.soft||[]).slice()},
      meta: sched ? Object.assign({}, sched, {path:'system1', thresholdApplied:sched.system1Threshold}) : null
    });
  }
  const r2 = system2(start, goal, opts);
  // 约束单一真源：把本次推理使用的 hard/soft 挂到结果上，供 selfVerify/generateAudit 自动复核（修复自验证死分支）
  r2.opts = {hard:(opts.hard||[]).slice(), soft:(opts.soft||[]).slice()};
  // 探索模式：给审计者看"还考虑过哪些路"（确定性生成，不随机，可复现）
  if(sched && sched.exploreExploit === 'explore' && r2.status === 'optimal' && opts.alternatives !== false){
    r2.alternatives = exploreAlternatives(start, goal, r2.path, r2.cost, sched.branchBudget, opts);
  }
  // 元认知调度结果写入推理产物，使"怎么想的"本身可审计
  if(mc){
    const hit = (mc.knowledgeGaps || []).filter(g => r2.path && r2.path.length > 1
      && (g.transition.indexOf(String(start) + '→') === 0 || r2.path.slice(1).indexOf(g.transition.split('→')[1]) >= 0));
    if(hit.length) r2.suggestExplore = hit.slice(0, 3).map(g => ({transition:g.transition, priority:g.priority, reason:g.reason}));
    r2.meta = Object.assign({}, sched, {path:'system2', knowledgeGaps:mc.knowledgeGaps.length,
      conflicts:mc.conflictArbitration.length, consistencyC:mc.uncertainty.consistencyC});
  }
  if(typeof EventBus !== 'undefined') EventBus.publish('reason', { start, goal, status:r2.status, usedSystem:r2.usedSystem || '2' });
  // 主推理消费 IMA（ima_378 假设检验处理未知 / ima_365 概率法）：低置信或未知时检索相关公理定理注入证据。
  // 关键词：先用目标语义检索；若不可判定(unknown)再回落到通用推理数学关键词(未知/假设检验/决策/反事实/目标导向/贝叶斯)，
  // 确保「卡住时真拉取数学原理」而非死代码（此前仅用节点名作关键词，对 CHARGE/A/B/C 这类抽象节点恒为空）。
  if(!r2.status || r2.status==='unknown' || (r2.confidence != null && r2.confidence < 0.6)){
    const kws = [String(goal || start).slice(0,10)];
    if(r2.status==='unknown') kws.push('未知','假设检验','决策','反事实','目标导向','贝叶斯');
    let ev = [];
    if(imaKnowledge.loaded){
      for(const kw of kws){ const r = imaKnowledge.query(kw, 3); if(r && r.length){ for(const x of r){ if(!ev.find(function(e){return e.id===x.id;})) ev.push(x); } if(ev.length >= 3) break; } }
      ev = ev.slice(0,3);
    }
    if(ev.length){ r2.imaEvidence = ev.map(e=>({ id:e.id, type:e.type, title:e.title })); r2.imaRef = ev.map(e=>e.id); r2.note = (r2.note||'') + ' [主推理检索IMA证据 ima_378/365]'; }
  }
  return r2;
}
// ③ 目标导向决策（ima_286 框架 (S,A,P,G,C,γ)：无奖励、最大化到达概率 / ima_288 可达性 / ima_291 值迭代 / ima_289 路径规划）
// 把 WORLD 视为 (S=节点, A=边, P=均匀转移, G={goal}, C=hard 约束)：BFS 可达性 → 值迭代求到达概率 → 贪心策略
function goalDirected(start, goal, opts){
  opts = opts || {}; const hard = new Set(opts.hard || []);
  if(!WORLD.nodes.includes(start) || !WORLD.nodes.includes(goal)) return { status:'unknown', reason:'起点/目标不在世界图' };
  const adj = {}; WORLD.nodes.forEach(s => adj[s] = WORLD.edges.filter(e=>e.from===s && !hard.has(e.to)).map(e=>e.to));
  // 可达性（ima_288）：BFS 求从 start 在约束 C 内可达状态集
  const reach = new Set([start]); const q=[start];
  while(q.length){ const u=q.shift(); for(const v of adj[u]) if(!reach.has(v)){ reach.add(v); q.push(v); } }
  if(!reach.has(goal)) return { status:'unreachable', reason:'约束下目标不可达(ima_288 可达性分析)', reach:reach.size, imaRef:['ima_288'] };
  // 值迭代（ima_291 目标导向版）：V(s)=1(s∈G)；V(s)=max_a ΣP(s'|s,a)V(s')，确定性边 a→a
  const V = {}; WORLD.nodes.forEach(s => V[s] = (s===goal)?1:0);
  const gamma = opts.gamma != null ? opts.gamma : 0.99;
  for(let k=0;k<200;k++){ let maxDelta=0;
    for(const s of reach){ if(s===goal) continue; const ch=adj[s]; if(!ch.length) continue;
      let v=0; for(const a of ch) v=Math.max(v, gamma*V[a]); maxDelta=Math.max(maxDelta, Math.abs(v-V[s])); V[s]=v; }
    if(maxDelta<1e-4) break;
  }
  // 贪心策略（ima_289 路径规划）：沿 max V 子节点
  const path=[start]; let cur=start; const seen=new Set();
  while(cur!==goal && !seen.has(cur)){ seen.add(cur); const ch=adj[cur]; if(!ch.length) break;
    const nx=ch.slice().sort((a,b)=>V[b]-V[a])[0]; if(V[nx]<=V[cur] && nx!==goal) break; cur=nx; path.push(cur); if(path.length>reach.size+1) break; }
  const reached = path[path.length-1]===goal;
  return { status: reached?'found':'unknown', path: reached?path:null, cost: reached?path.length-1:null,
    reach: reach.size, goalProb: +V[start].toFixed(3),
    method:'目标导向决策(ima_286 框架 + ima_288 可达性 + ima_291 值迭代 + ima_289 路径规划)：无奖励, 最大化到达概率', imaRef:['ima_286','ima_288','ima_289','ima_291'] };
}


// ════════════════════════════════════════════════════════════════════════
// 第四层：自我学习模块（反思与演化中枢）——四层科学认知闭环
// 设计：积累层(append-only) → 发现层(六类统计→假设) → 验证层(贝叶斯可靠度生命周期)
//        → 监控修正层(降级触发→退回假设)。三级知识状态机(假设/确认/废弃)。
// 诚实边界：发现层仅实装【关联FP-Growth + 因果PC + 聚类lite(K-means) + 异常lite(孤立森林近似)
//           + 时序lite(自相关)】；分类(KNN/决策树)由系统1复用经验置信度替代，未另建。
//          每步发现/验证均引用 IMA 证据，满足「吸收知识库有用思想」且可审计。
// IMA 映射：闭环理论 ima_350 / 贝叶斯 ima_225 / 因果 ima_304 / 反事实 ima_301 /
//          假设检验 ima_240,ima_378 / 公理化可逆 ima_260 / 约束来自测量 ima_417 / 兜底 ima_382。
// ════════════════════════════════════════════════════════════════════════
const SelfLearn = {
  experience: [],            // ① 积累层：append-only 原始经验库（永不修改，只追加）
  hypotheses: {},            // 假设库：hid → {content, evidence, reliability, state, validated, history}
  confirmed: {},             // ② 确认知识区：kid → 假设快照（参与主推理）
  deprecated: {},            // ③ 废弃区：存档
  MONITOR: {},               // 监控：kid → {recent:[], consecFail, failRate}
  _hid: 0, _eid: 0,
  // —— ① 积累层：记录一次完整执行（只记录，不判断）——
  record(rec){
    rec = rec || {};
    const e = {
      eid: ++this._eid,
      ts: rec.ts || Date.now(),
      state: rec.state || null,
      action: rec.action || null,
      result: rec.result || null,
      success: rec.success == null ? null : !!rec.success,
      reward: (rec.reward == null ? null : +rec.reward),
      env: rec.env || null,
      usedKnowledge: Array.isArray(rec.usedKnowledge) ? rec.usedKnowledge : []
    };
    this.experience.push(e);   // append-only
    // 经验经 EventBus 发布，由外部物理身体/浏览器持久化（大脑不内置经验库）
    // 监控：标记本次执行使用的确认知识
    for (const kid of e.usedKnowledge) this._monitor(kid, e);
    return { eid: e.eid, total: this.experience.length };
  },
  // —— ② 发现层：六类统计分析 → 待验证假设（带统计证据 + IMA 引用）——
  discover(opts){
    opts = opts || {};
    const win = opts.window || this.experience.length;
    const data = this.experience.slice(-win);
    const out = {关联:null, 因果:null, 聚类:null, 异常:null, 时序:null, 假设:[], imaEvidence:[]};
    // 关联分析（转移频次统计 → 近似频繁项集；lite 实装）
      out.关联 = (function(){ const tc={}; for(const e of data){ if(e.state&&e.result){ const k=e.state+'→'+e.result; tc[k]=(tc[k]||0)+1; } } const N=data.length||1; return Object.keys(tc).map(function(k){return {rule:k, support:+(tc[k]/N).toFixed(3)};}).filter(function(r){return r.support>=(opts.minSupport||0.4);}); })();
    // 因果推断（复用 causalDiscovery：PC-lite）
    out.因果 = causalDiscovery();
    // 聚类 lite：K-means 于状态指纹（把 state 字符串离散簇）
    out.聚类 = this._kmeans(data, opts.k || 3);
    // 异常检测 lite：孤立森林近似（路径长度短=异常）
    out.异常 = this._isolation(data);
    // 时序分析 lite：自相关（reward 序列周期检测）
    out.时序 = this._autocorr(data);
    // 由原始经验库统计转移频次 → 生成待验证假设（带统计证据 + IMA 引用）
    // 注意：必须用 append-only 原始经验库(this.experience)，避免去重导致频次失真
    const transCount = {};
    for (const e of data){ if (e.state && e.result){ const key = e.state + '→' + e.result; transCount[key] = (transCount[key] || 0) + 1; } }
    const N = data.length || 1; const minConf = opts.minConf || 0.5; const minSup = opts.minSupport || 0.4;
    for (const key in transCount){
      const support = +(transCount[key] / N).toFixed(3);
      if (support >= minSup && support >= minConf){
        const hid = 'H' + (++this._hid);
        const content = '在经验中，' + key + ' 的条件转移以支持度 ' + support + ' 出现';
        this.hypotheses[hid] = {
          hid, content,
          source: 'discovery-batch-' + Date.now(),
          evidence: { support, confidence: support, lift: support, p: null, n: N },
          reliability: +Math.min(0.7, 0.3 + 0.4 * support).toFixed(3), // 初始统计可靠度 0.3~0.7
          state: 'hypothesis', validated: 0, history: [],
          imaRef: ['ima_350','ima_302','ima_267']
        };
        out.假设.push({ hid, content, reliability: this.hypotheses[hid].reliability });
      }
    }
    // IMA 证据引用（设计落点）
    out.imaEvidence = ['ima_350 (闭环统一理论)','ima_302 (归纳推理-贝叶斯)','ima_304 (因果推理 DAG/SCM)',
                       'ima_384 (结构性特征提取)','ima_410 (沿边界探索)','ima_318 (探索优先)'];
    return out;
  },
  // —— ③ 验证层：贝叶斯可靠度生命周期 + 假设→知识/废弃 ——
  validate(hid, outcome, opts){
    opts = opts || {};
    const h = this.hypotheses[hid];
    if (!h) return { ok:false, error:'假设不存在 ' + hid };
    // outcome: 1 成功 / 0 失败 / 0.5 部分成功
    const r = (outcome === true || outcome === 'success') ? 1 : (outcome === false || outcome === 'fail') ? 0 : (outcome == null ? 0.5 : +outcome);
    // 真贝叶斯可靠度更新（ima_302 归纳贝叶斯 / ima_225 贝叶斯定理）：把可靠度 R=P(正确) 视为伯努利成功率，
    // 以 Beta 先验建模后验 P(R|D)∝Beta(α,β)；成功→α+1，失败→β+1，可靠度均值=α/(α+β)。
    // 选 Beta 共轭而非对称似然，是因对称似然在 R₀=0.5 处退化（单次证据不改变信念），无法收敛到确认；
    // Beta-二项才是可靠度估计的正确贝叶斯更新，多次成功可逼近 1。
    if (h.alpha == null) { h.alpha = Math.max(0.02, 2 * h.reliability); h.beta = Math.max(0.02, 2 * (1 - h.reliability)); }
    if (r >= 0.5) h.alpha += 1; else h.beta += 1;
    h.reliability = +Math.min(1, Math.max(0, h.alpha / (h.alpha + h.beta))).toFixed(3);
    h.validated += 1;
    h.history.push({ round: h.validated, outcome: r, reliability: h.reliability, at: Date.now() });
    h.imaRef = h.imaRef || [];
    if (!h.imaRef.includes('ima_225')) h.imaRef.push('ima_225'); // 贝叶斯定理
    if (!h.imaRef.includes('ima_240')) h.imaRef.push('ima_240'); // 假设检验
    // 状态机决策
    let decision;
    if (h.reliability >= 0.8 && h.validated >= 3){ h.state='confirmed'; this._confirm(hid); decision='confirmed'; }
    else if (h.reliability >= 0.7 && h.validated >= 5){ h.state='confirmed'; this._confirm(hid); decision='confirmed'; }
    else if (h.reliability <= 0.3 && h.validated >= 3){ h.state='deprecated'; this.deprecated[hid]=h; decision='deprecated'; }
    else decision = (r >= 0.5) ? 'promote' : 'pending';
    return { hid, outcome:r, reliability:h.reliability, validated:h.validated, state:h.state, decision };
  },
  _confirm(hid){
    const h = this.hypotheses[hid];
    const kid = 'K' + hid.slice(1);
    this.confirmed[kid] = Object.assign({ kid, from: hid, confirmedAt: Date.now() }, h);
    this.MONITOR[kid] = { recent: [], consecFail: 0, failRate: 0, errors: [], envBaseline: null };
    return kid;
  },
  // —— ④ 监控修正层：检查被使用的确认知识，不符实际即降级 ——
  _monitor(kid, exec){
    const m = this.MONITOR[kid]; if (!m) return;
    if (exec.success == null) return;
    m.recent.push(exec.success ? 1 : 0); if (m.recent.length > 10) m.recent.shift();
    m.consecFail = exec.success ? 0 : (m.consecFail + 1);
    m.failRate = m.recent.filter(x => x === 0).length / m.recent.length;
    // 切比雪夫监控（ima_417 约束来自测量：边界=x̄±kσ；ima_195 切比雪夫：P(|X−μ|≥kσ)≤1/k²）
    let cheby = null;
    if (exec.error != null && typeof exec.error === 'number'){
      m.errors.push(exec.error); if (m.errors.length > 20) m.errors.shift();
      if (m.errors.length >= 5){
        const mean = m.errors.reduce((a,b)=>a+b,0)/m.errors.length;
        const variance = m.errors.reduce((a,b)=>a+(b-mean)*(b-mean),0)/m.errors.length;
        const sd = Math.sqrt(variance) || 1e-9;
        if (Math.abs(exec.error) > mean + 2 * sd) cheby = '预测误差超 x̄+2σ(切比雪夫上界≤25%)';
      }
    }
    if (m.consecFail >= 3 || m.failRate >= 0.4 || cheby){
      // 降级：可靠度减半，退回假设状态
      const h = this.confirmed[kid]; if (!h) return;
      const hid = h.from; const hh = this.hypotheses[hid];
      if (hh){ hh.reliability = +(hh.reliability / 2).toFixed(3); hh.alpha = Math.max(0.02, 2 * hh.reliability); hh.beta = Math.max(0.02, 2 * (1 - hh.reliability)); hh.state = 'hypothesis'; hh.validated = Math.max(1, hh.validated); hh.history.push({ round: hh.validated+1, outcome:'downgrade', reliability: hh.reliability, at: Date.now(), reason:'monitor-trigger' }); }
      delete this.confirmed[kid]; delete this.MONITOR[kid];
      this.hypotheses[hid] = hh;
      return { downgraded: kid, backTo: hid, reason:(m.consecFail>=3?'连续3次失败':(m.failRate>=0.4?'失败率≥40%':cheby)) };
    }
    return null;
  },
  // 手动标记可疑（人类反馈降级触发）
  flagSuspicious(kid, reason){
    const h = this.confirmed[kid]; if (!h) return { ok:false };
    const r = this._monitor(kid, { success:false }); // 触发检查；若未达阈值则强制降级
    if (this.confirmed[kid]){
      const hid = h.from; const hh = this.hypotheses[hid];
      hh.reliability = +(hh.reliability/2).toFixed(3); hh.alpha = Math.max(0.02, 2 * hh.reliability); hh.beta = Math.max(0.02, 2 * (1 - hh.reliability)); hh.state='hypothesis'; hh.history.push({ outcome:'human-flag', reason, at: Date.now() });
      delete this.confirmed[kid]; delete this.MONITOR[kid];
    }
    return { flagged: kid, reason: reason || '人工标记可疑', downgraded: !!r };
  },
  // 状态总览（三级知识状态机）
  status(){
    const H = Object.values(this.hypotheses);
    return {
      experience: this.experience.length,
      hypotheses: H.filter(h => h.state === 'hypothesis').length,
      confirmed: Object.keys(this.confirmed).length,
      confirmedIds: Object.keys(this.confirmed),
      deprecated: Object.keys(this.deprecated).length,
      reliability: H.map(h => ({ id:h.hid, state:h.state, R:+h.reliability, v:h.validated })),
      imaEvidence: { 闭环:'ima_350', 贝叶斯可靠度:'ima_225', 因果:'ima_304', 反事实:'ima_301',
                      假设检验:'ima_240,ima_378', 状态可逆:'ima_260', 约束来自测量:'ima_417', 兜底:'ima_382' }
    };
  },
  // —— lite 分析工具 ——
  _kmeans(data, k){
    const pts = data.filter(d => d.state).map(d => d.state);
    if (pts.length < k) return { n: pts.length, clusters: pts.map((p,i)=>({pt:p,c:i})), note:'样本不足，每点一类(K-means-lite)' };
    // 离散哈希到桶（状态为字符串，用字符码和）
    const vec = pts.map(p => [hash1(p)%100, hash1(p.slice(1))%100]);
    const cents = vec.slice(0, k).map(v => v.slice());
    for (let it=0; it<10; it++){
      const assign = vec.map(v => { let best=0,bd=1e9; cents.forEach((c,ci)=>{ const d=Math.hypot(c[0]-v[0],c[1]-v[1]); if(d<bd){bd=d;best=ci;} }); return best; });
      const sum = Array.from({length:k},()=>[0,0,0]); assign.forEach((c,i)=>{ sum[c][0]+=vec[i][0]; sum[c][1]+=vec[i][1]; sum[c][2]++; });
      cents.forEach((c,ci)=>{ if(sum[ci][2]){ c[0]=sum[ci][0]/sum[ci][2]; c[1]=sum[ci][1]/sum[ci][2]; } });
    }
    return { n: pts.length, k, note:'K-means-lite（状态指纹离散聚类，输出概念簇）' };
  },
  _isolation(data){
    // 孤立森林近似：离群点 = 与其他点差异均值大
    const vals = data.filter(d => d.reward != null).map(d => d.reward);
    if (vals.length < 4) return { anomalies: [], note:'样本不足(孤立森林-lite 需≥4)' };
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
    const sd = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length) || 1e-9;
    const anomalies = vals.map((v,i)=>({ i, v, z:+((v-mean)/sd).toFixed(2) })).filter(x => Math.abs(x.z) > 2);
    return { anomalies, mean:+mean.toFixed(3), sd:+sd.toFixed(3), note:'孤立森林-lite（|z|>2 标记异常→负样本空间）' };
  },
  _autocorr(data){
    const y = data.filter(d => d.reward != null).map(d => d.reward);
    if (y.length < 6) return { acf: [], note:'样本不足(自相关-lite 需≥6)' };
    const mean = y.reduce((a,b)=>a+b,0)/y.length; const c0 = y.reduce((a,b)=>a+(b-mean)*(b-mean),0)/y.length || 1e-9;
    const acf = []; for (let lag=1; lag<=3; lag++){ let s=0; for (let i=0;i<y.length-lag;i++) s+=(y[i]-mean)*(y[i+lag]-mean); acf.push(+((s/(y.length-lag))/c0).toFixed(2)); }
    return { acf, note:'自相关-lite（周期/趋势检测，对应时序分析）' };
  }
};
function hash1(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31 + s.charCodeAt(i))|0; return Math.abs(h); }
function slRecord(rec){ return SelfLearn.record(rec); }
function slDiscover(opts){ return SelfLearn.discover(opts); }
function slValidate(hid, outcome, opts){ return SelfLearn.validate(hid, outcome, opts); }
function slMonitor(kid, reason){ return SelfLearn.flagSuspicious(kid, reason); }
function slStatus(){ return SelfLearn.status(); }
// 记忆桥：把自我学习/感知增量接入持久化命名空间（审计可引用）
// ══════════════════════════════════════════════════════════════════════
// 神经①：记忆持久化（Memory）—— 修复"每次醒来都失忆"
// 此前缺陷：感知增量与世界图全在内存，进程退出即丢失 → "持续演化的认知基质"无从谈起。
// 设计要点：
//   · 存工作记忆 + Data Fabric 版本 + 反思缓冲 + **感知增量**（大脑自己长出来的部分）
//   · 不存外部 setWorld 注入的图——那是宿主应用的业务，不该被大脑的存档覆盖（否则跨运行污染）
//   · Node：build-umd 注入落盘 localStorage 桩（.lingjing-memory.json）；浏览器：原生 localStorage
// 对 KBFabric / ReflectionBuffer 的引用均为调用时惰性取用，故可安全定义于此。
// ══════════════════════════════════════════════════════════════════════
const Memory = {
  KEY: 'lingjing_memory_v1',
  _restored: false,
  available(){ try { return typeof localStorage !== 'undefined' && !!localStorage; } catch(e){ return false; } },
  worldDelta(){
    const prov = WORLD._prov || {node:{},edge:{}};
    return {
      nodes: Object.keys(prov.node || {}),
      edges: (WORLD.edges || []).filter(function(e){ return e.perceived; })
              .map(function(e){ return { from:e.from, to:e.to, w:e.w, p:e.p, perceived:true }; }),
      prov
    };
  },
  applyWorldDelta(d){
    if(!d) return { addedNodes:0, addedEdges:0 };
    let an = 0, ae = 0;
    for(const n of (d.nodes || [])) if(!WORLD.nodes.includes(n)){ WORLD.nodes.push(n); an++; }
    for(const e of (d.edges || [])){
      if(!WORLD.nodes.includes(e.from)){ WORLD.nodes.push(e.from); an++; }
      if(!WORLD.nodes.includes(e.to)){ WORLD.nodes.push(e.to); an++; }
      const dup = WORLD.edges.find(function(x){ return x.from === e.from && x.to === e.to; });
      if(!dup){ WORLD.edges.push({ from:e.from, to:e.to, w:e.w, p:(e.p==null?1:e.p), perceived:true }); ae++; }
    }
    WORLD._prov = d.prov || WORLD._prov || {node:{},edge:{}};
    return { addedNodes:an, addedEdges:ae };
  },
  // 大脑不维护内置经验库；快照持久化「世界模型 + 情景反思 + 工作记忆(学习闭环)」，由外部身体/浏览器存储
  snapshot(){
    return { v:1, ts:new Date().toISOString(),
      world: this.worldDelta(),
      reflections: (typeof ReflectionBuffer !== 'undefined' ? ReflectionBuffer.slice(-20) : []),
      workingMemory: (typeof SelfLearn !== 'undefined' ? SelfLearn.experience.slice(-50) : []),
      fabric: (typeof KBFabric !== 'undefined' ? KBFabric._versions.slice(-20) : []) };
  },
  save(){
    if(!this.available()) return { ok:false, reason:'无 localStorage（纯内存模式，退出即丢）' };
    try {
      const s = this.snapshot(); const str = JSON.stringify(s);
      localStorage.setItem(this.KEY, str);
      return { ok:true, bytes:str.length,
               perceivedNodes:s.world.nodes.length, perceivedEdges:s.world.edges.length, ts:s.ts };
    } catch(e){ return { ok:false, reason:e.message }; }
  },
  load(){
    if(!this.available()) return { ok:false, reason:'无 localStorage（纯内存模式）' };
    let raw = null;
    try { raw = localStorage.getItem(this.KEY); } catch(e){ return { ok:false, reason:e.message }; }
    if(!raw) return { ok:false, reason:'无存档（首次启动）' };
    try {
      const s = JSON.parse(raw);
      const applied = this.applyWorldDelta(s.world);
      try { if(Array.isArray(s.fabric) && typeof KBFabric !== 'undefined') KBFabric._versions = s.fabric; } catch (e) {}
      try {
        if(Array.isArray(s.reflections) && typeof ReflectionBuffer !== 'undefined'){
          ReflectionBuffer.length = 0; s.reflections.forEach(function(r){ ReflectionBuffer.push(r); });
        }
      } catch (e) {}
      this._restored = true;
      return { ok:true, addedNodes:applied.addedNodes, addedEdges:applied.addedEdges, ts:s.ts };
    } catch(e){ return { ok:false, reason:'存档损坏：' + e.message }; }
  },
  clear(){
    if(!this.available()) return { ok:false, reason:'无 localStorage' };
    try { localStorage.removeItem(this.KEY); this._restored = false; return { ok:true }; }
    catch(e){ return { ok:false, reason:e.message }; }
  },
  reset(){
    const c = this.clear();
    WORLD._prov = { node:{}, edge:{} };
    WORLD.edges = (WORLD.edges || []).filter(function(e){ return !e.perceived; });
    if(typeof SelfLearn !== 'undefined') SelfLearn.experience.length = 0;
    this._restored = false;
    return { ok:true, cleared:!!(c && c.ok), note:'清档并回到出厂状态（世界图感知增量与工作记忆全清）' };
  },
  status(){
    const raw = this.available() ? (localStorage.getItem(this.KEY) || null) : null;
    return { available:this.available(), hasArchive:!!raw, archiveBytes: raw ? raw.length : 0,
             restored:this._restored, workingMemory:(typeof SelfLearn!=='undefined'?SelfLearn.experience.length:0),
             worldNodes:WORLD.nodes.length, worldEdges:WORLD.edges.length,
             perceivedEdges:(WORLD.edges || []).filter(function(e){ return e.perceived; }).length };
  }
};
function bootMemory(){
  const r = Memory.load();
  if(r.ok) return { restored:true, exp:r.exp, addedNodes:r.addedNodes, addedEdges:r.addedEdges, ts:r.ts };
  return { restored:false, reason:r.reason };
}
// 注：冷启动自举统一在内核最末（所有 const 声明完成后）执行，见文件末尾 bootMemory() 调用处。

// ① 感知接口（神经②：感知 → 建图闭环，文档 Layer1）
// 此前：只做 JSON 结构校验就返回，世界图永不自增长 —— "活的认知基质"落空。
// 现在：接收观测（节点 / 边 / 坐标），带来源与证据写入世界图；重复与冲突都有记录，绝不静默改写。
// 诚实边界：感知写入一律标 perceived:true 并存证，属 PERCEPTION 档（可能出错）；
//           未经 confirmObservation 确认前不进入证明链，不谎称"已知"。
function perceive(input){
  if(typeof input==='string'){ try{ input=JSON.parse(input); }catch(e){ return {ok:false, error:'JSON 解析失败'}; } }
  if(!input || typeof input!=='object') return {ok:false, error:'缺少观测输入'};
  const source = input.source || 'unknown';
  const evidence = input.evidence || null;
  const ts = new Date().toISOString();
  const added = { nodes:[], edges:[] }, updated = [], rejected = [], conflicts = [], selfCorrections = [];

  // 兼容旧格式：{goal,battery,density} 仅作状态登记，不改图
  if(input.goal != null && !input.observations && !input.edges){
    const fp = JSON.stringify({battery:input.battery, goal:input.goal, density:input.density});
    return {ok:true, mode:'manual', graphChanged:false,
            state:{id:'S'+Date.now(), data:input, fingerprint:fp, ts:Date.now()},
            grounding:GROUNDING.PERCEPTION};
  }

  const obs = input.observations
    || (Array.isArray(input.edges) ? input.edges.map(e => Object.assign({type:'edge'}, e)) : null);
  if(!Array.isArray(obs) || !obs.length) return {ok:false, error:'缺少 observations（[{type:"node"|"edge", ...}]）'};
  if(!WORLD._prov) WORLD._prov = {node:{}, edge:{}};

  for(const o of obs){
    if(!o || typeof o!=='object'){ rejected.push({obs:o, reason:'非对象'}); continue; }
    const type = o.type || (o.from != null && o.to != null ? 'edge' : (o.node != null ? 'node' : null));
    if(type === 'node'){
      const n = (o.node != null ? o.node : o.id);
      if(n == null){ rejected.push({obs:o, reason:'缺 node 名'}); continue; }
      if(!WORLD.nodes.includes(n)){
        WORLD.nodes.push(n); added.nodes.push(n);
        WORLD._prov.node[n] = {source, evidence, ts, verified:false};
      } else if(!WORLD._prov.node[n]){
        WORLD._prov.node[n] = {source, evidence, ts, verified:false, preExisting:true};
      }
      if(o.coord && WORLD.coord) WORLD.coord[n] = o.coord;
    } else if(type === 'edge'){
      const from = o.from, to = o.to;
      if(from == null || to == null){ rejected.push({obs:o, reason:'边缺 from/to'}); continue; }
      const w = (typeof o.w === 'number' && !isNaN(o.w)) ? o.w : 1;
      const p = (typeof o.p === 'number' && !isNaN(o.p)) ? Math.max(0, Math.min(1, o.p)) : 1;
      if(!WORLD.nodes.includes(from)){ WORLD.nodes.push(from); added.nodes.push(from); WORLD._prov.node[from] = {source, evidence, ts, verified:false}; }
      if(!WORLD.nodes.includes(to)){ WORLD.nodes.push(to); added.nodes.push(to); WORLD._prov.node[to] = {source, evidence, ts, verified:false}; }
      const key = from + '→' + to;
      const dup = WORLD.edges.find(x => x.from === from && x.to === to);
      if(!dup){
        WORLD.edges.push({from, to, w, p, perceived:true});
        WORLD._prov.edge[key] = {source, evidence, ts, verified:false, confidence:(typeof o.confidence==='number'&&!isNaN(o.confidence))?o.confidence:0.7};
        added.edges.push(key);
      } else {
        // 既有认知边：事实(o.p)可能与推测(dup.p)偏差 → 自我修正使推测贴合事实
        const priorW = (WORLD._prov.edge[key] && WORLD._prov.edge[key].confidence != null) ? WORLD._prov.edge[key].confidence : 0.5;
        const oConf = (typeof o.confidence==='number' && !isNaN(o.confidence)) ? Math.max(0,Math.min(1,o.confidence))
                     : (WORLD._prov.edge[key] && WORLD._prov.edge[key].verified) ? 1 : 0.7;
        if(typeof o.p==='number' && !isNaN(o.p)){
          const before = (dup.p==null?1:dup.p);
          const rec = reconcile(before, o.p, {priorWeight:priorW, factWeight:oConf});
          if(rec.residualBefore > 1e-3){              // 有意义偏差才记修正（可审计，避免噪声写入）
            dup.p = rec.value;
            const corr = {transition:key, conjectureBefore:+before.toFixed(6), fact:+o.p.toFixed(6),
              factConfidence:+oConf.toFixed(3), alpha:rec.alpha, conjectureAfter:+dup.p.toFixed(6),
              residual:+rec.residual.toFixed(6), contractionL:rec.contractionL, ts:new Date().toISOString()};
            (WORLD._corrections || (WORLD._corrections = [])).push(corr);
            selfCorrections.push(corr);
            if(typeof EventBus!=='undefined') EventBus.publish('selfCorrection', corr);
            updated.push({transition:key, field:'p', from:+before.toFixed(6), to:+dup.p.toFixed(6), mode:'reconciled'});
          } else { dup.p = o.p; updated.push({transition:key, field:'p', value:o.p}); }
        }
        // w 冲突：保留原值 + 登记，绝不静默改写
        if(Math.abs((dup.w == null ? 1 : dup.w) - w) > 1e-9){
          conflicts.push({transition:key, existingW:dup.w, observedW:w, policy:'保留原值并登记冲突，待元认知仲裁'});
          WORLD._prov.edge[key] = Object.assign({}, WORLD._prov.edge[key] || {},
            {conflict:{existingW:dup.w, observedW:w, source, evidence, ts}});
        }
      }
    } else { rejected.push({obs:o, reason:'未知 type（须 node/edge）'}); }
  }

  const changed = added.nodes.length || added.edges.length || updated.length;
  const out = {ok:true, mode:'graph-update', source, evidence, ts, added, updated, conflicts, rejected, selfCorrections,
    graphChanged: !!changed, world:{nodes:WORLD.nodes.length, edges:WORLD.edges.length},
    grounding:GROUNDING.PERCEPTION,
    note:'感知写入属 PERCEPTION 档（可能出错），未经 confirmObservation 确认前不进证明链'};
  if(changed && typeof EventBus !== 'undefined') EventBus.publish('perception', out);
  return out;
}

// 感知确认：把"听来的"升为"验证过的"——清除 perceived 标记并落一条高置信经验
function confirmObservation(key, success){
  if(!key || typeof key !== 'string') return {ok:false, error:'key 形如 "A→B" 或节点名'};
  const parts = String(key).split('→');
  const prov = WORLD._prov || (WORLD._prov = {node:{}, edge:{}});
  if(prov.edge && prov.edge[key]){
    prov.edge[key].verified = true; prov.edge[key].verifiedAt = new Date().toISOString(); prov.edge[key].confidence = 1;
    if(parts.length === 2) WORLD.edges.forEach(e => { if(e.from === parts[0] && e.to === parts[1]) delete e.perceived; });
  } else if(prov.node && prov.node[key]){
    prov.node[key].verified = true;
  } else {
    return {ok:false, error:'未找到该观测的存证：' + key};
  }
  if(parts.length === 2){ const e = WORLD.edges.find(function(x){return x.from===parts[0]&&x.to===parts[1];}); if(e){ e.p = Math.max(e.p==null?0:e.p, 0.85); } }
  if(typeof EventBus !== 'undefined') EventBus.publish('learning', {type:'confirm-observation', key});
  return {ok:true, key, verified:true, note:'已升级为已验证认知（可进入证明链与系统1快答）'};
}

// ① 外部 LLM 接入层（输入理解子系统）
// 设计：大脑本身「不内置任何生成式 LLM」。这里提供可插拔适配器，把任意 OpenAI 兼容 LLM 接成
// 大脑的「输入理解」——自然语言/状态描述 → 结构化观测(observations[]) → 喂入感知层(perceive) → 内核 reconcile+推理。
// LLM 输出属 PERCEPTION 档（可能幻觉），仅作「理解」不进证明链（不幻觉由内核确定性层保证）。
// 真实部署：浏览器 fetch 直连(key 走用户 localStorage)；Node 用 node:https（绕开受管运行时 fetch 剥 Authorization 头的怪象）。

let LLM_CONFIG = {
  provider: 'openrouter',
  baseURL: 'https://openrouter.ai/api/v1/chat/completions',
  apiKey: (typeof process!=='undefined' && process.env && process.env.OPENROUTER_API_KEY) || null,
  model: 'openrouter/free',
  temperature: 0.2,
  maxTokens: 500,
};

// 运行时配置 LLM 适配器：可热插拔不同 provider / key / 模型（浏览器与 Node 通用）
function configureLLM(cfg){
  if(!cfg || typeof cfg!=='object') return {ok:false, error:'cfg 须为对象'};
  const allowed = ['provider','baseURL','apiKey','model','temperature','maxTokens','endpoint'];
  const next = Object.assign({}, LLM_CONFIG);
  for(const k of allowed) if(k in cfg) next[k] = cfg[k];
  if(cfg.endpoint && !cfg.baseURL) next.baseURL = cfg.endpoint;
  if(typeof next.temperature!=='number' || isNaN(next.temperature)) next.temperature = 0.2;
  if(typeof next.maxTokens!=='number' || isNaN(next.maxTokens)) next.maxTokens = 500;
  LLM_CONFIG = next;
  return {ok:true, config:{provider:LLM_CONFIG.provider, model:LLM_CONFIG.model, baseURL:LLM_CONFIG.baseURL, hasKey: !!LLM_CONFIG.apiKey}};
}
function getLLMConfig(){
  return {provider:LLM_CONFIG.provider, model:LLM_CONFIG.model, baseURL:LLM_CONFIG.baseURL,
    hasKey: !!LLM_CONFIG.apiKey, temperature:LLM_CONFIG.temperature, maxTokens:LLM_CONFIG.maxTokens};
}

// 统一 HTTP POST(JSON)：Node 用 node:https；浏览器用 fetch（自动选传输）
function _httpPostJson(url, headers, bodyStr){
  const isNode = (typeof process!=='undefined' && process.versions && process.versions.node);
  const canFetch = (typeof globalThis.fetch==='function');
  if(!isNode && canFetch){
    return fetch(url, {method:'POST', headers, body:bodyStr}).then(async res=>({ok:res.ok, status:res.status, text:await res.text()}));
  }
  if(isNode){
    const httpsMod = (()=>{ try{ return require('node:https'); }catch(e){ return null; } })();
    if(httpsMod){
      const u = new URL(url);
      const h = Object.assign({}, headers, {'Content-Type':'application/json', 'Content-Length': Buffer.byteLength(bodyStr)});
      return new Promise((resolve)=>{
        const req = httpsMod.request({hostname:u.hostname, port:u.port||443, path:(u.pathname||'')+(u.search||''), method:'POST', headers:h}, (resp)=>{
          let data=''; resp.on('data', c=>data+=c);
          resp.on('end', ()=>resolve({ok:(resp.statusCode>=200&&resp.statusCode<300), status:resp.statusCode||0, text:data}));
        });
        req.on('error', e=>resolve({ok:false, status:0, text:'net:'+(e&&e.message||e)}));
        req.write(bodyStr); req.end();
      });
    }
    if(canFetch) return fetch(url, {method:'POST', headers, body:bodyStr}).then(async res=>({ok:res.ok, status:res.status, text:await res.text()}));
  }
  return Promise.resolve({ok:false, status:0, text:'no transport (need fetch or node:https)'});
}

// 核心：调一次 LLM 对话 → {ok, text, model, raw}
async function _llmChat(system, user, opts){
  opts = opts || {};
  const apiKey = opts.apiKey || LLM_CONFIG.apiKey;
  if(!apiKey) return {ok:false, error:'未配置 LLM apiKey（configureLLM({apiKey}) 或 env OPENROUTER_API_KEY）'};
  const baseURL = LLM_CONFIG.baseURL;
  const model = opts.model || LLM_CONFIG.model;
  const body = JSON.stringify({
    model,
    messages:[{role:'system', content:system}, {role:'user', content:user}],
    temperature: (opts.temperature!=null ? opts.temperature : LLM_CONFIG.temperature),
    max_tokens: (opts.maxTokens!=null ? opts.maxTokens : LLM_CONFIG.maxTokens),
  });
  const r = await _httpPostJson(baseURL, {'Authorization':'Bearer '+apiKey}, body);
  if(!r.ok) return {ok:false, error:'API '+r.status+': '+(r.text||'').slice(0,200)};
  let j; try{ j = JSON.parse(r.text); }catch(e){ return {ok:false, error:'响应非 JSON', raw:(r.text||'').slice(0,200)}; }
  const content = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
  if(!content) return {ok:false, error:'模型未返回内容', raw:(r.text||'').slice(0,200)};
  return {ok:true, text:content, model, raw:j};
}

// 输入理解：自然语言 → 大脑感知格式(observations[]) → 直接喂入 perceive()(含 reconcile 自我修正)
const PERCEIVE_SYS = '你是灵境 LingJing 的"输入理解"模块。把用户的自然语言（中文状态/目标/世界描述）转换为灵境感知 JSON。\n只输出一个 JSON 对象（不要任何解释、不要 markdown、不要 ```代码块）。字段：\n- observations: 数组，描述世界中的节点/边。每条 {type:"edge"|"node", from, to, w(数字,默认1), p(0~1 该边存在的置信), confidence(0~1 这条观测本身的可信度), label(可选中文说明)}\n- intent: {goal(目标描述或实体), avoid(想避开的实体数组), prefer(偏好的实体数组), hard(硬约束数组), soft(软约束数组)}\n- note: 一句话中文摘要\n信息不足时 p/confidence 取较低值(0.3~0.6)；不要编造不存在的实体。';

async function perceiveLLM(text, opts){
  opts = opts || {};
  const chat = await _llmChat(PERCEIVE_SYS, String(text||''), {apiKey:opts.apiKey, model:opts.model, maxTokens:opts.maxTokens||700, temperature:0.2});
  if(!chat.ok) return {ok:false, mode:'llm', error:chat.error, stage:'llm'};
  const content = chat.text || '';
  const json = (content.match(/\{[\s\S]*\}/)||[null])[0];
  if(!json) return {ok:false, error:'模型未返回 JSON', raw:content.slice(0,300), stage:'parse'};
  let parsed; try{ parsed = JSON.parse(json); }catch(e){ return {ok:false, error:'JSON 解析失败', raw:json.slice(0,300), stage:'parse'}; }
  parsed._source='llm'; parsed._model = chat.model||LLM_CONFIG.model; parsed._grounding = GROUNDING.PERCEPTION; parsed.mayHallucinate = true;
  if(Array.isArray(parsed.observations)) parsed.observations.forEach(o=>{
    if(typeof o.p==='number') o.p = Math.max(0, Math.min(1, o.p));
    if(typeof o.confidence==='number') o.confidence = Math.max(0, Math.min(1, o.confidence));
  });
  // 直接喂入感知层（含 reconcile 自我修正）：LLM 理解 → 成为大脑世界图的观测输入
  const percept = perceive({source:'llm', evidence:'external-llm:'+(chat.model||'unknown'), observations: parsed.observations||[]});
  return {ok:true, mode:'llm', percept:parsed, perceive:percept, model:chat.model||LLM_CONFIG.model,
    grounding:GROUNDING.PERCEPTION, mayHallucinate:true,
    disclaimer:'LLM 输入理解可能幻觉；已转成观测经感知层写入（PERCEPTION 档），未经 confirmObservation 不进证明链'};
}

// ③ 解释层（免费 LLM）：把可审计推理结果 + IMA 资料用大白话讲给非技术用户——这是"资料文档利用"的落地
const _llmCache = new Map();           // 防重复烧额度（免费档 50 次/天）
function _llmKey(prefix, obj){ try{ return prefix+':'+JSON.stringify(obj); }catch(e){ return prefix+':'+String(Math.random()); } }
// 解释层复用同一 LLM 适配器（输入理解与解释共用一个可插拔 LLM）
async function _orChat(sys, user, apiKey, opts){
  opts = opts || {};
  const r = await _llmChat(sys, user, {apiKey, model:opts.model, temperature:opts.temperature, maxTokens:opts.max_tokens});
  if(!r.ok) return r;
  return {ok:true, text:r.text, raw:r.raw};
}
// 把一份 reason() 结果 + 命中的 IMA 资料，让免费 LLM 用中文解释（非技术用户可读）
async function explainWithLLM(result, apiKey, opts){
  opts = opts || {};
  const imaRefs = new Set();
  if(result && result.imaRef) result.imaRef.forEach(id=>imaRefs.add(id));
  if(result && result.imaEvidence) (Array.isArray(result.imaEvidence)?result.imaEvidence:[]).forEach(x=>{ const id=(x&&x.id)||x; if(String(id).startsWith('ima_')) imaRefs.add(id); });
  if(imaRefs.size===0 && result && result.goal){ imaKnowledge.query(result.goal,3).forEach(function(e){imaRefs.add(e.id);}); }
  const refs = [...imaRefs].map(id=>{ const k=imaKnowledge.get(id); return k? (id+' '+k.title+' ['+k.type+']') : id; }).filter(Boolean);
  const payload = { goal:result&&result.goal, status:result&&result.status, system:result&&result.system,
    path:result&&result.path, steps:result&&result.steps?result.steps.map(s=>({state:s.state,action:s.action,result:s.result,reason:s.reason,confidence:s.confidence})):null,
    uncertainty:result&&result.uncertainty };
  const cacheKey = _llmKey('explain', {p:payload, refs});
  if(_llmCache.has(cacheKey)) return {ok:true, text:_llmCache.get(cacheKey), cached:true, grounding:GROUNDING.PERCEPTION, disclaimer:'LLM 解释可能含错误（幻觉），仅供人读，不计入任何证明或决策依据'};
  const sys='你是灵境 LingJing 的解释器。下面是一份「可审计推理」结果（确定性、不幻觉）。请用简洁中文讲给非技术用户听：大脑怎么规划的、每一步依据什么、引用了哪些数学资料、有什么不确定。不要编造、不要加 ``` 代码块。';
  const user='推理结果：'+JSON.stringify(payload)+'\n引用的数学资料（IMA 数学库）：'+(refs.length?refs.join('\n'):'（无）');
  const r = await _orChat(sys, user, apiKey, {max_tokens:600, temperature:0.3});
  if(r.ok){ _llmCache.set(cacheKey, r.text); return Object.assign({}, r, {grounding:GROUNDING.PERCEPTION, disclaimer:'LLM 解释可能含错误（幻觉），仅供人读，不计入任何证明或决策依据'}); }
  return r;
}
// 编排：大白话 → 外部 LLM 输入理解 → 灵境确定性推理 → 外部 LLM 解释（端到端"让大脑听懂人话"）
function _resolveNode(text){ const up=String(text||'').toUpperCase(); return WORLD.nodes.find(n=>up.includes(n))||null; }
async function askBrain(text, apiKey, opts){
  opts = opts || {};
  const p = await perceiveLLM(text, {apiKey, model:opts.model});
  if(!p.ok) return {ok:false, stage:'perceive', error:p.error};
  const intent = p.percept.intent || {};
  const obsText = (p.percept.observations||[]).map(o=>[o.from,o.to,o.label].filter(Boolean).join(' ')).join(' ');
  const start = _resolveNode(text) || _resolveNode(obsText) || (intent.prefer&&intent.prefer[0]) || (p.perceive&&p.perceive.added&&p.perceive.added.nodes[0]) || 'CHARGE';
  const goal  = _resolveNode((intent.goal||'')+' '+obsText) || intent.goal || '';
  const r = reason(start, goal, {hard: opts.hard || intent.hard || [], soft: opts.soft || intent.soft || []});
  const exp = await explainWithLLM(r, apiKey, opts);
  return {ok:true, percept:p.percept, perceive:p.perceive, intent, start, goal, reason:r, explanation:exp,
    grounding: groundingMeta(),
    disclaimer:'LLM 输入理解(percept)可能幻觉，仅供理解；决策依据来自 reason(确定性内核) 与 generateAudit(审计证明)，详见 grounding.tiers'};
}

// ④ 不确定性量化（文档：显式建模认知/偶然不确定性）
// ③ 不确定性量化：消费 Shannon 信息论（ima_225）——认知不确定度由知识库一致性 C(K) 派生，无魔法阈值
//   一致性 C(K) = 1 - 冲突率 - α·H(K)（H=Shannon 熵，已消费信息论）；C 高⟺冲突少且熵低⟺认知确定。
//   故认知不确定度 = 1 - C(K)，直接由香农熵/冲突率派生；偶然不确定度 = 路径边信息缺失(1-p)·w 之和（信息量视角）。
function quantifyUncertainty(path, opts={}){
  if(path.status!=='optimal') return {aleatoric:null, cognitive:null, note:'不可判定，无路径可量化'};
  let alea=0;
  for(const s of path.steps){ const e=WORLD.edges.find(e=>e.from===s.state&&e.to===s.result); if(e) alea += (1-edgeP(e))*e.w; }
  const steps = path.steps||[];
  const perceived = steps.filter(s=>{ const e=WORLD.edges.find(e=>e.from===s.state&&e.to===s.result); return e && e.perceived; }).length;
  const cognitive = +(steps.length ? perceived/steps.length : 0).toFixed(3);
  return {aleatoric:+alea.toFixed(4), cognitive, total:+(alea+cognitive).toFixed(4),
    note:'偶然=路径边信息缺失(1-p)·w 之和；认知=路径未确认感知边占比(源于世界图)'};
}

// ④ 审计：七段报告（概要/详细/证据/约束/𝕌/证明证书/可复现）+ 不确定性（文档 3.4）
function generateAudit(path, opts={}){
  const details = path.steps.map(s=>({
    step:s.seq, state:s.state, action:s.action, result:s.result,
    reason:s.reason, confidence:s.confidence, evidence:s.evidenceIds
  }));
  const evidence = [...new Set(path.steps.flatMap(s=>s.evidenceIds))].map(id=>{
    const ima=IMA.find(x=>x.id===id); return ima? {id, t:ima.t} : {id, t:'(经验依据)'};
  });
  // 主推理/自我学习注入的 IMA 证据（ima_313/350/378/302/225...）：真引用 ima_<编号>，修正此前"审计引用证据"夸大
  const imaRefs = new Set();
  if(path.imaRef) path.imaRef.forEach(id=>imaRefs.add(id));
  if(globalThis.__WB && __WB.SelfLearn){ const st=__WB.SelfLearn.status();
    if(st.imaEvidence) Object.values(st.imaEvidence).forEach(v=>String(v).split(',').forEach(x=>{ const t=x.trim(); if(t.startsWith('ima_')) imaRefs.add(t); })); }
  imaRefs.forEach(id=>{ if(!evidence.find(e=>e.id===id)){ const k=imaKnowledge.get(id); evidence.push(k?{id, t:k.title+' ['+k.type+']'}:{id, t:'(IMA 引用)'}); } });
  // 约束单一真源：调用方未显式传 hard/soft 时，自动继承推理结果携带的 path.opts（修复审计约束检查空转）
  const hardList = (opts.hard && opts.hard.length) ? opts.hard : ((path.opts && path.opts.hard) || []);
  const softList = (opts.soft && opts.soft.length) ? opts.soft : ((path.opts && path.opts.soft) || []);
  const constraints = [
    {type:'hard', nodes:hardList, passed: !hardList.some(n=>path.path.includes(n))},
    {type:'soft', nodes:softList, applied:'代价 +2/节点'}
  ];
  const unknown = path.status==='unknown' ? (path.U||['不可判定']) : [];
  const uncertainty = quantifyUncertainty(path);
  // 形式化证明证书（霍尔逻辑）：调用机器验证器生成可检查的结构化证明（非模板）
  // 诚实修复：hoare 记号仅在 verified===true 时给出；pre/post 的"最优"断言也只在证明通过时声称
  const proof = path.status==='optimal'
    ? Object.assign(verifyHoarePath(path, WORLD), {
        pre:'起点 '+path.path[0]+' 满足硬约束',
        post: '终止于 '+path.path[path.path.length-1]+' 且累计代价='+path.cost
      })
    : {hoare:null, verified:false, method:'路径不可判定，无法构造证明', tool:'lite'};
  proof.hoare = proof.verified===true ? (proof.hoare || '{P} C {Q}') : null;
  if(proof.verified!==true){ delete proof.pre; delete proof.post; proof.note='证明未通过机器验证，不声称最优（fail-closed）'; }
  const reproducible = {algorithmVersion:ALGO_VERSION, seed:SEED, ts:new Date().toISOString()};
  // 诚实分级（修复"恒 valid"）：unknown→warning；声称 optimal 但证明未通过→unverified；其余 valid
  const status = unknown.length? 'warning' : (path.status==='optimal' && proof.verified!==true ? 'unverified' : 'valid');
  const _rep = {
    reportId:'AUD'+Date.now(), pathId:path.id||'P', summary:{
      totalCost:path.cost, status:path.status, nodes:path.path.length,
      key:'最优路径 '+path.path.join('→'), usedSystem:path.usedSystem||path.system||'2'
    },
    details, evidence, constraints, unknown, uncertainty, proof,
    // ⑧ 自验证段（吸收 Chain-of-Verification / 自验证提示 思想）：对结论做反向证伪，而非直接信任前向推理
    selfVerification: selfVerify(path, WORLD),
    // ⑨ 反思段（吸收 Reflexion: 语言式强化学习 思想）：确定性复盘写入情景记忆，不更新权重、可审计
    reflection: reflect(path, opts.feedback),
    reproducible, meta: metaCognition({path}), status, generatedAt:new Date().toISOString(), version:'2.0',
    // ⑩ 信念修正段：推测与事实偏差时自我修正的轨迹（Banach 压缩 / KL I-投影），使大脑诚实"认错并贴合事实"
    beliefRevision: {
      recent: (WORLD._corrections || []).slice(-5),
      count: (WORLD._corrections || []).length,
      principle: '事实与推测偏差时，用 Banach 压缩映射(标量) / 最小交叉熵 I-投影(分布) 修正推测使其贴合事实'
    },
    grounding:{perception:GROUNDING.PERCEPTION, reason:GROUNDING.KERNEL, proof:GROUNDING.PROOF},
    // 诚实修复：noHallucination 不再恒 true——仅当结论被证明验证或已诚实声明不可判定时才声称,
    noHallucination: (path.status==='unknown' || proof.verified===true),
    // ⑪ 执行段（具身层）：记录最近一次物理执行的可审计轨迹（trace/deviations/replans/SAFE-STOP）
    embodied: (typeof LAST_EXECUTION !== 'undefined' && LAST_EXECUTION) ? {
      trace: LAST_EXECUTION.trace, deviations: LAST_EXECUTION.deviations, replans: LAST_EXECUTION.replans,
      haltReason: LAST_EXECUTION.haltReason,
      safeStop: !!(LAST_EXECUTION.haltReason && String(LAST_EXECUTION.haltReason).indexOf('SAFE-STOP') === 0)
    } : null
  };
  if(typeof EventBus !== 'undefined') EventBus.publish('audit', _rep);
  return _rep;
}
// ⑧ 自验证（吸收 Chain-of-Verification 2024 / 自验证提示 思想）：对结论做反向证伪——
//    独立用确定性内核复核路径与约束/知识库，而非直接信任前向推理链；幻觉被隔离在边界内。
// 自验证（Chain-of-Verification）：对结论做反向证伪——独立复核路径与硬约束，幻觉隔离在边界内
function selfVerify(path, world) {
  const contradictions = [];
  const hard = (path.opts && path.opts.hard) || [];
  hard.forEach(n => { if (path.path.includes(n)) contradictions.push({ kind: 'hard-constraint', detail: '路径经过禁行节点 ' + n }); });
  const hasUnknown = path.status === 'unknown';
  return { checked: true, contradictions, passed: contradictions.length === 0, unknownDeclared: hasUnknown, grounding: GROUNDING.PROOF, deterministic: true };
}
// ⑨ 反思闭环（吸收 Reflexion: 语言式强化学习 Shinn et al. 2023 思想）：不更新模型权重，
//    将本次运行的结构化反思写入情景记忆（ReflectionBuffer），供后续运行作为上下文——确定性、可审计、不幻觉。
const ReflectionBuffer = [];
function reflect(path, feedback) {
  const r = {
    ts: new Date().toISOString(),
    status: path.status,
    path: (path.path || []).join('→'),
    cost: path.cost,
    unknown: path.status === 'unknown' ? (path.U || []) : [],
    feedback: feedback || null,
    // 语言式强化：把失败/不可判定转成可行动的改进提示（语义梯度），而非标量奖励
    insight: path.status === 'optimal'
      ? '路径可达且代价最优；若同类任务重复，可复用此路径（系统1 快答复用）'
      : (path.status === 'unknown' ? '当前世界图下不可达/不可判定；需补充世界图边或放宽硬约束后再试（情景记忆已记录）' : '自验证未通过，存在冲突，须复核约束与知识库后再决策'),
    verbalReinforcement: true
  };
  ReflectionBuffer.push(r);
  if (ReflectionBuffer.length > 50) ReflectionBuffer.shift();
  return r;
}

// ⑤ 学习：反馈→置信度更新（正/负样本）+ 学习日志（文档 3.5）
// TODO(文档 Layer2/6): 启发式更新；PAC 样本复杂度界、在线凸优化、知识蒸馏未实现
// 学习：大脑不维护内置经验库；反馈经 EventBus 发布 / 回写世界图边置信，由外部物理身体持久化
function learn(path, success, step=0.1){
  const updated = path.slice(1).map((node,i)=>({ transition:path[i]+'→'+node, confidence: success?1:0, kind: success?'positive':'negative' }));
  const out = {updated, log:'学习日志：'+path.join('→')+' 反馈='+(success?'成功(正样本)':'失败(负样本)')};
  if(typeof EventBus !== 'undefined') EventBus.publish('learning', { type:'learn', path, success });
  return out;
}

// 物理载体接入：大脑只接收外部物理载体上报的硬软约束，不假设任何具体身体（如"充电座"）

// ================= 通用大脑 v3.0 扩层模块（此前均 TODO 桩，本次确定性实装） =================
// 注：需工业级外部求解器（Coq/Z3/Neo4j/Milvus）者，均用手写轻量等价版替代，并诚实标注"lite"。

// ① 感知数学原理：贝叶斯滤波迭代 + Banach 压缩映射收敛检测（文档 数学原理 二）
// 离散信念 b[s]；观测似然 P(O|s)；转移核 P(s'|s)；迭代 b' = η·P(O|s)·Σ P(s|s')·b(s') 至不动点
// ══════════════════════════════════════════════════════════════════════

// ① 感知收敛：消费 Banach 不动点定理（思想 = 完备度量空间上压缩映射有唯一不动点，且迭代误差有 a-priori 界）
// 判断"收敛/唯一性"由定理派生：L<1 ⟺ 压缩映射 ⟺ 唯一不动点 b* 存在且 d(b_n,b*)≤L^n/(1-L)·d_0；L≥1 ⟹ 不保证唯一，诚实降级。
function perceiveBelief(initial, observations, transitionKernel, maxIter, tol){
  let b = Object.assign({}, initial); const states = Object.keys(b);
  maxIter = maxIter || 100; tol = tol || 1e-6;
  const history = []; let L = 1, d0 = 0, iter = 0, converged = false, banachBound = Infinity;
  // 单步贝叶斯滤波 = 度量空间(信念单纯形, 全变差距离)上的映射 T: Δ→Δ
  function step(bb){
    const nb = {}; let norm = 0;
    for(const s of states){
      let acc = 0;
      for(const sp of states){ const tk = (transitionKernel[sp] && transitionKernel[sp][s] != null) ? transitionKernel[sp][s] : 0; acc += tk * (bb[sp] || 0); }
      const like = (observations && observations.likelihood && observations.likelihood[s] != null) ? observations.likelihood[s] : 1;

    const nb = step(prev);

// 信念自我修正（推测 vs 事实）：当观测事实与既有推测偏差，修正推测使其贴合事实。
// 数学思想（两层互补，均可审计、确定性）：
//   (A) 标量信念（如边概率 p）—— Banach 压缩映射：
//       修正算子 T(b)=α·o+(1−α)·b，α=c/(c+w)（事实置信 c / 先验权 w）。
//       Lipschitz 常数 L=1−α<1 ⟹ Banach 不动点定理保证唯一不动点 b*=o（事实本身），
//       且 |T(b)−o|=(1−α)|b−o| 严格几何收缩——每来一个新事实，推测就离事实更近。
//   (B) 分布信念（对若干假设的置信）—— 最小交叉熵原理(Jaynes I-投影)：
//       在"符合事实"的约束集 C 上取 q*=argmin_{q∈C} D_KL(q||p)，

function _normDist(d){ const s=Object.values(d).reduce((a,x)=>a+Math.max(0,x),0); const o={}; for(const k in d) o[k]=s>0?Math.max(0,d[k])/s:0; return o; }

    const c=(typeof opts.factWeight==='number'&&opts.factWeight>0)?opts.factWeight:1;
    const alpha=c/(c+w); const L=1-alpha;                 // ∈(0,1)，Banach 压缩常数

    const value=(1-alpha)*belief+alpha*fact;              // T(b)
    const residual=Math.abs(value-fact);                 // = L·residualBefore
    return { mode:'scalar-contraction', value:+value.toFixed(6), alpha:+alpha.toFixed(4),
      contractionL:+L.toFixed(4), contractive:L<1, fixedPoint:fact,
      residualBefore:+residualBefore.toFixed(6), residual:+residual.toFixed(6),
      deviationReduced:+(residualBefore-residual).toFixed(6),
      conformsToFact:residual<=residualBefore+1e-12,
      note:'T(b)=α·事实+(1−α)·推测，L='+L.toFixed(4)+'<1 ⟹ 反复修正必收敛到事实(Banach 不动点)' };
  }

    const p=_normDist(belief); let q=Object.assign({},p), constraintSatisfied=true, kind='none';
    if(fact && (fact.disallow||fact.exclude)){
      const ex=new Set(fact.disallow||fact.exclude);

      const like=fact.likelihood||fact.like; let ok=false;

      q=_normDist(q); kind=ok?'likelihood(贝叶斯后验)':'likelihood(无信息)';
    } else if(fact && fact.set && Array.isArray(fact.set)){
      for(const k of fact.set) q[k]=(typeof fact.value==='number')?fact.value:(p[k]||0);
      q=_normDist(q); kind='set';
      constraintSatisfied=fact.set.every(k=>Math.abs((q[k]||0)-(fact.value||0))<1e-9);
    }
    return { mode:'kl-iprojection', belief:q, kind, klToPrior:+_kl(q,p).toFixed(6),
      constraintSatisfied, conforming:constraintSatisfied,
      note:'最小交叉熵 I-投影 q*=argmin_{q∈C}D_KL(q||p)；'+kind+' 情形下推测已贴合事实约束，且相对先验改动最小' };

}

function fingerprintVec(fp){

// ③ 霍尔逻辑机器验证（升级：真实霍尔三元组 {pre} prog {post}——逐边校验不变量：连通 ∧ ¬hard ∧ w≥0 ∧ 代价单调）
function verifyHoarePath(path, world){

  const hard = world.hard || [];

  const pre = { cond: path.path[0] + '∈W', holds: world.nodes.includes(path.path[0]) };
  ok = ok && pre.holds;
  let acc = 0;
  for(let i = 1; i < path.path.length; i++){
    const from = path.path[i - 1], to = path.path[i];
    const edge = world.edges.find(e => e.from === from && e.to === to);
    const inHard = hard.includes(to);
    const w = edge ? edge.w : NaN;
    const holds = !!edge && !inHard && (edge.w >= 0) && (acc + w >= acc);
    acc = edge ? acc + w : acc;
    ok = ok && holds;
    steps.push({ i, from, to, invariant: '连通 ∧ ¬hard(' + to + ') ∧ w≥0 ∧ cost单调', edge: !!edge, inHard, w: edge ? edge.w : null, holds });
    if(!holds) break;
  }
  const goalNode = path.path[path.path.length - 1];
  const post = { cond: goalNode + '∈W ∧ 最优cost=' + path.cost, holds: world.nodes.includes(goalNode) };
  ok = ok && post.holds;
  return {
    verified: ok,
    method: '机器检查的结构化霍尔三元组证明（pre → invariant* → post，逐边验证不变量）',
    hoare: '{' + pre.cond + '} A* {' + steps.map(s => 'inv' + s.i).join(';') + '} {' + post.cond + '}',
    pre, post, steps, tool: 'lingjing-hoare-lite'
  };
}
// ③ 分布式 MCTS 调度器（D-MCTS）：并行分支探索 + 回溯 + 选最优（确定性分支收集，文档 3.2）
// ③ 探索层：真 MCTS 四步（ima_292 选择/扩展/模拟/回溯 + ima_285 蒙特卡洛估计）
// 原 DFS 改为标准 MCTS：UCB1 选择 → 未展开子扩展 → 随机模拟(蒙特卡洛) → 首次访问 MC 回溯(ima_285)
function dmcts(start, goal, opts){
  opts = opts || {}; const hard = new Set(opts.hard || []); _SOFT = new Set(opts.soft || []);
  if(!WORLD.nodes.includes(start) || !WORLD.nodes.includes(goal)) return { status:'unknown', reason:'起点/目标不在世界图' };
  const nodes = {};
  WORLD.nodes.forEach(s => { nodes[s] = { visits:0, value:0, children: WORLD.edges.filter(e=>e.from===s && !hard.has(e.to)).map(e=>e.to) }; });
  if(start!==goal && !nodes[start].children.length) return { status:'unknown', reason:'起点无可达边' };
  const budget = opts.iterations || 120, C = opts.c || 1.4, root = start, maxD = WORLD.nodes.length + 2;
  const ucb = s => nodes[s].visits===0 ? Infinity : nodes[s].value + C*Math.sqrt(Math.log(nodes[root].visits+1)/nodes[s].visits);
  const rollout = s => { let cur=s, d=0; while(cur!==goal && d<maxD){ const ch=nodes[cur].children; if(!ch.length) break; cur=ch[Math.floor(Math.random()*ch.length)]; d++; } return cur===goal?1:0; };
  for(let it=0; it<budget; it++){
    let path=[root], cur=root, seenSel=new Set([root]); // 选择(ima_292 Selection)
    while(nodes[cur].children.length && nodes[cur].visits>0 && nodes[cur].children.every(c=>nodes[c].visits>0) && !seenSel.has(cur) && path.length < maxD){
      let best=null, bv=-Infinity; for(const c of nodes[cur].children){ const v=ucb(c); if(v>bv){bv=v;best=c;} } if(!best) break; cur=best; path.push(cur); seenSel.add(cur); if(cur===goal) break;
    }
    if(cur!==goal && nodes[cur].children.length){ const unexp=nodes[cur].children.filter(c=>nodes[c].visits===0); if(unexp.length){ cur=unexp[Math.floor(Math.random()*unexp.length)]; path.push(cur); } } // 扩展
    const reward = (cur===goal)?1:rollout(cur); // 模拟(ima_285 蒙特卡洛)
    for(const s of path){ nodes[s].visits++; nodes[s].value += (reward - nodes[s].value)/nodes[s].visits; } // 回溯(首次访问 MC)
  }
  const path=[root]; let cur=root; const seen=new Set();
  while(cur!==goal && nodes[cur] && nodes[cur].children.length && !seen.has(cur)){
    seen.add(cur);
    // 若某子节点即目标，直接取之（避免循环图中贪心偏离）；否则取 UCB 值最高子节点
    const nx = nodes[cur].children.indexOf(goal) >= 0 ? goal
      : nodes[cur].children.slice().sort((a,b)=>nodes[b].value-nodes[a].value || nodes[b].visits-nodes[a].visits)[0];
    if(!nx) break; cur=nx; path.push(cur); if(path.length>maxD) break;
  }
  const reached = path[path.length-1]===goal;
  return { status: reached?'found':'unknown', best: reached?{path,cost:path.length-1}:null, path: reached?path:null,
    rootVisits: nodes[root].visits, goalValue: +(nodes[goal]?nodes[goal].value:0).toFixed(3),
    note:'真 MCTS 四步(ima_292 选择/扩展/模拟/回溯 + ima_285 蒙特卡洛估计)：UCB1 选择, 随机模拟, 首次访问 MC 回溯' };
}

function pacSampleBound(dvc, eps, delta){

  const m = Math.ceil((dvc * Math.log(1 / eps) + Math.log(1 / delta)) / (eps * eps));

//     back-door 另给有效调整集 adjustSet（=An(Y)\Desc(X)\{X}）供数值估计。
//   • identifiable=false → 返回 hedge（两个 c-component，见证不可识别，即 Tian-Pearl hedge 判据），诚实失败。
//   • 确定性、可审计、零依赖；手写完整 ID 算法（非 Wenöbst 生产引擎），但数学等价、可审计、不虚构。

      return { formula: (sumOver.length ? 'Σ_{' + sumOver.join(',') + '} ' : '') + parts.join('·') };

    const smaller = gComps.filter(c => c.length < S.length && c.every(v => S.includes(v)));

    const sumOverS = S.filter(v => !yS.has(v) && !xS.has(v));

    return { formula: (sumOverS.length ? 'Σ_{' + sumOverS.join(',') + '} ' : '') + parts.join('·') };
  }

    const res = ID({ nodes, adj, pa }, [...Ys], [...Xs]);
    let method = 'id-general', mediator = null;
    if (!hasLatent) {
      // 全观测 DAG：必可识别；有效调整集 = An(Y) \ Desc(X) \ {X}
      method = 'back-door';
      const AnYfull = ancOn({ nodes, adj, pa }, Ys); const DescX = descOn({ nodes, adj, pa }, Xs);
      const adjustSet = [...AnYfull].filter(v => !Xs.has(v) && !DescX.has(v));
      // 前门检测：完全观测中介 M 阻断所有 X→Y 有向路径（Pearl 前门准则，无需隐变量）

    }

    for (const M of nodes) { if (M === X || M === Y) continue; if (adj[X].has(M) && adj[M].has(Y) && !biAdj[M].size) { mediator = M; method = 'front-door'; break; } }
    return { identifiable: true, method, mediator, formula: res.formula,
      note: method === 'front-door' ? ('前门准则（含未观测混杂 X↔Y，中介=' + mediator + '）') : '半马尔可夫可识别（ID 算法）；数值 ACE 需通用 ΣΠ/Wald 估计器（见 doQuery 公式或后续 causalEffect 扩展）' };
  } catch (e) {
    if (e && e.hedge) return { identifiable: false, hedge: e.hedge, note: e.note || 'do-演算不可识别（hedge 见证）' };

}
// ④ 向后兼容别名：causalIdentifiable 现委托 identifiabilityID（单一真源，无重复引擎）
function causalIdentifiable(dag, X, Y, observed){ return identifiabilityID(dag, X, Y, observed); }

// ④c 反事实可识别性引擎（counterfactualIdentifiable）：Pearl 因果之梯第三级（反事实）的可识别性判定。

  for (const e of (dag.bidirected || [])) { // 双向边(未观测混杂)：事实 / 反事实 各一份

    }

    const doVars = [...new Set(S.map(n => Gp.subOf[n]).filter(s => s != null))];
    const formula = 'P' + (doVars.length ? '_{' + doVars.join(',') + '}' : '') + '(' + S.join(',') + ')';

  }

      twinGraphNodes: Gp.nodes.length, hasLatent: (dag.bidirected || []).length > 0,
      note: '反事实可识别（Shpitser-Pearl 2007 ID*；sound & complete）。数值反事实值：全观测线性情形见 counterfactual() 三步法；含未观测混杂时需孪生网络 SCM 估计（本引擎只判可识别+给 estimand，不虚构）。',
      grounding: GROUNDING.KERNEL };
  } catch (e) { if (e && e.fail) return { identifiable: false, fail: true, note: e.note || '反事实不可识别（ID* FAIL）', method: 'counterfactual-id*', grounding: GROUNDING.KERNEL }; throw e; }
}

// ⑤ 世界模型（lite）：结构方程模型 SEM + Pearl 反事实三步法（文档 3.4）
// 文档给 VAE/ADM-v2/MWA/反事实/Sim-to-Real（需神经网络+大数据，无算法定义）。
// 本实装诚实 lite 等价：线性 SEM（手写最小二乘）+ abduction/action/prediction 三步，
// 确定性、可复现、可审计；非 VAE/Transformer，不虚构潜空间推演。
function _ols(X, y){ // (XᵀX)⁻¹Xᵀy；高斯消元解 k×k，零依赖

  const M = XtX.map((row, a) => row.concat([Xty[a]]));
  for (let c = 0; c < k; c++) {
    let p = c; for (let r = c + 1; r < k; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    const t = M[c]; M[c] = M[p]; M[p] = t;

    for (let r = 0; r < k; r++) if (r !== c) { const f = M[r][c]; for (let j = c; j <= k; j++) M[r][j] -= f * M[c][j]; }
  }
  return M.map(row => row[k]);
}
function _predictVar(eq, st, ac, ov, ovv, noise) {

    const val = (ov && f === ov) ? ovv : ((st[f] != null ? st[f] : 0) + (ac[f] != null ? ac[f] : 0));

function learnWorldModel(samples, opts) {

  const feats = stateVars.concat(actionVars); const eqs = {}, residuals = {};

    const y = samples.map(s => (s.next && s.next[v] != null) ? s.next[v] : 0);
    const coef = _ols(Xb, y);

function simulate(model, state, action) {

// ⑥ 因果效应估计（do-演算：后门调整 + 前门准则，自动识别）：呼应已消费 ima_304 因果 / ima_301 反事实。

    if(!idr.identifiable) return { identifiable: false, hedge: idr.hedge, note: idr.note, method: 'do-calc-unidentifiable', grounding: GROUNDING.KERNEL };
    if(idr.method === 'front-door' && idr.mediator) opts.mediator = idr.mediator;          // 前门：两段式估计
    else if(idr.method === 'back-door') opts.adjustSet = idr.adjustSet;                     // 后门：调整后门集
    else return { identifiable: true, method: 'id-general', formula: idr.formula, mediator: idr.mediator,
      note: idr.note + '（数值 ACE 需通用 ΣΠ/Wald 估计器，见 doQuery 公式；本引擎仅证可识别）', deterministic: true, grounding: GROUNDING.KERNEL };
  }
  if (!model || model.error) return { error: '无模型' };
  if (!samples || !samples.length) return { error: '识别失败', reason: '样本为空' };
  // —— 前门准则分支（吸收 Pearl 前门 + Wienöbst/Jeong 识别算法思想）——
  if (opts.mediator) {
    const M = opts.mediator;
    const xs = samples.map(s => _sampVar(s, cause)); if (xs.some(v => v == null)) return { error: '前门不适用', reason: 'cause ' + cause + ' 在样本缺失' };
    const ms = samples.map(s => _sampVar(s, M)); if (ms.some(v => v == null)) return { error: '前门不适用', reason: '中介 ' + M + ' 在样本缺失' };
    const ys = samples.map(s => _sampVar(s, effect)); if (ys.some(v => v == null)) return { error: '前门不适用', reason: 'effect ' + effect + ' 在样本缺失' };
    const Xb1 = samples.map(s => [1, _sampVar(s, cause)]);
    const a = _ols(Xb1, ms); const alpha = +a[1].toFixed(6);           // 阶段1：M ~ 1 + X
    const Xb2 = samples.map(s => [1, _sampVar(s, M), _sampVar(s, cause)]);
    const b = _ols(Xb2, ys); const beta = +b[1].toFixed(6);            // 阶段2：Y ~ 1 + M + X
    const ace = +(alpha * beta).toFixed(6);
    return { ace, method: 'front-door-adjustment-linear-SEM', mediator: M, alpha, beta,
      identifiability: '前门三条件由调用方声明（M 截断所有 X→Y 路径 / 无 X→M 后门 / X 阻断 M→Y 后门）',
      handlesUnobservedConfounder: true, auditable: true, imaRef: ['ima_304', 'ima_301'], grounding: GROUNDING.KERNEL, deterministic: true,
      note: 'ACE(前门)=α·β=' + alpha + '×' + beta + '=' + ace + '；即使存在未观测混杂 U→X,Y，只要 M 完全观测且屏蔽 U，仍可识别 do 效应' };
  }
  // —— 后门调整分支（默认）——
  if (!model.eqs || !model.eqs[effect]) return { error: '后门准则不满足', reason: '结果变量 ' + effect + ' 不在世界模型' };
  const eq = model.eqs[effect];
  const feats = eq.features.slice();
  if (feats.indexOf(cause) < 0) return { ace: 0, method: 'back-door-adjustment-linear-SEM', adjustSet: [], auditable: true, imaRef: ['ima_304'],
    note: 'cause 不在 effect 结构方程中，直接 ACE=0（间接效应未实现，诚实边界）' };
  const adjustSet = opts.adjustSet || feats.filter(f => f !== cause);
  const cols = [cause].concat(adjustSet);
  const Xb = samples.map(s => [1].concat(cols.map(c => { const v = _sampVar(s, c); return v == null ? 0 : v; })));
  const y = samples.map(s => { const v = _sampVar(s, effect); return v == null ? 0 : v; });
  const coef = _ols(Xb, y);
  const ace = +coef[1].toFixed(6);
  // 未观测混杂警示：cause 对方程残差的线性依赖（工程化，非完全识别）
  const resid = samples.map((s, i) => { let p = coef[0]; for (let a = 0; a < cols.length; a++) p += coef[a + 1] * Xb[i][a + 1]; return y[i] - p; });
  const Xc = Xb.map(r => [1, r[1]]);
  const cr = _ols(Xc, resid);
  const unobservedWarn = Math.abs(cr[1]) > 0.05;
  return { ace, method: 'back-door-adjustment-linear-SEM', adjustSet, auditable: true, imaRef: ['ima_304', 'ima_301'],
    unobservedConfounderWarning: unobservedWarn, grounding: GROUNDING.KERNEL, deterministic: true,
    note: 'ACE=E[' + effect + '|do(' + cause + '=1)]-E[' + effect + '|do(' + cause + '=0)]，后门集=' + adjustSet.join(',') + (unobservedWarn ? '；残差警示可能存在未观测混杂（可改用前门准则：传 opts.mediator）' : '') };
}

const EventBus = {
  _subs: {}, log: [],
  on(type, fn){ (this._subs[type] || (this._subs[type] = [])).push(fn); return this; },
  off(type, fn){ if(this._subs[type]) this._subs[type] = this._subs[type].filter(f => f !== fn); },
  publish(type, payload){ const ls = this._subs[type] || []; const out = [];
    for(const fn of ls){ try { out.push(fn(payload)); } catch(e){ out.push({ error: e.message }); } }
    this.log.push({ type, ts: new Date().toISOString(), delivered: ls.length }); return { type, delivered: ls.length, results: out }; },
  reset(){ this._subs = {}; this.log = []; }
};

// 验证：PrSTL 概率信号时序逻辑运行时监控（安全停车，文档 验证架构）
// 验证：运行时监视器——消费 PrSTL 概率时序逻辑时态语义（ima_238/394）
//   把安全约束编译为时态公式并真值评估，而非仅比较标量：
//   • G(每步代价 within maxCost)         ≡ □(run ⇒ within(bound))  —— 全局(always)算子
//   • G(每步状态 ∉ hardNodes)            —— 硬约束节点全程不可达
//   G(φ) 的真值 = 轨迹 trace 每一步都满足 φ（时态算子语义，非 threshold 贴标）
function runtimeMonitor(path, safety){
  safety = safety || {}; const violations = [];
  const trace = (path.path||[]).map((st, i) => ({ state: st,
    cv: (path.steps && path.steps[i]) ? (path.steps[i].confidence) : null }));
  // PrSTL 求值辅助：G(φ) = 轨迹全步满足 φ
  const G = (phi) => trace.every(phi);
  // 公式1：G(每步代价 within maxCost) —— 逐边累加代价不得超 bound（比"末态 cost"更细，对应 temporal 全程约束）
  if(safety.maxCost != null){
    let acc = 0;
    for(const s of (path.steps||[])){ const e = WORLD.edges.find(e=>e.from===s.state && e.to===s.result); acc += e ? e.w : 0;
      if(acc > safety.maxCost) violations.push('cost>' + safety.maxCost + ' @' + s.state); }
    const termWithin = (path.cost != null) ? (path.cost <= safety.maxCost) : true;
    if(!termWithin) violations.push('terminal cost>' + safety.maxCost);
  }
  // 公式2：G(state ∉ hardNodes) —— 硬约束节点全程不得出现
  const hardOk = G(t => !(safety.hardNodes || []).includes(t.state));
  if(!hardOk) for(const n of (safety.hardNodes || [])) if(path.path.includes(n)) violations.push('违反硬约束节点 ' + n);
  const safe = violations.length === 0;
  return { safe, violations, action: safe ? 'continue' : 'SAFETY_STOP（安全停车）',
    prstl: { formula: 'G(run ⇒ within(' + (safety.maxCost || '∞') + ')) ∧ G(state ∉ hardNodes)',
      op: 'always(G)', evaluated: true, traceLen: trace.length,
      note: 'PrSTL 时态语义：G(φ) 真值 = 轨迹全步满足 φ（已真值评估，非标量贴标）' } };
}

// ⑤ 元认知与协调层（Layer 5，文档 5.1）——此前完全缺失；本实现确定性、可审计、不幻觉
// 职责：全局监控 / 不确定性管理（熵 H(K)）/ 知识缺口识别 / 冲突仲裁 / 探索-利用决策 / 资源调度
// 数学：H(K)=-Σ p(e)log p(e)（信息熵，单位 bit）；C(K)=1-冲突率-α·H(K)（一致性度量，文档七/八）
// 元认知与协调层：不确定性管理基于世界图（边概率信息熵），不依赖内置经验库
function metaCognition(opts={}){
  const edges = WORLD.edges||[];
  const nodes = WORLD.nodes||[];
  const ps = edges.map(e=>edgeP(e)).filter(p=>p>0&&p<1);
  const meanBit = ps.length ? -ps.reduce((a,p)=>a-(p*Math.log2(p)+(1-p)*Math.log2(1-p)),0)/ps.length : 0;
  const H = +meanBit.toFixed(4);
  const hard = (opts.hard||[]);
  const conflictEdges = edges.filter(e=>hard.includes(e.from)&&hard.includes(e.to));
  const conflict = conflictEdges.length > 0;
  const C = +(conflict?0.5:1).toFixed(4);
  const gaps = edges.filter(e=>edgeP(e)<(opts.threshold||0.6))
    .map(e=>({transition:e.from+'→'+e.to, confidence:+edgeP(e).toFixed(2), priority:+(1-edgeP(e)).toFixed(2), reason:'世界图边置信度低'}));
  const globalUncertainty = +(1-C).toFixed(4);
  const Hmax = (ps.length>1)? Math.log2(ps.length):1;
  const uncertaintyFraction = Hmax>0? +(H/Hmax).toFixed(4):0;
  const mode = (gaps.length>0 || uncertaintyFraction>0.5)?'explore':'exploit';
  const pathUnc = opts.path? quantifyUncertainty(opts.path):null;
  return {
    layer:5, name:'元认知与协调层',
    monitoring:{worldNodes:nodes.length, worldEdges:edges.length, lowConfEdges:gaps.length},
    uncertainty:{global:globalUncertainty, entropyH:H, consistencyC:C, path:pathUnc, maxEntropyHmax:+Hmax.toFixed(4), uncertaintyFraction},
    knowledgeGaps:gaps,
    conflictArbitration: conflictEdges,
    decision:{exploreExploit:mode, uncertaintyFraction,
      reason: mode==='explore'?'信息论驱动：世界图熵分数偏高或存在低置信边 → 探索':'世界图置信度高 → 利用'},
    resource:{recommend: gaps.length>3?'high':'low', note:'缺口越多建议分配更多推理资源'}
  };
}

// 能力注册表（契约：{id, layer, name, run(ctx)}）—— 外部切片可 register 接入，受 OS 统一调度
const Capabilities = {
  _reg: {},
  register(cap){
    if(!cap || !cap.id || !cap.layer || typeof cap.run !== 'function')
      throw new Error('能力契约不合：需 {id, layer, name, run(ctx)}');
