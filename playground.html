<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵境 LingJing · 零安装 Playground（可审计不幻觉大脑）</title>
<style>
  :root{ --bg:#0f1420; --card:#1a2233; --ink:#e6edf6; --mut:#9fb0c8; --line:#2c3a52;
         --red:#ff5d5d; --grn:#37d67a; --yel:#ffce54; --blu:#4ea1ff; }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:20px}
  h1{font-size:20px;margin:0 0 4px} .sub{color:var(--mut);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  label{display:block;color:var(--mut);margin:8px 0 4px;font-size:12px}
  input,textarea{width:100%;background:#0c1119;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:8px;font:13px/1.5 ui-monospace,Consolas,monospace}
  textarea{min-height:150px;resize:vertical}
  .row{display:flex;gap:10px}.row>*{flex:1}
  button{background:var(--blu);color:#04101f;border:0;border-radius:7px;padding:9px 14px;font-weight:700;cursor:pointer;margin-top:10px}
  button.ghost{background:#26334a;color:var(--ink)}
  .out{background:#0c1119;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:120px;white-space:pre-wrap;font:12.5px/1.55 ui-monospace,Consolas,monospace;overflow:auto}
  .tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;margin-right:6px}
  .t-det{background:rgba(55,214,122,.16);color:var(--grn)}
  .t-llm{background:rgba(255,206,84,.16);color:var(--yel)}
  .t-proof{background:rgba(78,161,255,.16);color:var(--blu)}
  svg{width:100%;height:240px;background:#0c1119;border-radius:8px;border:1px solid var(--line)}
  .legend{color:var(--mut);font-size:12px;margin-top:6px}
  code{background:#0c1119;padding:1px 5px;border-radius:4px;color:var(--yel)}
</style>
</head>
<body>
<h1>灵境 LingJing · 零安装 Playground</h1>
<div class="sub">本地确定性、可审计、<b>不幻觉</b>的世界大脑。双击本文件即可用，无需安装、无需服务器。<br>
决策依据是内核 A*（<span class="tag t-det">DETERMINISTIC 不幻觉</span>）；勾选"一句话指令"才会调用免费 LLM 理解人话（<span class="tag t-llm">可能幻觉</span>，仅用于理解，不进证明链）。</div>

<div class="grid">
  <div class="card">
    <label>世界图（JSON；边用 <code>{from,to,w,p}</code>，w=代价）</label>
    <textarea id="world">{
  "nodes": ["CHARGE","A","B","C"],
  "edges": [
    {"from":"CHARGE","to":"A","w":1,"p":1},
    {"from":"A","to":"B","w":2,"p":1},
    {"from":"B","to":"C","w":3,"p":1},
    {"from":"CHARGE","to":"C","w":7,"p":1}
  ],
  "coord": {"CHARGE":[0,0],"A":[1,0],"B":[2,0],"C":[3,0]}
}</textarea>
    <div class="row">
      <div><label>起点</label><input id="start" value="CHARGE"></div>
      <div><label>目标</label><input id="goal" value="C"></div>
    </div>
    <div class="row">
      <div><label>硬约束（禁行节点，逗号分隔）</label><input id="hard" placeholder="如 A"></div>
      <div><label>软约束（尽量绕开，逗号分隔）</label><input id="soft" placeholder="如 B"></div>
    </div>
    <button onclick="runPlan()">① 运行规划（确定性内核，离线可用）</button>

    <label style="margin-top:14px">一句话指令（可选，调免费 LLM 理解人话）</label>
    <input id="ask" placeholder="如：机器人电量低，去 C 点充电">
    <label>OpenRouter 免费 Key（可选；不填则一句话功能不可用）</label>
    <input id="key" type="password" placeholder="sk-or-...">
    <button class="ghost" onclick="runAsk()">② 一句话接入大脑（askBrain）</button>
  </div>

  <div class="card">
    <label>世界图可视化</label>
    <svg id="svg" viewBox="0 0 400 280"></svg>
    <div class="legend">● 节点　— 边（代价）　<span style="color:var(--red)">━</span> 规划路径（高亮）</div>
    <label style="margin-top:8px">输出（路径 / 审计 / 不幻觉分层）</label>
    <div class="out" id="out">点击「运行规划」查看结果。</div>
  </div>
</div>

<script src="./lingjing.umd.js"></script>
<script>
const L = window.LingJing;
const $ = id => document.getElementById(id);
function setOut(s){ $('out').textContent = s; }

function drawGraph(world, path){
  const svg = $('svg'); svg.innerHTML = '';
  const nodes = world.nodes || [];
  const coords = world.coord || {};
  const pos = {};
  if (nodes.length && nodes.every(n => coords[n])) {
    const xs = nodes.map(n=>coords[n][0]), ys = nodes.map(n=>coords[n][1]);
    const minx=Math.min(...xs), maxx=Math.max(...xs), miny=Math.min(...ys), maxy=Math.max(...ys);
    const sx = v => 40 + (v-minx)/((maxx-minx)||1)*320;
    const sy = v => 40 + (v-miny)/((maxy-miny)||1)*200;
    nodes.forEach(n => pos[n] = [sx(coords[n][0]), sy(coords[n][1])]);
  } else {
    const N = nodes.length;
    nodes.forEach((n,i)=>{ const a = 2*Math.PI*i/N - Math.PI/2; pos[n]=[200+140*Math.cos(a), 140+100*Math.sin(a)]; });
  }
  const NS='http://www.w3.org/2000/svg';
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  (world.edges||[]).forEach(e=>{
    const a=pos[e.from], b=pos[e.to]; if(!a||!b)return;
    svg.appendChild(mk('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#3a4a66','stroke-width':1.5}));
  });
  if (path && path.length>1){
    for(let i=0;i<path.length-1;i++){
      const a=pos[path[i]], b=pos[path[i+1]]; if(!a||!b)continue;
      svg.appendChild(mk('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#ff5d5d','stroke-width':3}));
    }
  }
  nodes.forEach(n=>{
    const p=pos[n]; if(!p)return;
    svg.appendChild(mk('circle',{cx:p[0],cy:p[1],r:14,fill:'#1a2233',stroke:'#4ea1ff','stroke-width':2}));
    const t=mk('text',{x:p[0],y:p[1]+4,fill:'#e6edf6','font-size':10,'text-anchor':'middle'});
    t.textContent=n; svg.appendChild(t);
  });
}

function runPlan(){
  try{
    const world = JSON.parse($('world').value);
    L.setWorld(world);
    const start = $('start').value.trim() || 'CHARGE';
    const goal  = $('goal').value.trim();
    const hard = $('hard').value.split(',').map(s=>s.trim()).filter(Boolean);
    const soft = $('soft').value.split(',').map(s=>s.trim()).filter(Boolean);
    const r = L.reason(start, goal, { hard, soft });
    const a = L.generateAudit(r, { hard, soft });
    let s = '';
    s += '【规划】状态: ' + (r.status==='optimal' ? '最优路径' : '不可判定 𝕌') + '\n';
    if (r.status==='optimal'){
      s += '路径: ' + r.path.join(' → ') + '\n代价: ' + r.cost + '\n';
    } else { s += 'U: ' + JSON.stringify(r.U||[]) + '\n'; }
    s += '\n【七段审计】' + a.status + (a.proof&&a.proof.hoare ? '  | 霍尔证明 {P} C {Q} 已验证' : '') + '\n';
    s += '约束: ' + (a.constraints?a.constraints.length:0) + ' 条 ｜ 不确定性量化: ' + (a.uncertainty?JSON.stringify(a.uncertainty).slice(0,80):'—') + '\n';
    s += '\n【不幻觉分层】\n';
    s += '  <span class="tag t-det">DETERMINISTIC</span> 推理/审计来自本地内核，可复现、不幻觉\n';
    s += '  <span class="tag t-llm">UNVERIFIED_LLM</span> 免费 LLM 仅做感知理解，可能幻觉，不计入决策\n';
    s += '  <span class="tag t-proof">AUDITED</span> 审计报告含形式化证明证书，可机器验证\n';
    setOut(s);
    drawGraph(world, r.status==='optimal' ? r.path : null);
  }catch(e){ setOut('错误: ' + e.message); }
}

async function runAsk(){
  const text = $('ask').value.trim();
  if (!text){ setOut('请先输入一句话指令。'); return; }
  const key = $('key').value.trim() || undefined;
  try{
    const r = await L.askBrain(text, key);
    if (!r.ok){ setOut('一句话功能需要 OpenRouter 免费 Key（感知层）。\n未填 Key 时请直接用「运行规划」走确定性内核。\n返回: ' + JSON.stringify(r)); return; }
    let s = '【大脑理解·感知】' + JSON.stringify(r.percept) + '\n';
    s += '【确定性规划】' + (r.reason.status==='optimal' ? r.reason.path.join(' → ') + ' (代价 '+r.reason.cost+')' : '不可判定 𝕌') + '\n';
    s += '【大白话解释·可能幻觉】' + (r.explanation&&r.explanation.ok ? r.explanation.text : '(解释不可用)') + '\n';
    s += '\n【不幻觉分层】' + JSON.stringify(r.grounding) + '\n' + r.disclaimer;
    setOut(s);
    if (r.reason && r.reason.status==='optimal') drawGraph(JSON.parse($('world').value), r.reason.path);
  }catch(e){ setOut('错误: ' + e.message); }
}
</script>
</body>
</html>
